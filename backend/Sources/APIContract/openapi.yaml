openapi: 3.1.0

# ─────────────────────────────────────────────────────────────────────────────
# Contrato REST de la API backend. **Fuente de verdad**: el enfoque es *design-first*
# (§9.1 del LLD-001, cerrada en D-65) con swift-openapi-generator + swift-openapi-vapor,
# así que de este fichero se generan los tipos y el APIProtocol que el servidor conforma.
#
# OJO al editar: el generador emite **tipos, no validación**. `readOnly`, `pattern`,
# `minLength`/`maxLength`, `minimum`/`maximum`, `maxItems`, `minProperties`, `default`,
# `tags` y `security` los **ignora** — se conservan aquí como contrato documentado y los
# comprueba el linter. Quién hace cumplir cada cosa: LLD §5.5 (tabla) y D-65.
#
# Estado: **completo** — las 20 entidades de §3.2 del LLD tienen contrato.
#
# Referencias `§x` → docs/API_y_BBDD LLD-001.md
# Referencias `D-nn` → docs/API_y_BBDD LLD-Anexo-Decisiones-Disenho-001.md (bitácora de decisiones)
# ─────────────────────────────────────────────────────────────────────────────

info:
  title: API de gestión técnica de clubes de fútbol
  version: 0.1.0
  license:
    name: Propietario — todos los derechos reservados
    identifier: LicenseRef-Proprietary
  description: |
    API *tenant-aware* para la gestión de estadísticas de clubes de fútbol base.
    La consumen el **backoffice web** (escritura) y las **apps móviles** (lectura).

    **Qué se puede escribir aquí y qué no (§5.1).** El backend tiene dos módulos que
    comparten modelo de datos: este **BFF** y la **ingesta** de la API de la federación.
    Cada entidad tiene **un solo dueño de escritura**, y de ahí la regla que gobierna
    todo este contrato:

    > El BFF **corrige** lo que la ingesta trae; no **crea** ni **borra** filas
    > **emparejadas** con la federación.

    Por eso `OpponentClub`, `Round` y `Match` **no tienen `POST` ni `DELETE`**: una fila
    creada a mano nacería sin identificador de federación, la ingesta no la reconocería y
    la duplicaría; y una fila borrada reaparecería en la siguiente sincronización.
    `Season` y `Competition` sí los tienen, porque no son *salida* de la ingesta sino
    su **entrada**: la coordenada que le dice qué sincronizar.

    **`Team` es distinto y tiene `POST`** (D-66): el club forma el equipo, lo inscribe en
    la federación y **solo entonces** la federación publica calendario. La federación es
    fuente de verdad del *calendario*, no del *equipo*. Un equipo vive **sin emparejar**
    desde que el club lo crea hasta que se engancha (`POST /teams/{teamId}/federation-link`,
    D-67), y mientras tanto no tiene segundo escritor: por eso admite también `DELETE`.
    La otra mitad de la regla es que **la ingesta no crea equipos propios** — todo lo que
    encuentra y no reconoce es, por construcción, de un `OpponentClub`.

    **Multi-tenancy (§6).** Ningún recurso lleva `clubId` en la ruta ni en el cuerpo:
    el club se resuelve a partir del *claim* `club_id` del JWT (y/o del subdominio) y
    la petición se sirve contra el *schema* de ese club. Un token solo puede ver y
    modificar los datos de su propio club.

    **Errores (§5.4).** Todas las respuestas de error usan RFC 7807 *Problem Details*
    con `Content-Type: application/problem+json`.

servers:
  - url: https://{tenant}.{host}/v1
    description: Instancia desplegada. El subdominio identifica al club (§6.1).
    variables:
      tenant:
        default: demo
        description: Subdominio del club.
      host:
        default: example.com
        description: Dominio del despliegue.
  - url: /v1
    description: Desarrollo local.

security:
  - bearerAuth: []

tags:
  - name: Club
    description: |
      Datos del club. Recurso *singleton* del tenant (§3.2, §4.2).

      **Escribe:** el administrador (contenido). El **alta y la baja son provisión** (§6.3), no operaciones
      de esta API.
  - name: Seasons
    description: |
      Temporadas del club.

      **Escribe:** el administrador. Es **entrada de la ingesta** (§5.1): `federationSeasonId` es el
      parámetro con el que se llama a la federación, no un dato que ella nos devuelva.
  - name: Competitions
    description: |
      Competiciones: la instancia de una liga en una temporada.

      **Escribe:** el administrador. Es **entrada de la ingesta** (§5.1) — la coordenada que dice *qué*
      sincronizar. Nadie descubre su grupo: lo elige un humano navegando la web de la federación y pega
      aquí la URL resultante (§3.7).
  - name: OpponentClubs
    description: |
      Clubes rivales. Identidad del club contrario, **separada de sus equipos** (§3.6): un mismo club
      rival suele tener equipo en varias categorías, y así su nombre y escudo viven en una sola fila.

      **Escribe:** la **ingesta**. Esta API solo permite **corregir** (`PATCH`), nunca crear ni borrar
      (§5.1).
  - name: Teams
    description: |
      Equipos, propios y rivales.

      **Escribe:** los **propios, el club** (`POST`, y `DELETE` mientras no estén emparejados) — el club
      forma el equipo antes de que exista calendario (D-66). Los **rivales, la ingesta**, que nunca crea
      propios. Sobre unos y otros, esta API permite **corregir** (`PATCH`), **enganchar con la
      federación** (`/federation-link`) y **reclamar la propiedad** (`/ownership`) (§5.1).
  - name: Rounds
    description: |
      Jornadas de una competición. **Eje de navegación** de la app: resultados y clasificación por jornada
      (§3.4).

      **Escribe:** la **ingesta**, y solo ella. **Solo lectura, sin `PATCH`** (§5.1): número y fechas los
      fija el calendario de la federación, así que no hay nada corregible a mano.
  - name: Matches
    description: |
      Partidos: calendario y resultado. De él cuelga todo el detalle manual y de él se derivan la
      composición de la competición y el rendimiento de equipo (§3.4).

      **Escribe:** la **ingesta**, y solo ella. **Solo lectura** (§5.1), pero por motivo distinto al de
      `Round`: lo que aporta el club son sus **hijos** (`Goal`, `Card`, `Appearance`), no sus campos. El
      marcador es de la federación; cómo se llegó a él es del club.
  - name: Standings
    description: |
      Clasificación por jornada. Es un ***snapshot***: cada jornada tiene la suya, y de ahí salen la columna
      PREV y la navegación entre jornadas.

      **Escribe:** la **ingesta**, y solo ella — ingerida, o **calculada** desde `Match` en las jornadas que
      la fuente ya no sirve (D-15, D-55). Las dos vías son del mismo módulo, así que la tabla conserva **un
      único escritor**; la procedencia se expone una vez por tenant en
      `ClubResponse.federationProvidesRoundStandings` (D-29).
  - name: Players
    description: |
      Plantilla: los jugadores del club, **solo de equipos propios** (§3.7). Una fila es *un jugador en un
      equipo en una temporada* (D-05), y de ella cuelgan los eventos manuales.

      **Escribe:** el administrador. Primer recurso de **dominio manual** y por tanto el primero con **CRUD
      completo** (§5.1): la federación no publica plantillas de fútbol base, así que no hay frontera que
      respetar.
  - name: Absences
    description: |
      Ausencias: periodos en los que un jugador **no está disponible**. De ellas sale el distintivo
      DISPONIBLE / NO DISPONIBLE de la ficha de plantilla.

      **Escribe:** el administrador. **Interna del agregado `Player`** (§4.2) pero en ruta plana con ámbito
      obligatorio, igual que `Round` dentro de `Competition` (§5.1).

      **No confundir con `Appearance`**: una ausencia es un **periodo**; una convocatoria, un **hecho por
      partido**. Ninguna se deriva de la otra (D-41).
  - name: Appearances
    description: |
      Convocatorias: qué hizo cada jugador en cada partido y, opcionalmente, cuántos minutos. De aquí salen
      los recuentos JUGADOS / BAJA MÉDICA / SANCIÓN / NO CONVOCADO de la pantalla de estadísticas.

      **Escribe:** el administrador. Primera de las tres entidades hijas de `Match` (§4.2), y la que fija su
      patrón: **CRUD completo** en **ruta plana con ámbito obligatorio** (§5.1). La federación no publica
      alineaciones de fútbol base, así que no hay frontera con la ingesta que respetar.

      **Complementa a `Absence`, no la duplica** (D-41): un lesionado de baja larga genera **una** `Absence`
      y **tantas** `Appearance` con `status = baja_medica` como partidos se pierda. Las dos las registra el
      administrador.
  - name: Cards
    description: |
      Tarjetas: amarillas y rojas por jugador y partido. De ellas salen el recuento de la ficha y las
      **amarillas pendientes de sanción** — la distancia al siguiente tramo (D-10).

      **Escribe:** el administrador. Segunda entidad hija de `Match` (§4.2), con el mismo patrón que
      `Appearance`: CRUD completo en ruta plana con ámbito obligatorio (§5.1).

      **Una fila es una sanción, no una cartulina** (D-45): la doble amarilla es **una** fila `roja` con
      `isSecondYellow = true`.

      **De aquí no sale ninguna `Absence` automática** (D-10).
  - name: LeagueScorers
    description: |
      Ranking de goleadores de la competición, **incluidos los rivales**. Es la pantalla "LIGA" de la app.

      **Escribe:** la **ingesta**, y solo ella. Esta API es de **solo lectura** (§5.1), como `Round`,
      `Match` y `StandingRow`.

      **Se ingiere, no se calcula** (D-09): el ranking incluye jugadores de los que no tenemos plantilla.
      Por eso **no está ligada a `Player`** —`fullName` y `teamLabel` son texto del proveedor, no claves— y
      la vista de goleadores lee de aquí, **no de `Goal`**.

      **Sin *fallback*, a diferencia de la clasificación** (D-48): solo existe si el proveedor lo publica.
      La capacidad se declara en `ClubResponse.federationProvidesScorers`; una lista vacía es legítima.
  - name: SanctionBrackets
    description: |
      Tramos de sanción por acumulación de amarillas, **configurables por competición** (D-10): p. ej.
      `0-5, 6-10, 11-13, 14-16`. De aquí salen las **amarillas pendientes** de la ficha de jugador (§3.4).

      **Escribe:** el administrador. Es **configuración, no un hecho** —único caso del contrato— y de ahí
      sus dos rarezas: **sin borrado lógico** (§4.4) y **sin escritura fila a fila**.

      **Los tramos son una secuencia** (D-50): un tramo suelto no significa nada y un hueco los invalida a
      todos, así que la unidad de escritura es el **conjunto entero** — un `PUT`, no un CRUD por fila.

      **De aquí no nace ninguna sanción automática** (D-10).
  - name: Goals
    description: |
      Goles, **con su desglose**: zona, lado, parte del cuerpo, tipo de jugada y asistencia. Entidad más
      ancha del modelo; sostiene los bloques GOLES MARCADOS y GOLES RECIBIDOS de la pantalla de
      estadísticas (§3.4).

      **Escribe:** el administrador. Tercera y última entidad hija de `Match` (§4.2).

      **Cubre las dos direcciones** —el club registra también el desglose de lo que encaja— pero **no** los
      partidos entre rivales: el detalle manual solo existe donde juega un equipo propio (§3.7).

      **Denormaliza el equipo que marca y el que encaja** (D-04) para filtrar goles a favor y en contra
      **sin *join***. Esa denormalización **no llega al DTO** (D-54): se escribe quién marca, el servidor
      deriva quién encaja.

      **Todo el desglose es opcional** (D-04). Los desgloses de la pantalla **no suman el total**: es lo
      esperado, no un error (D-11).
  - name: StaffMembers
    description: |
      Personal del club, **técnico o no**: la identidad de las personas que trabajan en él.

      **Escribe:** el administrador. Existe separada de `auth.users` —que es de **proyecto**, no de tenant
      (D-59)— y su `userId` es **anulable**: el club monta la estructura de la pretemporada antes de que
      nadie haya aceptado la invitación.
  - name: StaffPositions
    description: |
      Catálogo de puestos del club: Director Técnico, Coordinador, Entrenador…

      **Escribe:** el administrador. Es **dato, no estructura** (D-60): se precarga con una propuesta y cada
      club lo edita. Un puesto declara **sobre qué eje** de la identidad de `Team` alcanza (`scopeKind`), no
      una lista de categorías — por eso "Coordinador" es **un** puesto y no siete.
  - name: StaffAssignments
    description: |
      Quién ocupa qué puesto, sobre qué ámbito y en qué temporada.

      **Escribe:** el administrador **y los coordinadores**, por la regla del nivel (D-62). **Múltiple a
      propósito**: un coordinador casi siempre entrena además a un equipo.
  - name: Permissions
    description: |
      Catálogo de **verbos** autorizables. Un verbo es un **caso de uso** (D-61), no un método HTTP.

      **No lo escribe nadie**: lo fija el código y esta API lo publica. Es el único recurso del contrato
      que no sale de la base de datos.
  - name: Me
    description: |
      El contexto del actor de la petición: quién es, qué asignaciones tiene y qué puede hacer.

      **Conveniencia de la UI, no autoridad** (§7.4): sirve para decidir qué botones se pintan. La
      comprobación real ocurre siempre en el caso de uso.
  - name: Ingestion
    description: |
      El **registro de las pasadas de ingesta** y el disparador manual (D-85, D-87).

      Es el único recurso del contrato que **no describe al club sino a su sincronización**. Su escritor
      natural es el job (§2.3-b), que corre solo y sin nadie delante; esto es lo que permite mirar por
      qué falta un partido días después, y relanzar una pasada sin esperar al cron.

      **Escribe:** la **ingesta**. El `POST` no crea filas a mano — pide que el job pase, y las filas las
      escribe él.

paths:

  # ───────────────────────────── Club (§5.1) ─────────────────────────────
  /club:
    get:
      tags: [Club]
      operationId: getClub
      summary: Obtiene los datos del club
      description: |
        `Club` es el **singleton del tenant**: hay exactamente un registro por *schema* y
        el tenant ya lo determina el JWT, por lo que la ruta es **singular y sin `{id}`**.
        Es la única excepción a la convención de nombres en plural de este contrato.

        Accesible a cualquier rol autenticado del tenant (las apps de consulta necesitan
        nombre y escudo para las cabeceras).
      responses:
        '200':
          description: Datos del club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

    patch:
      tags: [Club]
      operationId: updateClub
      summary: Actualiza parcialmente los datos del club
      description: |
        Actualización **parcial**: los campos ausentes no se modifican.

        **No existe `POST` ni `DELETE` sobre `/club`**: el alta de un club es **provisión**
        (crear el *schema* y ejecutar el migrador, §6.3/§4.7) y la baja es *deprovisioning*;
        ambas viven en el **plano de control**, no en esta API. Lo que sí es dato de negocio
        editable es el **contenido** del club (nombre, escudo, preferencias), y para eso está
        este `PATCH`.

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClubRequest'
      responses:
        '200':
          description: Club actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            El cuerpo está bien formado y bien tipado, pero **incumple una regla**: `name` o
            `shortName` vacíos o solo con espacios (`minLength: 1`).

            **No es un 400.** El 400 es para lo que no se puede ni decodificar, o para el cuerpo
            sin ningún campo (`minProperties: 1`). Aquí el JSON es válido y el tipo correcto; lo
            que falla es el **valor**, y quien lo rechaza es el *Value Object* del Dominio
            (§5.5), no el adaptador — de modo que la ruta de ingesta, que no pasa por este
            contrato, queda sujeta a la misma regla.

            El `code` del *Problem* es `INVALID_VALUE` y el `detail` nombra el campo, para que la
            UI pueda señalarlo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ──────────────────────────── Seasons (§5.1) ────────────────────────────
  /seasons:
    get:
      tags: [Seasons]
      operationId: listSeasons
      summary: Lista las temporadas
      description: |
        Colección **pequeña** (pocas temporadas por club) → **sin paginación** (§5.3).
        Orden fijo por `endDate` **descendente** (la más reciente primero).
      parameters:
        - name: includeArchived
          in: query
          required: false
          description: Si es `true`, incluye también las temporadas archivadas (§5.1).
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Temporadas del club.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeasonResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [Seasons]
      operationId: createSeason
      summary: Crea una temporada
      description: |
        Solo se reciben `label` y `federationSeasonId`. El servidor **deriva**
        `startDate`/`endDate` a partir de `label` (01/07/AAAA → 30/06/AABB) y calcula
        `isCurrent` **en lectura** — no hay campos de fechas ni de `isCurrent` en la
        entrada, lo que reduce la superficie de error (§5.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeasonRequest'
      responses:
        '201':
          description: Temporada creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            Conflicto: ya existe una temporada con ese `label` o ese `federationSeasonId`
            (ambos son únicos dentro del club, §3.5).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /seasons/{seasonId}:
    parameters:
      - $ref: '#/components/parameters/SeasonId'

    get:
      tags: [Seasons]
      operationId: getSeason
      summary: Obtiene una temporada
      responses:
        '200':
          description: Temporada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Seasons]
      operationId: updateSeason
      summary: Actualiza parcialmente una temporada
      description: |
        Actualización **parcial**: los campos ausentes no se modifican. Cambiar `label`
        **recalcula** `startDate`/`endDate` (siguen siendo derivadas y no *overridables*, §3.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSeasonRequest'
      responses:
        '200':
          description: Temporada actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conflicto - `label` o `federationSeasonId` duplicados.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags: [Seasons]
      operationId: deleteSeason
      summary: Borra una temporada (o la purga en cascada)
      description: |
        Dos comportamientos según `cascade`:

        **1. Borrado normal (`cascade` ausente o `false`).** Solo tiene éxito si la temporada
        **no tiene dependientes**. Si los tiene → **409**. Para ocultar una temporada
        conservando sus datos, usa `PUT /seasons/{seasonId}/archive` (reversible), no este
        endpoint.

        **2. Purga (`cascade=true`) — operación protegida en dos pasos (§5.4).** Borrado
        **físico e irreversible** de la temporada y todo su subárbol; reservado a *erasure*
        RGPD ("derecho al olvido"). Exige:
          - **rol elevado** (§7.3) → si no, **403**;
          - el `confirmationToken` obtenido en `GET /seasons/{seasonId}/purge-preview`,
            enviado como **precondición** en la cabecera `If-Match` → **428** si falta,
            **412** si está caducado, alterado o no corresponde a esta temporada.

        La operación se **audita** (quién, cuándo, impacto confirmado).
      parameters:
        - name: cascade
          in: query
          required: false
          description: Si es `true`, purga física de la temporada y todo su subárbol.
          schema:
            type: boolean
            default: false
        - name: If-Match
          in: header
          required: false
          description: |
            `confirmationToken` devuelto por `purge-preview`, entre comillas.
            **Obligatorio cuando `cascade=true`**; se ignora en el borrado normal.
          schema:
            type: string
          example: '"c7f3a1e0-9b2d-4e15-8a6f-3d0c1b7e4a92"'
      responses:
        '204':
          description: Temporada borrada (o purgada).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Rol insuficiente para la purga en cascada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            La temporada tiene dependientes y no se pidió `cascade=true`.
            Archívala (reversible) o púrgala explícitamente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: Confirmación caducada, alterada o de otra temporada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: Falta la confirmación (`If-Match`) exigida por `cascade=true`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /seasons/{seasonId}/purge-preview:
    parameters:
      - $ref: '#/components/parameters/SeasonId'
    get:
      tags: [Seasons]
      operationId: previewSeasonPurge
      summary: Previsualiza el impacto de purgar una temporada
      description: |
        **Paso 1 del purge en dos pasos (§5.4).** Devuelve el recuento de registros que se
        borrarían por entidad dependiente y un `confirmationToken` opaco, de **un solo uso**
        y **corta vida**, que debe enviarse en `If-Match` al ejecutar
        `DELETE /seasons/{seasonId}?cascade=true`.

        Sirve además de **ancla de auditoría**: deja constancia de qué se mostró al usuario
        antes de que confirmara.

        Requiere **rol elevado** (§7.3).
      responses:
        '200':
          description: Impacto de la purga y token de confirmación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgePreviewResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /seasons/{seasonId}/archive:
    parameters:
      - $ref: '#/components/parameters/SeasonId'

    put:
      tags: [Seasons]
      operationId: archiveSeason
      summary: Archiva una temporada
      description: |
        Archivado **reversible** (*soft*): oculta la temporada y, de facto, su subárbol —
        la app navega por selector de temporada (§3.6). **Conserva todos los datos.**
        **Idempotente**: archivar una temporada ya archivada devuelve 204 igualmente.
      responses:
        '204':
          description: Temporada archivada.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Seasons]
      operationId: restoreSeason
      summary: Restaura (desarchiva) una temporada
      description: |
        Deshace el archivado. **Idempotente**: restaurar una temporada no archivada devuelve
        204 igualmente. No confundir con `DELETE /seasons/{seasonId}`, que borra la temporada.
      responses:
        '204':
          description: Temporada restaurada.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── Competitions (§5.1) ───────────────────────
  /competitions/preview:
    post:
      tags: [Competitions]
      operationId: previewCompetition
      summary: Verifica una coordenada de la federación sin persistir nada
      description: |
        **Paso 1 del alta; no persiste nada.** Recibe la **URL del calendario** copiada de la web de la
        federación, la parsea, llama a la federación y devuelve modalidad, categoría, división, grupo,
        jornadas y **la lista de equipos**.

        **Por qué existe** (D-16): de esos cuatro parámetros cuelga todo el árbol de la competición, y un
        dígito equivocado **no da error** — sincroniza otro grupo en silencio. Esto convierte una
        correlación frágil en una **confirmada por un humano**, que ve su club en la lista antes de guardar.

        **No es descubrimiento**: no expone la navegación de la federación ni hace de proxy (§5.6). Solo
        verifica la coordenada que el administrador ya eligió.

        **Única operación del contrato que llama a un tercero de forma síncrona** (§2.3-c) → *timeout*
        corto y **502/504** explícitos, no un 500 genérico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewCompetitionRequest'
      responses:
        '200':
          description: Contenido de la coordenada. **No se ha creado nada.**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionPreviewResponse'
        '400':
          description: |
            La URL no es reconocible como un calendario de la federación del club, o le faltan
            parámetros.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: La federación respondió con un error o con un cuerpo no interpretable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: La federación no respondió dentro del *timeout*.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /competitions:
    get:
      tags: [Competitions]
      operationId: listCompetitions
      summary: Lista las competiciones
      description: Colección pequeña por club → **sin paginación** (§5.3).
      parameters:
        - name: seasonId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: modality
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Modality'
        - name: ageCategory
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TeamCategory'
        - name: gender
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Gender'
      responses:
        '200':
          description: Competiciones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetitionResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [Competitions]
      operationId: createCompetition
      summary: Da de alta una competición (entrada de la ingesta)
      description: |
        **Paso 2 del alta**: confirma lo que devolvió el `preview` y lo persiste.

        `Competition` **sí tiene `POST`** —a diferencia de `OpponentClub`— porque no es *salida* de la
        ingesta sino su **entrada** (§5.1): es la coordenada que le dice *qué* sincronizar. Sin ella no
        hay nada que ingerir, y nadie puede descubrirla por nosotros.

        **Pero este no es el camino del administrador** (D-67). Con los equipos creados por el club
        (D-66), la URL se pega **en la página del equipo** —`POST /teams/{teamId}/federation-link`—,
        donde el emparejamiento con el equipo local lo lleva la ruta en vez de haber que deducirlo. Este
        endpoint y su `preview` se conservan como la **vía estable para semillas, *scripts* y tests**
        (Decisión 3 de D-22), y por eso ya **no llevan `ownTeamFederationId`**: se mudó al enganche.

        Requiere **rol elevado** (§7.3): es configuración de integración, no dato del día a día.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompetitionRequest'
      responses:
        '201':
          description: Competición dada de alta. La sincronizará el siguiente pase del job (§2.3-b).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ese grupo ya está dado de alta en esa temporada (§3.5).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /competitions/{competitionId}:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'

    get:
      tags: [Competitions]
      operationId: getCompetition
      summary: Obtiene una competición
      responses:
        '200':
          description: Competición.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Competitions]
      operationId: updateCompetition
      summary: Actualiza parcialmente una competición
      description: |
        Dos clases de campo con reglas distintas:

        - **Rótulos** (`ageCategory`, `divisionLabel`, `groupLabel`): siempre editables. Es la misma
          corrección que en `OpponentClub` — texto que se muestra.
        - **Coordenadas** (`federationCompetitionId`, `federationGroupId`) **y `gender`**: editables
          **solo mientras no haya datos ingeridos** (`lastSyncedAt == null`). Cambiar las coordenadas
          después es **repuntar a otro calendario**, y dejaría los partidos y jornadas del anterior
          colgando de una competición que ya no los describe → **409**. Entonces la vía es borrar y volver
          a crear (§3.7). `gender` cae de este lado porque **se propaga**: la ingesta ya lo copió a cada
          `Team`, donde es parte de la clave única (D-58).

        No admite `seasonId`: una competición no se muda de temporada.

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompetitionRequest'
      responses:
        '200':
          description: Competición actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Se intenta cambiar una coordenada externa de una competición que **ya tiene datos
            ingeridos**.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags: [Competitions]
      operationId: deleteCompetition
      summary: Borra una competición
      description: |
        Solo si **no tiene dependientes** (jornadas, partidos, clasificación). Borrar la
        configuración con datos colgando dejaría huérfano el subárbol → **409**.

        Para deshacerse de una temporada entera **con** sus datos, la vía es el purgado de `Season`
        (`DELETE /seasons/{seasonId}?cascade=true`, §5.4), que es una operación protegida en dos pasos.

        Requiere **rol elevado** (§7.3).
      responses:
        '204':
          description: Competición borrada.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La competición tiene dependientes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ─────────────────────── OpponentClubs (§5.1) ───────────────────────
  /opponent-clubs:
    get:
      tags: [OpponentClubs]
      operationId: listOpponentClubs
      summary: Lista los clubes rivales
      description: |
        Colección potencialmente grande (todos los rivales de todas las categorías) → **paginada** (§5.3).
        El filtro `q` sirve a la pantalla de **revisión de datos ingeridos** (§3.7).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: q
          in: query
          required: false
          description: Búsqueda por nombre (coincidencia parcial, sin distinguir mayúsculas ni acentos).
          schema:
            type: string
      responses:
        '200':
          description: Página de clubes rivales.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OpponentClubResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

    # Sin POST: un alta manual nace sin `federationClubId` y la ingesta la duplicaría (D-21).

  /opponent-clubs/{opponentClubId}:
    parameters:
      - $ref: '#/components/parameters/OpponentClubId'

    get:
      tags: [OpponentClubs]
      operationId: getOpponentClub
      summary: Obtiene un club rival
      responses:
        '200':
          description: Club rival.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpponentClubResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [OpponentClubs]
      operationId: updateOpponentClub
      summary: Corrige un club rival
      description: |
        **Herramienta de corrección de la ingesta** (§3.7) y **única** escritura sobre esta entidad. Al
        vivir la identidad del club en **una sola fila**, corregir una errata es un `PATCH` que se propaga
        a todos sus equipos y categorías — la razón de ser de esta entidad.

        **La corrección sobrevive a la siguiente sincronización**: los campos descriptivos son de *semilla*
        (D-18).

        **No fusiona duplicados**: si la ingesta creó dos filas del mismo club, renombrar una no une sus
        equipos. Hace falta la fusión (pendiente, §3.7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOpponentClubRequest'
      responses:
        '200':
          description: Club rival actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpponentClubResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ya existe otro club rival con ese nombre.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    # Sin DELETE: reaparecería en la siguiente sincronización. Para duplicados, la fusión (§3.7).

  # ───────────────────────────── Teams (§5.1) ─────────────────────────────
  /teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: Lista los equipos
      description: |
        Colección pequeña por club → **sin paginación** (§5.3).

        Sobre `seasonId`: **`Team` no tiene temporada** (§3.2) — "Infantil A" es la misma entidad año tras
        año. El filtro responde con una **unión asimétrica** (D-68), porque las dos mitades no llegan por
        la misma puerta:

        - **propios** → de `TeamRegistration`, la inscripción que afirma el club (`PUT
          /teams/{teamId}/registrations/{seasonId}`). En junio el equipo ya existe y **todavía no hay un
          solo partido** del que derivar nada;
        - **rivales** → de la **derivación por participación** de D-27: equipos con algún partido, como
          local o como visitante, en alguna `Competition` de esa temporada (§3.4).

        Los dos conjuntos son **disjuntos** —un rival no se inscribe— así que no hay contradicción posible.
        El significado del filtro **no ha cambiado**; cambió de dónde sale la respuesta.
      parameters:
        - name: isOwn
          in: query
          required: false
          description: '`true` = solo equipos propios; `false` = solo rivales.'
          schema:
            type: boolean
        - name: seasonId
          in: query
          required: false
          description: Equipos que participan en alguna competición de esa temporada.
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TeamCategory'
        - name: gender
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Gender'
        - name: modality
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Modality'
        - name: opponentClubId
          in: query
          required: false
          description: Equipos de un club rival concreto.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Equipos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [Teams]
      operationId: createTeam
      summary: Crea un equipo del club
      description: |
        **El equipo es del club, no de la federación** (D-66). El club lo forma, lo inscribe en la
        federación y **solo entonces** la federación publica calendario: la federación es fuente de verdad
        del *calendario*, no del *equipo*. Por eso este alta no pide **ningún** dato de federación.

        Es lo que permite dar de alta plantilla (D-05) y cargos (D-60) en junio, meses antes de que exista
        competición — el tramo donde ocurren §9.8 y §9.9 y que hasta ahora era inexpresable.

        El equipo nace **sin emparejar** (`federationTeamId` nulo), **propio** (`opponentClubId` nulo) e
        **inscrito** en la temporada que indica `seasonId` (D-68) — sin esa inscripción no aparecería bajo
        ninguna temporada hasta tener calendario, que es justo lo que este alta adelanta. Para engancharlo
        con la federación, `POST /teams/{teamId}/federation-link`.

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Equipo creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: La temporada de `seasonId` no existe.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            Ya existe un equipo del club con esa categoría, letra, género y modalidad (§3.5).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'

    get:
      tags: [Teams]
      operationId: getTeam
      summary: Obtiene un equipo
      responses:
        '200':
          description: Equipo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Teams]
      operationId: updateTeam
      summary: Corrige un equipo
      description: |
        Actualización parcial: sirve para corregir lo que la ingesta dedujo mal, típicamente la letra
        separada del nombre con la letra embebida ("C.D. RIVAL 'B'", §3.7). Vale igual para los equipos
        propios que crea el club (D-66) y para los rivales que trae la ingesta.

        **No permite cambiar de club**: `opponentClubId` no es modificable — un equipo propio no se
        convierte en rival ni al revés; para eso está `/ownership`.

        **Tampoco permite cambiar `modality`**: forma parte de la identidad del equipo (§3.2) y de su
        clave única (§3.5). Un equipo de fútbol-sala no *pasa a ser* uno de fútbol-11: es otro equipo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: Equipo actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Ya existe otro equipo con esa categoría, letra, género y modalidad en el mismo club (§3.5).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags: [Teams]
      operationId: deleteTeam
      summary: Borra un equipo sin emparejar
      description: |
        **Solo mientras el equipo no esté emparejado con la federación** (D-66). Con `federationTeamId`
        ya escrito devuelve **409**: la federación lo sigue publicando y reaparecería en la siguiente
        sincronización (D-21). Para un equipo emparejado, "quitarlo" es **liberarlo** con
        `DELETE /teams/{teamId}/ownership`, no borrarlo.

        Requiere **rol elevado** (§7.3).
      responses:
        '204':
          description: Equipo borrado.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            El equipo está **emparejado** con la federación, o tiene dependientes (jugadores, cargos).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /teams/{teamId}/federation-link/preview:
    parameters:
      - $ref: '#/components/parameters/TeamId'

    post:
      tags: [Teams]
      operationId: previewFederationLink
      summary: Verifica el calendario antes de engancharlo al equipo
      description: |
        Primer paso del enganche (D-67). Recibe **la URL del calendario pegada del navegador**, la
        descompone, llama a la federación y devuelve lo que hay ahí. **No persiste nada.**

        Es **verificación, no descubrimiento**: no expone la navegación de la federación (§5.6). De esos
        cuatro números cuelga todo el árbol y un dígito mal no da error —devuelve otra cosa, o vacío— así
        que un humano tiene que reconocer su club en `teams[]` antes de confirmar (D-16).

        Única ruta síncrona con latencia de terceros junto a su gemela de competiciones: *timeout* corto y
        **502/504** explícitos (§5.4).

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationLinkPreviewRequest'
      responses:
        '200':
          description: Lo que hay en la coordenada. Nada persistido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationLinkPreviewResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: La federación respondió con un error o con un cuerpo no interpretable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: La federación no respondió dentro del *timeout*.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /teams/{teamId}/federation-link:
    parameters:
      - $ref: '#/components/parameters/TeamId'

    post:
      tags: [Teams]
      operationId: linkTeamToFederation
      summary: Engancha el equipo con su competición en la federación
      description: |
        Segundo paso del enganche (D-67), y **el único camino que lleva a sincronizar**.

        **Por qué se pega aquí y no en el alta de competición.** `ownTeamFederationId` dice *qué código de
        federación es del club*, no *a cuál de sus equipos corresponde*. Con doce equipos creados a mano,
        deducirlo en silencio recrearía el duplicado que D-66 evita. Pegando desde la página del equipo,
        **el emparejamiento lo lleva la ruta**.

        **Qué crea, en cascada:**

        1. **`Season`** — si el `temporada=…` de la URL no corresponde a ninguna del club. La etiqueta
           ("2024/25") no es deducible del código (`21`), pero el `preview` la lee de `seasons[]`, que va
           incrustado en la propia página del calendario (§F.7 del anexo RFFM).
        2. **`Competition`** — creada, o **reutilizada** si ya existía: dos equipos del club pueden caer en
           el mismo grupo, y el segundo enganche no puede volver a crearla (`alreadyRegistered`).
        3. **`TeamRegistration`** — la inscripción del equipo en esa temporada, si no la tenía ya (D-68).
           Es lo que hace que **todo equipo propio con calendario esté inscrito por construcción**, y por
           tanto que las dos mitades del filtro `?seasonId=` no puedan contradecirse.
        4. **`Team.federationTeamId`** — el enganche propiamente dicho.
        5. **`Round`, `Match`, `OpponentClub`** y sus equipos — los trae la primera ingesta.

        **Devuelve 202, no 201, y no es un detalle de implementación:** la primera ingesta no puede ser
        síncrona. En la RFFM el calendario es 1 petición; en la **FCF son ~34** (§5.6), contra HTML
        raspado y con el cuidado campo a campo de D-56. En línea, esto funcionaría en Madrid y daría
        *timeout* en Cataluña. Se **encola** y se devuelve algo que consultar.

        **Es aditivo**: un equipo juega liga *y* copa (D-12), así que se engancha una vez por competición.

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationLinkRequest'
      responses:
        '202':
          description: |
            Enganche escrito y primera ingesta **encolada**. El cuerpo trae con qué seguirla.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestJobResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            El equipo ya está emparejado con otro grupo, ese `federationTeamId` ya pertenece a otro
            equipo, o la identidad no cuadra: la competición dice un `gender`/`modality` distinto del
            que el equipo tiene congelado desde su alta (D-66). A diferencia del 409 de D-21, **este
            tiene salida**: se engancha otro equipo, o se corrige antes de confirmar.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: La federación respondió con un error o con un cuerpo no interpretable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: La federación no respondió dentro del *timeout*.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /teams/{teamId}/ownership:
    parameters:
      - $ref: '#/components/parameters/TeamId'

    put:
      tags: [Teams]
      operationId: claimTeam
      summary: Reclama un equipo como propio
      description: |
        **Corrección pura** (D-20, D-67), nunca el camino feliz: el club crea sus equipos (D-66) y los
        engancha con `POST /teams/{teamId}/federation-link`, y la ingesta **no crea equipos propios**.
        Esto cubre el caso en que un equipo del club acabó igualmente creado como rival — típicamente
        porque nadie lo enganchó antes de la primera sincronización.

        **No es un cambio de campo, es una orquestación:** pone `opponentClubId` a `null` y toma del
        `OpponentClub` asignado el nombre y el escudo para rellenar el `Club`. De ahí que sea sub-recurso
        de estado y no una relajación del `PATCH`.

        **Idempotente**. Requiere **rol elevado** (§7.3).
      responses:
        '204':
          description: Equipo reclamado como propio.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Ya existe otro equipo propio con la misma categoría, letra, género y modalidad (§3.5) —
            reclamar este violaría la unicidad.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags: [Teams]
      operationId: releaseTeam
      summary: Deshace la reclamación de un equipo
      description: |
        Devuelve el equipo a su `OpponentClub` de origen. Sirve para corregir una reclamación
        equivocada durante el *onboarding*.

        **Idempotente**: liberar un equipo que ya era rival devuelve 204. Requiere **rol elevado** (§7.3).
      responses:
        '204':
          description: Reclamación deshecha.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{teamId}/registrations/{seasonId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/SeasonId'

    put:
      tags: [Teams]
      operationId: registerTeamInSeason
      summary: Inscribe el equipo en una temporada
      description: |
        **Lo que el club afirma antes de que haya calendario** (D-68). `Team` no tiene temporada a
        propósito (§3.2) y la participación se deriva de los partidos (D-27) — pero entre junio, cuando el
        club forma el equipo, y septiembre, cuando la federación publica, **no hay partidos de los que
        derivar nada**. Esta inscripción es la que hace contestable el `?seasonId=` de junio, que es el
        tramo donde ocurren §9.8 y §9.9.

        **La temporada va en la ruta, no en el cuerpo**: el par (equipo, temporada) **es** el recurso. De
        ahí que el `PUT` sea idempotente por construcción y que no exista un `{registrationId}` que
        exponer — el síntoma que delató a `Participation` en su día.

        **Y la competición va en el cuerpo, como conjunto** (D-68, enmienda). La inscripción lleva también
        `competition_id` —es lo que permite pintar la portada del backoffice, *(equipo, competición)*, desde
        el instante del enganche y sin esperar a que haya partidos—, pero **la competición no entra en la
        ruta**: eso convertiría el recurso en una terna y traería de vuelta el `{registrationId}` que esta
        decisión evita. Se edita **como conjunto**, que es el patrón de D-50 (`PUT` de
        `/sanction-brackets` y de `/staff-positions/{id}/permissions`).

        **Cuerpo omitido o `{}` ⇒ inscrito en la temporada sin competición conocida** — el estado de junio, y
        el que `POST /teams` deja escrito. Un cuerpo con `competitionIds` **reemplaza el conjunto entero**;
        la fila sin competición desaparece en cuanto hay una con ella, o el equipo saldría dos veces.

        **No hace falta llamarlo para engancharse**: la cascada de `/federation-link` (D-67) escribe la
        competición sola.

        **Solo equipos propios.** Un rival no se inscribe: aparece porque juega (§3.4) → **409**.

        No hace falta llamarlo en el camino feliz: `POST /teams` inscribe al crear, y la cascada de
        `/federation-link` inscribe al enganchar. Esto cubre el alta en una temporada **adicional** —el
        arrastre de cada verano— y la corrección.

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTeamRequest'
      responses:
        '204':
          description: |
            Equipo inscrito en la temporada. **Idempotente**: inscribirlo dos veces devuelve 204.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            El equipo es **rival** (`opponentClubId` no nulo): su participación se deriva de los partidos,
            no se afirma (D-27, D-68). También si alguna competición de `competitionIds` **no es de esa
            temporada**: la incoherencia la impide una FK compuesta (§3.5), y aquí se traduce.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags: [Teams]
      operationId: unregisterTeamFromSeason
      summary: Retira la inscripción del equipo en una temporada
      description: |
        Deshace la inscripción. **Una retirada es borrar la fila**: no hay columna de estado, porque la
        fuente es el club y el club no tiene estado federativo que registrar (D-68).

        **No borra el equipo** ni sus jugadores: `Team` es estable entre temporadas (§3.2) y `Player` lleva
        su propia `seasonId` (D-05). Retirar la inscripción solo lo saca de `GET /teams?seasonId=` para
        **esa** temporada.

        **Idempotente**. Requiere **rol elevado** (§7.3).
      responses:
        '204':
          description: Inscripción retirada, o no existía.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Rounds (§5.1) ─────────────────────────────
  /rounds:
    get:
      tags: [Rounds]
      operationId: listRounds
      summary: Lista las jornadas de una competición
      description: |
        **`competitionId` es obligatorio.** Una jornada fuera de su competición no significa nada —"la
        jornada 5" solo existe respecto de una liga— y exigirlo acota la colección a las ~34 filas de una
        competición, que es lo que permite servirla **sin paginación** (§5.3). `Round` es interna del
        agregado `Competition` (§4.2); la ruta es plana por coherencia con el resto del contrato, pero el
        ámbito sigue siendo el mismo.

        **Orden fijo por `number` ascendente**, que es el orden del calendario y el único con sentido para
        un selector de jornada. Sin `?sort=`.
      parameters:
        - name: competitionId
          in: query
          required: true
          description: Competición cuyas jornadas se listan. Identificador **interno** (UUID).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Jornadas de la competición, ordenadas por número ascendente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoundResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: La competición no existe en este club.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    # Sin POST: las crea la ingesta desde el calendario de la federación (§3.7).

  /rounds/{roundId}:
    parameters:
      - $ref: '#/components/parameters/RoundId'

    get:
      tags: [Rounds]
      operationId: getRound
      summary: Obtiene una jornada
      responses:
        '200':
          description: Jornada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    # Sin PATCH ni DELETE: número y fechas SON el calendario, no hay nada deducido que corregir. Es la
    # forma más pura de D-21.

  # ───────────────────────────── Matches (§5.1) ─────────────────────────────
  /matches:
    get:
      tags: [Matches]
      operationId: listMatches
      summary: Lista partidos, siempre dentro de un ámbito
      description: |
        **Ámbito obligatorio: al menos uno de `roundId`, `competitionId` o `teamId`** → **400** si falta.
        Tres puertas porque las pantallas entran por sitios distintos: jornada (`roundId`) y equipo
        (`teamId` + `seasonId`, que puede abarcar liga y copa — D-12). **`teamId` casa contra los dos
        lados**, local y visitante.

        **Paginada**, al contrario que `/rounds` pese a exigir ámbito las dos: aquí el ámbito no trae techo
        (D-49).

        **Orden por `(matchDate, kickoffTime)`** con las horas sin confirmar al final del día y el `id` como
        desempate estable. Se admite `order`, no `sort` (§5.3).

        El **404** es el del **ámbito**; un ámbito válido sin partidos devuelve 200 con `data` vacío.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: roundId
          in: query
          required: false
          description: Jornada. Ámbito más estrecho y el de la pantalla de resultados por jornada.
          schema:
            type: string
            format: uuid
        - name: competitionId
          in: query
          required: false
          description: Competición. Devuelve su calendario completo, todas las jornadas.
          schema:
            type: string
            format: uuid
        - name: teamId
          in: query
          required: false
          description: |
            Equipo, **como local o como visitante**. Combinado con `seasonId` da el calendario del equipo
            en la temporada, que es la pantalla de resultados de equipo.
          schema:
            type: string
            format: uuid
        - name: seasonId
          in: query
          required: false
          description: |
            Temporada. **No es un ámbito válido por sí solo** — acota, pero no basta para satisfacer el
            requisito de ámbito. Se alcanza por FK vía `Competition`: `Match` no lleva `seasonId` (D-28).
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MatchStatus'
        - name: order
          in: query
          required: false
          description: |
            Sentido del orden de calendario. `asc` para leer una jornada; `desc` para "últimos
            resultados".
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Página de partidos, en orden de calendario.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MatchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: El recurso del ámbito (jornada, competición o equipo) no existe en este club.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    # Sin POST: los crea la ingesta (§3.7). Consecuencia asumida: no hay amistosos (D-21).

  /matches/{matchId}:
    parameters:
      - $ref: '#/components/parameters/MatchId'

    get:
      tags: [Matches]
      operationId: getMatch
      summary: Obtiene un partido
      responses:
        '200':
          description: Partido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    # Sin PATCH ni DELETE: lo que aporta el club son los HIJOS del partido, no sus campos (D-21).

  # ──────────────────────────── Standings (§5.1) ────────────────────────────
  /standings:
    get:
      tags: [Standings]
      operationId: getStanding
      summary: Obtiene la clasificación de una jornada
      description: |
        **`roundId` es obligatorio.** Una clasificación existe **respecto de una jornada** —es un
        *snapshot*, no un estado global de la competición—, así que el filtro no es opcional (D-34).

        **La "clasificación actual" la resuelve el cliente.** No se admite `competitionId` a secas: "la
        última jornada con datos" sería un tercer concepto que no existe en el dominio —ni la jornada
        actual, que puede no tener aún clasificación con los partidos sin jugar, ni la última—. La app ya
        tiene `Round.isCurrent` en el payload del selector de jornada, así que sabe qué pedir sin llamada
        extra; si recibe lista vacía, retrocede una jornada, que es lo que **ya** debe hacer cuando la
        competición ha terminado y ninguna jornada es `isCurrent`.

        **Sin paginación y con orden fijo por `position` ascendente** (§5.3): el ámbito ya acota a los ~20
        equipos de la competición, y una clasificación desordenada no es una clasificación. Sin `sort` ni
        `order`.
      parameters:
        - name: roundId
          in: query
          required: true
          description: Jornada de la que se quiere la clasificación. Identificador **interno** (UUID).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            Clasificación de la jornada, ordenada por posición ascendente. **Lista vacía** si esa jornada
            aún no tiene clasificación (partidos sin jugar o sin ingerir) — no es un error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StandingResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: La jornada no existe en este club.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    # Sin POST, PATCH ni DELETE: la escribe la ingesta, ingerida o calculada (D-15).

  # Sin GET /standings/{id} (D-34): modelo de lectura cuya unidad de consumo es la tabla de la jornada.

  # ───────────────────────────── Players (§5.1) ─────────────────────────────
  /players:
    get:
      tags: [Players]
      operationId: listPlayers
      summary: Lista la plantilla de un equipo en una temporada
      description: |
        **`teamId` y `seasonId` son obligatorios los dos.** Una plantilla es un hecho de *(equipo,
        temporada)* —esas dos coordenadas **son** la identidad de la fila (D-05, D-37)—, así que pedirla
        sin una de ellas devolvería jugadores de varios años o de varios equipos mezclados, que no es lo
        que muestra ninguna pantalla. Mismo criterio que el `roundId` de la clasificación (D-34).

        **Sin paginación y con orden fijo por `shirtNumber` ascendente** (§5.3): el ámbito acota a los ~25
        jugadores de un equipo, que es el orden en el que se lee una plantilla. Tampoco hay búsqueda por
        nombre: la colección entera cabe en una pantalla.

        **Los jugadores borrados no aparecen.** El borrado es lógico (D-36) y sirve a la auditoría, no al
        cliente: no hay parámetro para incluirlos.
      parameters:
        - name: teamId
          in: query
          required: true
          description: |
            Equipo **propio** cuya plantilla se pide. Un equipo rival no tiene plantilla —no hay de dónde
            sacarla (§3.7)— y devuelve lista vacía, no error.
          schema:
            type: string
            format: uuid
        - name: seasonId
          in: query
          required: true
          description: Temporada del registro. Identificador **interno** (UUID), no el `federationSeasonId`.
          schema:
            type: string
            format: uuid
        - name: position
          in: query
          required: false
          description: Filtra por demarcación.
          schema:
            $ref: '#/components/schemas/PlayerPosition'
      responses:
        '200':
          description: Plantilla del equipo en esa temporada, ordenada por dorsal ascendente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            El equipo o la temporada no existen en este club. Es el 404 **del ámbito**, no de la colección:
            un equipo propio sin plantilla dada de alta devuelve **200** con lista vacía.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    post:
      tags: [Players]
      operationId: createPlayer
      summary: Da de alta un jugador en la plantilla
      description: |
        **Primer `POST` de dominio manual del contrato.** A diferencia de `Season` y `Competition` —que
        tienen `POST` por ser *entrada* de la ingesta (D-22)—, aquí no hay ingesta en absoluto: la
        federación no publica plantillas de fútbol base, así que el club es el **único** escritor y la
        regla "el BFF corrige, no crea" (D-21) sencillamente no aplica.

        **`teamId` y `seasonId` se fijan aquí y no se cambian nunca** (D-37): son la identidad del
        registro. Un jugador que sube de equipo a mitad de temporada es una **fila nueva** en el equipo
        nuevo, igual que el que continúa al año siguiente lo es en la temporada nueva (D-05). Cambiarlos
        por `PATCH` reescribiría el pasado: sus goles y tarjetas ya emitidos pasarían a contar para el
        equipo al que se le mueve.

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerRequest'
      responses:
        '201':
          description: Jugador dado de alta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Ese dorsal ya está ocupado en el mismo equipo y temporada (§3.5). El dorsal de un jugador
            **borrado** no cuenta: el índice único es parcial (D-36).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            Regla de negocio (§5.4). Tres casos, distinguibles por el `code` del *Problem*:
            el equipo o la temporada **no existen** en este club; el equipo **no es propio**
            (`opponentClubId != null`, §3.7); o la temporada está **archivada** (§5.1).

            **No es un 404** aunque incluya el caso "no existe": el equipo llega en el **cuerpo**, no en la
            ruta, y `/players` sí existe. Un 404 aquí respondería sobre el recurso equivocado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /players/{playerId}:
    parameters:
      - $ref: '#/components/parameters/PlayerId'

    get:
      tags: [Players]
      operationId: getPlayer
      summary: Obtiene un jugador
      responses:
        '200':
          description: Jugador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Players]
      operationId: updatePlayer
      summary: Actualiza parcialmente un jugador
      description: |
        Actualización **parcial**: los campos ausentes no se modifican.

        **No incluye `teamId` ni `seasonId`** (D-37): son identidad, no atributos. Un cambio de equipo o de
        temporada es una fila nueva, no una edición — igual que `modality` en `Team` (§3.2).

        **Tampoco incluye la foto**: `photoUrl` es `readOnly` y se deriva de la clave del objeto en Storage
        (D-35). La subida está **pendiente** (§9).

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlayerRequest'
      responses:
        '200':
          description: Jugador actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ese dorsal ya está ocupado en el mismo equipo y temporada (§3.5).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags: [Players]
      operationId: deletePlayer
      summary: Borra un jugador de la plantilla
      description: |
        **Borrado lógico** (`deleted_at`, §3.5): el jugador desaparece de la plantilla y de las lecturas,
        pero sus goles, tarjetas y convocatorias **siguen contando para el equipo** (D-36). Por eso
        **no hay guarda de dependientes**: a diferencia de `Season` y `Competition` —que devuelven 409 si
        tienen datos colgando— aquí no hay integridad que proteger, las referencias no se rompen.

        **Libera el dorsal** para otro jugador del mismo equipo y temporada: el índice único de §3.5 es
        parcial (`WHERE deleted_at IS NULL`).

        **No es la vía del "derecho al olvido"**: borrar lógicamente no borra el dato personal de un menor.
        Para eso está el purgado de temporada (`DELETE /seasons/{id}?cascade=true`, D-24).

        Requiere **rol elevado** (§7.3).
      responses:
        '204':
          description: |
            Jugador borrado. **La foto no se borra del Storage**: el borrado es lógico y reversible por
            recuperación, así que el objeto sigue ahí. Quien sí lo elimina es el purgado de temporada
            (D-24).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /players/{playerId}/photo:
    parameters:
      - $ref: '#/components/parameters/PlayerId'

    put:
      tags: [Players]
      operationId: uploadPlayerPhoto
      summary: Sube o reemplaza la foto de un jugador
      description: |
        **Única operación del contrato que no es JSON**: el cuerpo es la imagen **en crudo**
        (`image/jpeg`/`image/png`).

        **Es una segunda llamada y no parte del `POST`** (D-35): la clave se deriva del `playerId`, que no
        existe hasta que el alta responde, y separarlas degrada mejor. El backoffice las encadena tras un
        único botón de *Guardar*.

        **La API sanea el fichero** antes de escribirlo: valida los bytes contra el tipo declarado,
        recodifica a JPEG, redimensiona y **descarta el EXIF** — que en la foto de un menor lleva
        **geolocalización** (D-35). Ese último paso es lo que descarta la subida directa a Storage.

        **Idempotente**. Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        description: La imagen, en crudo. Tamaño máximo **5 MB**.
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: |
            Foto almacenada. Se devuelve el jugador completo para que el cliente reciba la `photoUrl`
            **ya firmada** sin una segunda lectura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '400':
          description: |
            Los bytes no son una imagen válida del tipo declarado en el `Content-Type` — un `.heic` o un
            `.pdf` renombrado. La comprobación es sobre el contenido, no sobre la cabecera.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: La imagen supera el tamaño máximo admitido (5 MB).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: |
            Tipo de contenido no admitido. Solo `image/jpeg` e `image/png`: son los dos formatos que
            produce cualquier portátil, y bastan para una ficha de plantilla.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags: [Players]
      operationId: deletePlayerPhoto
      summary: Quita la foto de un jugador
      description: |
        Borra el objeto de Storage y deja `photo_key` a nulo → `photoUrl` vuelve a ser `null` y la ficha
        pinta las iniciales.

        Existe como operación propia porque el `PATCH` **no lleva la foto** (D-35): un `null` explícito en
        un campo derivado no significaría nada. Es el mismo criterio por el que `/ownership` es
        sub-recurso y no un campo del `PATCH` de `Team`.

        **Idempotente**: quitar la foto de un jugador que no la tenía devuelve 204. Requiere **rol
        elevado** (§7.3).
      responses:
        '204':
          description: Foto eliminada.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──────────────────────────── Absences (§5.1) ────────────────────────────
  /absences:
    get:
      tags: [Absences]
      operationId: listAbsences
      summary: Lista las ausencias de un jugador o de una plantilla
      description: |
        **Ámbito obligatorio: `playerId`, o bien `teamId` **y** `seasonId`** → **400** si falta o llega a
        medias. La segunda puerta es la **plantilla**: sin ella, pintar el distintivo de disponibilidad de
        25 fichas costaría 25 llamadas — el N+1 que ya se evitó en la clasificación (D-34).

        La temporada se alcanza por el jugador (D-05, D-28).

        **Sin paginación, orden fijo por `startDate` descendente** (§5.3).

        **`active=true` es el filtro que pinta la pantalla**: solo las ausencias en curso.
      parameters:
        - name: playerId
          in: query
          required: false
          description: Jugador cuyo historial de ausencias se pide.
          schema:
            type: string
            format: uuid
        - name: teamId
          in: query
          required: false
          description: |
            Equipo **propio** cuya plantilla se consulta. Se combina obligatoriamente con `seasonId`: sin
            ella devolvería las ausencias de todos los años del equipo mezcladas.
          schema:
            type: string
            format: uuid
        - name: seasonId
          in: query
          required: false
          description: Temporada. Solo tiene sentido junto a `teamId`.
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          required: false
          description: |
            `true` = solo las ausencias **en curso**; `false` = solo las ya cerradas. Se resuelve sobre el
            mismo criterio derivado que `isActive` (D-38), no sobre una columna.
          schema:
            type: boolean
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AbsenceType'
      responses:
        '200':
          description: Ausencias del ámbito, ordenadas por fecha de inicio descendente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbsenceResponse'
        '400':
          description: |
            Falta el ámbito, o se pasó `teamId` sin `seasonId` (o al revés). Un ámbito a medias no acota:
            es el mismo 400 que la lista de plantilla sin sus dos coordenadas (D-37).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            El jugador, el equipo o la temporada del ámbito no existen en este club. Es el 404 **del
            ámbito**: un jugador sano, sin ninguna baja, devuelve **200** con lista vacía.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    post:
      tags: [Absences]
      operationId: createAbsence
      summary: Registra una ausencia
      description: |
        Da de alta un periodo de indisponibilidad. **`startDate` es obligatoria; las dos de vuelta no**:
        una lesión se registra el día que ocurre, sin saber aún cuándo vuelve (`expectedReturnDate` nula) y
        desde luego sin fecha de alta real.

        **Se admite registrar una ausencia ya cerrada** —con `actualReturnDate` en el mismo alta—: es el
        caso de quien apunta en enero la gripe de diciembre.

        **La sanción no se crea sola.** Los tramos de amarillas (`CompetitionSanctionBracket`, D-10)
        dicen **cuándo toca**, pero registrar la ausencia sigue siendo un acto del administrador: derivarla
        automáticamente de `Card` metería un segundo escritor en una tabla de dominio manual, que es
        justo lo que el contrato evita en todas partes (§2.1).

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAbsenceRequest'
      responses:
        '201':
          description: Ausencia registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Ese jugador ya tiene una ausencia **en curso del mismo tipo** (D-39). Dos lesiones abiertas a
            la vez son, en la práctica, una que se olvidó de cerrar. Ausencias **de tipos distintos** sí
            pueden solaparse: lesionado y sancionado a la vez es un estado real.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            Regla de negocio (§5.4): el jugador **no existe** o está borrado; su temporada está
            **archivada**; o las fechas no son coherentes —`startDate` posterior a cualquiera de las de
            vuelta, o alta real anterior a la estimada sin serlo—.

            **No es 404** aunque incluya "no existe": el jugador llega en el **cuerpo**, no en la ruta
            (mismo criterio que el `teamId` del alta de jugador, D-37).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /absences/{absenceId}:
    parameters:
      - $ref: '#/components/parameters/AbsenceId'

    get:
      tags: [Absences]
      operationId: getAbsence
      summary: Obtiene una ausencia
      responses:
        '200':
          description: Ausencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Absences]
      operationId: updateAbsence
      summary: Actualiza una ausencia — y es también el modo de darla por terminada
      description: |
        Actualización **parcial**: los campos ausentes no se modifican.

        **Dar de alta al jugador es poner `actualReturnDate`, no llamar a un sub-recurso de estado**
        (D-40). El contrato tiene tres sub-recursos de ese tipo —`/archive`, `/ownership`, `/photo`— y los
        tres existen porque hacen algo que un campo no hace: ocultar un subárbol entero, mover nombre y
        escudo entre entidades, o recibir un binario. Cerrar una baja es **escribir una fecha**; envolverlo
        en un `PUT /absences/{id}/return` sería ceremonia sin contenido.

        **Reabrir una baja cerrada por error** es el `null` explícito de la convención de `PATCH` (§5.2):
        `{"actualReturnDate": null}` borra el valor y la ausencia vuelve a estar en curso.

        **No incluye `playerId`**: una ausencia es de quien es. Registrarla en el jugador equivocado se
        corrige borrándola y creándola bien, no trasladándola — mismo criterio que la identidad inmutable
        de la propia plantilla (D-37).

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAbsenceRequest'
      responses:
        '200':
          description: Ausencia actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            El cambio dejaría al jugador con dos ausencias en curso del mismo tipo (D-39) — reabrir una
            baja antigua cuando ya hay otra abierta, o cambiarle el tipo a uno ya ocupado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Fechas incoherentes (§5.4).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags: [Absences]
      operationId: deleteAbsence
      summary: Borra una ausencia
      description: |
        **Borrado lógico** (`deleted_at`, §3.5), como el del jugador (D-36) y por el mismo motivo: sirve a
        la auditoría, no al cliente. Aquí es además el caso más simple del contrato —**nada cuelga de una
        ausencia**—, así que no hay ni guarda de dependientes que plantearse.

        **Es la vía correcta para una baja registrada por error**, frente a `PATCH`: una lesión que nunca
        existió no se "cierra", se borra. Cerrarla dejaría en el historial un periodo de indisponibilidad
        que no ocurrió.

        Requiere **rol elevado** (§7.3).
      responses:
        '204':
          description: Ausencia borrada.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── Appearances (§5.1) ───────────────────────────
  /appearances:
    get:
      tags: [Appearances]
      operationId: listAppearances
      summary: Lista las convocatorias de un partido o el historial de un jugador
      description: |
        **Ámbito obligatorio: `matchId` o `playerId`** → **400** si falta. Son las dos pantallas que
        existen: la convocatoria del partido y el historial del jugador.

        **Lo que no está no dice nada** (D-41): la respuesta trae **solo las filas registradas**, no una por
        jugador de la plantilla. Un partido sin convocatoria devuelve 200 vacío, y eso es *no registrado*,
        no "no fue convocado nadie". El cliente cruza con `GET /players?teamId=&seasonId=` por `playerId`,
        el mismo cruce que ya hace con las ausencias activas (D-38).

        La temporada y el equipo se alcanzan por el jugador (D-05, D-28).

        **Sin paginación** (§5.3): las dos puertas traen techo —una convocatoria son ~18 filas, la
        temporada de un jugador ~30 partidos—. **Orden fijo**: por dorsal ascendente con `matchId` (es como
        se lee una convocatoria, igual que la plantilla), y por fecha de partido descendente con `playerId`
        (un historial se lee de lo más reciente a lo más antiguo).
      parameters:
        - name: matchId
          in: query
          required: false
          description: |
            Partido cuya convocatoria se pide. Devuelve las filas de **los dos equipos si los dos son
            propios** —un derbi entre el A y el B del club es un partido real (§3.6)—; para quedarse con
            uno, se combina con `teamId`.
          schema:
            type: string
            format: uuid
        - name: playerId
          in: query
          required: false
          description: |
            Jugador cuyo historial de convocatorias se pide. Al ser `Player` identidad de *(equipo,
            temporada)* (D-05), el ámbito ya queda acotado a una temporada sin pedirla aparte.
          schema:
            type: string
            format: uuid
        - name: teamId
          in: query
          required: false
          description: |
            Acota a un equipo **propio**. Solo tiene sentido junto a `matchId`, y solo hace falta en el
            derbi entre dos equipos del club; en el resto de partidos es redundante.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AppearanceStatus'
      responses:
        '200':
          description: Convocatorias del ámbito.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppearanceResponse'
        '400':
          description: |
            Falta el ámbito, o llegaron `matchId` y `playerId` a la vez —son dos puertas alternativas, no
            un filtro combinable: la intersección es como mucho **una** fila (D-43), y para eso está el
            `GET` por id—. También si se pasó `teamId` sin `matchId`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            El partido, el jugador o el equipo del ámbito no existen en este club. Es el 404 **del
            ámbito**: un partido sin convocatoria registrada devuelve **200** con lista vacía.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    post:
      tags: [Appearances]
      operationId: createAppearance
      summary: Registra la convocatoria de un jugador en un partido
      description: |
        Da de alta **una fila**: un jugador, un partido, un estado. La convocatoria entera se registra
        repitiendo la llamada por cada jugador (D-44) — no hay alta masiva, y el porqué está en esa
        decisión.

        **`minutes` solo se admite con `status = jugado`** (D-42) → **422** en cualquier otro caso. Un
        jugador que no fue convocado no jugó cero minutos: no jugó, y la distinción importa porque el
        promedio de minutos se calcula sobre los partidos jugados.

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppearanceRequest'
      responses:
        '201':
          description: Convocatoria registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppearanceResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Ese jugador **ya tiene convocatoria en ese partido** (§3.5). Un jugador hace una sola cosa en
            un partido; corregir lo apuntado es el `PATCH`, no un segundo `POST`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            Regla de negocio (§5.4): el jugador **no existe** o está borrado; el partido no existe; la
            temporada está **archivada**; **el equipo del jugador no disputa ese partido** —ni como local
            ni como visitante—; o llegó `minutes` con un `status` distinto de `jugado` (D-42).

            **No es 404** aunque incluya "no existe": jugador y partido llegan en el **cuerpo**, no en la
            ruta (mismo criterio que el `teamId` del alta de jugador, D-37).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /appearances/{appearanceId}:
    parameters:
      - $ref: '#/components/parameters/AppearanceId'

    get:
      tags: [Appearances]
      operationId: getAppearance
      summary: Obtiene una convocatoria
      responses:
        '200':
          description: Convocatoria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppearanceResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Appearances]
      operationId: updateAppearance
      summary: Corrige una convocatoria
      description: |
        Actualización **parcial**: los campos ausentes no se modifican. Es la vía normal de corregir lo
        apuntado —el entrenador marca `no_convocado` el sábado y el domingo el chaval acaba jugando—.

        **No incluye `playerId` ni `matchId`**: son la **identidad** de la fila (§3.5), no atributos suyos.
        Una convocatoria apuntada en el jugador o en el partido equivocado se borra y se vuelve a crear.
        Misma línea que `Player` (D-37) y `Absence` (D-40), y aquí además cambiarlos chocaría de frente con
        la unicidad *(jugador, partido)*.

        **Bajar de `jugado` a cualquier otro estado exige soltar los minutos** (D-42): o se manda
        `minutes: null` en la misma llamada, o la operación devuelve **422**. El `null` explícito es la
        convención de `PATCH` del contrato (§5.2).

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppearanceRequest'
      responses:
        '200':
          description: Convocatoria actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppearanceResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            El cambio dejaría `minutes` con un `status` distinto de `jugado` (D-42) — típicamente, bajar el
            estado sin soltar los minutos en la misma llamada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags: [Appearances]
      operationId: deleteAppearance
      summary: Borra una convocatoria
      description: |
        **Borrado lógico** (`deleted_at`, §3.5), como el del jugador (D-36) y el de la ausencia, y por el
        mismo motivo: sirve a la auditoría, no al cliente. Nada cuelga de una convocatoria, así que no hay
        guarda de dependientes que plantearse.

        **Borrar no es lo mismo que marcar `no_convocado`** (D-41), y el backoffice tendrá los dos gestos
        cerca. `no_convocado` es un **hecho registrado** —estuvo disponible y el entrenador no lo llamó— y
        cuenta en la estadística; borrar deja la fila **sin registrar**, que es lo correcto cuando la
        convocatoria se apuntó por error o en el partido equivocado.

        Requiere **rol elevado** (§7.3).
      responses:
        '204':
          description: Convocatoria borrada.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────────── Cards (§5.1) ───────────────────────────────
  /cards:
    get:
      tags: [Cards]
      operationId: listCards
      summary: Lista las tarjetas de un partido o el historial de un jugador
      description: |
        Ámbito obligatorio: `matchId`, `playerId`, o **los dos** — aquí las puertas sí se combinan (D-47).

        Sin paginación. Orden por `minute` ascendente (`NULLS LAST`) con `matchId`; por fecha de partido
        descendente con `playerId` (§5.3).

        Las **amarillas pendientes de sanción** no salen de aquí: son agregación (§3.4, D-10).
      parameters:
        - name: matchId
          in: query
          required: false
          description: Partido. Incluye los dos equipos si ambos son propios; acotar con `teamId`.
          schema:
            type: string
            format: uuid
        - name: playerId
          in: query
          required: false
          description: Jugador. Ya queda acotado a una temporada, porque `Player` lo está (D-05).
          schema:
            type: string
            format: uuid
        - name: teamId
          in: query
          required: false
          description: Acota a un equipo propio. Solo junto a `matchId`, y solo hace falta en un derbi.
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CardType'
      responses:
        '200':
          description: Tarjetas del ámbito.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardResponse'
        '400':
          description: 'Falta el ámbito, o se pasó `teamId` sin `matchId`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            El recurso del **ámbito** no existe en este club. Un partido sin tarjetas devuelve 200 vacío.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    post:
      tags: [Cards]
      operationId: createCard
      summary: Registra una tarjeta
      description: |
        Da de alta **una sanción**. La expulsión por doble amarilla es **una sola llamada** con
        `type = roja` e `isSecondYellow = true` (D-45).

        **No exige que exista la convocatoria** del jugador en ese partido (D-46).

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '201':
          description: Tarjeta registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Ese jugador ya tiene una tarjeta **de ese tipo** en ese partido (§3.5). Amarilla y roja sí
            conviven; una segunda amarilla no es otra fila amarilla, es la expulsión (D-45).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            Regla de negocio (§5.4): jugador o partido inexistentes; temporada archivada; el equipo del
            jugador no disputa el partido; `isSecondYellow` sin `roja`; o `isSecondYellow` con una amarilla
            suelta ya registrada, que queda absorbida por la expulsión (D-45).

            **No es 404**: jugador y partido llegan en el cuerpo, no en la ruta (D-37).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/CardId'

    get:
      tags: [Cards]
      operationId: getCard
      summary: Obtiene una tarjeta
      responses:
        '200':
          description: Tarjeta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Cards]
      operationId: updateCard
      summary: Corrige una tarjeta
      description: |
        Actualización **parcial**. Corrige el minuto o reclasifica la sanción.

        **Sin `playerId` ni `matchId`**: son identidad (D-37).

        **`type` e `isSecondYellow` viajan juntos cuando cambian**, o 422 (D-45; mismo criterio que D-42).

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardRequest'
      responses:
        '200':
          description: Tarjeta actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'El cambio de `type` chocaría con la tarjeta que ese jugador ya tiene en ese partido (§3.5).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'El cambio dejaría `isSecondYellow = true` con `type = amarilla` (D-45).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags: [Cards]
      operationId: deleteCard
      summary: Borra una tarjeta
      description: |
        **Borrado lógico** (`deleted_at`, D-36). Nada cuelga de una tarjeta.

        **Efecto no obvio**: borrar una amarilla **recalcula las pendientes de sanción**, porque el
        recuento es agregación en vivo, no un contador almacenado (D-10).

        Requiere **rol elevado** (§7.3).
      responses:
        '204':
          description: Tarjeta borrada.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── LeagueScorers (§5.1) ───────────────────────────
  /league-scorers:
    get:
      tags: [LeagueScorers]
      operationId: listLeagueScorers
      summary: Ranking de goleadores de una competición
      description: |
        **`competitionId` obligatorio.** A diferencia de la clasificación, **no es un *snapshot* por
        jornada**: guarda un solo **estado vigente** por competición, que el *upsert* pisa en cada
        sincronización (§3.7). Sin histórico ni columna PREV.

        **Paginado, al contrario que la clasificación** (D-49): el ámbito no trae techo —pueden marcar
        doscientos jugadores— y, como el orden **es** el ranking, `?perPage=20` **es** el top-20.

        **Orden fijo por `rank` ascendente** (nulos al final, `goals` descendente como criterio real). Sin
        `sort` ni `order` (§5.3).

        **Página vacía si la federación no publica goleadores** (D-48), y no es un error: no hay *fallback*
        posible (D-09). El cliente lo sabe de antemano por `ClubResponse.federationProvidesScorers`.
      parameters:
        - name: competitionId
          in: query
          required: true
          description: Competición cuyo ranking se pide. Identificador **interno** (UUID).
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: |
            Página del ranking, en orden de clasificación. **Lista vacía** si la federación no publica
            goleadores o si la competición aún no se ha sincronizado — no es un error (D-48).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/LeagueScorerResponse'
        '400':
          description: Falta `competitionId`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            La competición no existe en este club. Es el 404 **del ámbito**: una competición válida sin
            goleadores ingeridos devuelve **200** con página vacía.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # Sin ruta por {id} (D-34, modelo de lectura) y sin escritura (D-21, salida de la ingesta). Sin PATCH
  # de corrección como en `Round`: el nombre y el equipo son texto del proveedor sobre jugadores ajenos
  # (D-09), y una corrección la pisaría el siguiente upsert (D-18).

  # ─────────────────────────────── Goals (§5.1) ───────────────────────────────
  /goals:
    get:
      tags: [Goals]
      operationId: listGoals
      summary: Lista goles de un partido, de un equipo o de un jugador
      description: |
        **El ámbito es obligatorio: al menos uno de `matchId`, `scoringTeamId`, `concedingTeamId` o
        `scorerPlayerId`** → **400** si no viene ninguno. **Se combinan** (D-47): la clave de `Goal` no
        incluye jugador —un jugador marca dos veces en un partido, y hay goles sin goleador conocido—, así
        que ninguna intersección colapsa a una fila.

        **Las dos puertas de equipo son la razón de ser de D-04.** `scoringTeamId` da los goles **a favor**
        y `concedingTeamId` los goles **en contra**, cada una un filtro directo e indexado sobre su propia
        columna, **sin *join*** a `Match`. Son literalmente los dos bloques de la pantalla de estadísticas.

        **Paginado** (D-49), a diferencia de `Appearance` y `Card`: `?matchId=` trae techo, pero
        `?scoringTeamId=` o `?scorerPlayerId=` sin temporada no lo traen. Se aplica el criterio del techo,
        no el del ámbito.

        **Orden por `minute` ascendente** (`NULLS LAST`, como el calendario de `Match`) cuando el ámbito es
        el partido; por fecha de partido descendente en los demás, que se leen como historial. Mismo
        criterio que `Card`.
      parameters:
        - name: matchId
          in: query
          required: false
          description: Partido. Devuelve los goles de las dos direcciones.
          schema:
            type: string
            format: uuid
        - name: scoringTeamId
          in: query
          required: false
          description: |
            Equipo que **marca** → goles **a favor**. Filtro directo sobre `scoring_team_id` (D-04).
          schema:
            type: string
            format: uuid
        - name: concedingTeamId
          in: query
          required: false
          description: |
            Equipo que **encaja** → goles **en contra**. Filtro directo sobre `conceding_team_id` (D-04).
            Combinado con `scoringTeamId` da los goles de un enfrentamiento concreto entre dos equipos.
          schema:
            type: string
            format: uuid
        - name: scorerPlayerId
          in: query
          required: false
          description: |
            Jugador que marca. **Incluye sus goles en propia puerta**, que están registrados a su nombre
            aunque no le sumen (D-52): el filtro devuelve las filas, y quien cuenta goles excluye
            `playType = en_propia_puerta`.
          schema:
            type: string
            format: uuid
        - name: assistPlayerId
          in: query
          required: false
          description: Jugador que asiste. Filtro, no puerta de ámbito.
          schema:
            type: string
            format: uuid
        - name: seasonId
          in: query
          required: false
          description: |
            Temporada, alcanzada por FK vía `Match` → `Competition` (D-28). Es el filtro que acota los
            ámbitos de equipo y de jugador, que sin él no tienen techo.
          schema:
            type: string
            format: uuid
        - name: playType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GoalPlayType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Página de goles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GoalResponse'
        '400':
          description: Falta el ámbito — ninguna de las cuatro puertas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            El partido, el equipo, el jugador o la temporada del ámbito no existen en este club. Es el 404
            **del ámbito**: un partido sin goles registrados devuelve **200** con página vacía.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    post:
      tags: [Goals]
      operationId: createGoal
      summary: Registra un gol
      description: |
        **Se envía quién marca; el servidor deriva quién encaja** (D-54), así la denormalización de D-04
        no puede quedar incoherente.

        **El gol en propia puerta guarda a su autor** (D-52), y con él la invariante se invierte: el
        `scorerPlayerId` pertenece al equipo que **encaja**. Queda registrado pero **no le suma**.

        **Todo el desglose es opcional** (D-04): un gol con `matchId` y `scoringTeamId` es una fila
        válida.

        **No se valida contra el marcador** (D-53): el resultado es de la federación y estos goles son
        entrada manual y parcial. Que no cuadren es lo normal, no un error.

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
      responses:
        '201':
          description: Gol registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            Regla de negocio (§5.4):

            - el **partido no existe**, o su temporada está **archivada**;
            - `scoringTeamId` **no es uno de los dos equipos** del partido;
            - **ninguno de los dos equipos es propio** — el detalle manual solo existe donde juega el club
              (§3.7);
            - el **goleador no pertenece al equipo que le corresponde** según D-52: el que marca en un gol
              normal, el que **encaja** en un `en_propia_puerta`;
            - el **asistente no pertenece al equipo que marca**, o coincide con el goleador — nadie se
              asiste a sí mismo;
            - hay asistencia en un **gol en propia puerta**, que no la admite (D-52);
            - `assistPlayerId` con `assisted = false` — tercera invariante entre campos del contrato,
              hermana de D-42 y D-45.

            **No es 404** aunque incluya "no existe": partido, equipos y jugadores llegan en el **cuerpo**,
            no en la ruta (D-37).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /goals/{goalId}:
    parameters:
      - $ref: '#/components/parameters/GoalId'

    get:
      tags: [Goals]
      operationId: getGoal
      summary: Obtiene un gol
      responses:
        '200':
          description: Gol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Goals]
      operationId: updateGoal
      summary: Corrige un gol o completa su desglose
      description: |
        Actualización **parcial**. Es, más que en ningún otro recurso, **la operación normal**: el caso de
        uso real es apuntar el gol en caliente con lo mínimo y volver luego a rellenar zona, lado y parte
        del cuerpo viendo el vídeo. Los seis campos de desglose son editables.

        **No incluye `matchId` ni `scoringTeamId`**, y por tanto tampoco el `concedingTeamId` derivado de
        él: son la identidad del gol (D-37). Un gol apuntado en el partido equivocado, o atribuido al
        equipo que no era, se borra y se vuelve a crear — cambiar el equipo que marca invertiría el
        resultado de dos estadísticas a la vez.

        **`playType` y `scorerPlayerId` viajan juntos cuando el cambio cruza `en_propia_puerta`** (D-52):
        pasar un gol normal a propia puerta, o al revés, cambia a qué equipo debe pertenecer el goleador,
        así que o llegan los dos campos coherentes o la operación devuelve **422**. Igual que `status` y
        `minutes` en D-42, o `type` e `isSecondYellow` en D-45.

        Requiere **rol elevado** (§7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalRequest'
      responses:
        '200':
          description: Gol actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            Las mismas reglas del alta que siguen aplicando tras el cambio: pertenencia del goleador según
            `playType` (D-52), pertenencia del asistente, asistencia en gol en propia, y `assistPlayerId`
            con `assisted = false`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags: [Goals]
      operationId: deleteGoal
      summary: Borra un gol
      description: |
        **Borrado lógico** (`deleted_at`, §3.5), como el resto del dominio manual (D-36). Nada cuelga de un
        gol.

        **No toca el marcador del partido**, que es de la federación (D-21): borrar el gol solo retira el
        detalle de cómo se llegó a él. Es la contrapartida natural de D-53 — si los goles no tienen que
        cuadrar con el resultado, borrar uno tampoco lo descuadra.

        Requiere **rol elevado** (§7.3).
      responses:
        '204':
          description: Gol borrado.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────── SanctionBrackets (§5.1) ──────────────────────────
  /sanction-brackets:
    get:
      tags: [SanctionBrackets]
      operationId: getSanctionBrackets
      summary: Tramos de sanción de una competición
      description: |
        **`competitionId` es obligatorio.** Un tramo solo existe respecto de una competición, igual que una
        jornada (§5.1).

        **Sin paginación y con orden fijo por `seq` ascendente** (§5.3): son tres o cuatro filas y su orden
        **es** su significado — una lista de tramos desordenada no es una lista de tramos.

        **Lista vacía si la competición no tiene tramos configurados**, y no es un error (D-10): una
        competición sin tramos simplemente no sanciona por acumulación. El cliente que pinte "amarillas
        pendientes" debe tratar ese caso, no asumir que siempre hay un umbral.
      parameters:
        - name: competitionId
          in: query
          required: true
          description: Competición cuyos tramos se piden. Identificador **interno** (UUID).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tramos de la competición, en orden.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanctionBracketResponse'
        '400':
          description: Falta `competitionId`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            La competición no existe en este club. Es el 404 **del ámbito**: una competición sin tramos
            devuelve **200** con lista vacía.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    put:
      tags: [SanctionBrackets]
      operationId: replaceSanctionBrackets
      summary: Sustituye los tramos de sanción de una competición
      description: |
        **Sustituye el conjunto entero**, no una fila (D-50): los tramos son una secuencia y un hueco los
        invalida a todos.

        **El cuerpo son los umbrales, no los tramos** (D-51): `{"thresholds": [5, 10, 13, 16]}` produce
        `0-5, 6-10, 11-13, 14-16`. El servidor deriva `seq` y `yellowFrom`, así que **un conjunto inválido
        no se puede ni expresar**.

        **`{"thresholds": []}` borra los tramos**; no hay `DELETE` propio. **Idempotente**.

        **Efecto no obvio: es retroactivo** (D-51). Las pendientes se calculan en vivo sobre `Card` (D-10),
        así que cambiar los umbrales a mitad de temporada puede dejar a alguien sancionado sin que haya
        ocurrido nada en el campo.

        Requiere **rol elevado** (§7.3), como toda la configuración de competición (D-22).
      parameters:
        - name: competitionId
          in: query
          required: true
          description: Competición cuyos tramos se sustituyen.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceSanctionBracketsRequest'
      responses:
        '200':
          description: Tramos resultantes, ya derivados y en orden.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanctionBracketResponse'
        '400':
          description: |
            Falta `competitionId`, o los umbrales no son **estrictamente ascendentes** — el único error de
            forma que queda una vez el cuerpo son umbrales (D-51). Se juzga mirando solo el cuerpo, así que
            es 400 y no 422 (§5.4).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: La competición no existe en este club.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # Sin POST/PATCH/DELETE ni ruta por {id}. No es restricción de propiedad —lo escribe el administrador—
  # sino de unidad de consistencia: el conjunto tiene sentido, la fila no (D-50).

  # ───────────────────────── Control de acceso (§7) ─────────────────────────
  # El club administra aquí *quién es quién* y *qué puede hacer*. La autorización vive dentro del schema
  # del tenant, no en `auth.users`, que es de proyecto (D-59).

  /staff-members:
    get:
      tags: [StaffMembers]
      operationId: listStaffMembers
      summary: Lista el personal del club
      description: |
        **Abierto a cualquier miembro autenticado del club**, y no es un descuido: es lo que permite al
        backoffice pintar la lista de candidatos a un puesto. La lectura es abierta a todo el club (D-64);
        lo que exige rol es escribir.

        Colección **pequeña** → sin paginación (§5.3). Orden por `fullName` ascendente.
        **Excluye a los dados de baja** salvo `includeDeleted=true`.
      parameters:
        - name: includeDeleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Personal del club.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMemberResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [StaffMembers]
      operationId: createStaffMember
      summary: Da de alta a una persona
      description: |
        Crea la ficha **sin cuenta**: `userId` queda nulo y la persona ya puede recibir asignaciones. La
        cuenta se vincula después, con `/invite` (D-59).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffMemberRequest'
      responses:
        '201':
          description: Persona creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMemberResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ya existe una persona con ese `email` en este club (§3.5).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /staff-members/{staffMemberId}:
    parameters:
      - $ref: '#/components/parameters/StaffMemberId'

    get:
      tags: [StaffMembers]
      operationId: getStaffMember
      summary: Obtiene una persona
      responses:
        '200':
          description: Persona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMemberResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [StaffMembers]
      operationId: updateStaffMember
      summary: Corrige los datos de una persona
      description: |
        `userId` **no es campo de entrada**: lo establece el flujo de invitación, nunca el cliente (D-59).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffMemberRequest'
      responses:
        '200':
          description: Persona actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMemberResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ese `email` ya lo tiene otra persona del club.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags: [StaffMembers]
      operationId: deleteStaffMember
      summary: Da de baja a una persona
      description: |
        **Borrado lógico**, con el criterio de `Player` (D-36): las asignaciones pasadas siguen siendo
        histórico válido de quién dirigió qué, y no se preguntan.
      responses:
        '204':
          description: Persona dada de baja.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /staff-members/{staffMemberId}/invite:
    parameters:
      - $ref: '#/components/parameters/StaffMemberId'

    post:
      tags: [StaffMembers]
      operationId: inviteStaffMember
      summary: Invita a la persona a crear su cuenta
      description: |
        Dispara la invitación de Supabase Auth al `email` de la ficha. Cuando la persona la acepta, GoTrue
        crea el usuario y el backend vincula su `userId`.

        **Asíncrono a propósito** (`202`): el resultado depende de que un humano abra un correo. Reinvitar
        a quien no ha aceptado es **idempotente**.
      responses:
        '202':
          description: Invitación encolada.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La persona ya tiene cuenta vinculada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /staff-positions:
    get:
      tags: [StaffPositions]
      operationId: listStaffPositions
      summary: Catálogo de puestos del club
      description: |
        Colección pequeña → sin paginación. Orden por `level` ascendente y `name` — que es el orden de la
        pirámide y el que espera ver quien administra.
      responses:
        '200':
          description: Puestos del club, con sus verbos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffPositionResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [StaffPositions]
      operationId: createStaffPosition
      summary: Crea un puesto
      description: |
        `grantsAllVerbs` **no es campo de entrada**: solo lo lleva el puesto de administración que nace en
        la precarga (D-61). Un puesto creado por el admin siempre enumera sus verbos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffPositionRequest'
      responses:
        '201':
          description: Puesto creado, todavía sin verbos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPositionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ya existe un puesto con ese `name`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /staff-positions/{staffPositionId}:
    parameters:
      - $ref: '#/components/parameters/StaffPositionId'

    patch:
      tags: [StaffPositions]
      operationId: updateStaffPosition
      summary: Corrige un puesto
      description: |
        **`scopeKind` no se puede cambiar**, y es una restricción estructural, no una política: la
        asignación lo duplica con **FK compuesta** para hacer imposible la deriva (D-62), así que alterarlo
        dejaría huérfanas las asignaciones vigentes. Para cambiar de eje: puesto nuevo y reasignar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffPositionRequest'
      responses:
        '200':
          description: Puesto actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPositionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ya existe otro puesto con ese `name`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags: [StaffPositions]
      operationId: deleteStaffPosition
      summary: Retira un puesto del catálogo
      description: Borrado lógico.
      responses:
        '204':
          description: Puesto retirado.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            El puesto tiene **asignaciones vigentes**. No se borra en cascada: dejar gente sin cargo por un
            clic es peor que obligar a reasignar primero (§5.1).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /staff-positions/{staffPositionId}/permissions:
    parameters:
      - $ref: '#/components/parameters/StaffPositionId'

    put:
      tags: [StaffPositions]
      operationId: setPositionPermissions
      summary: Sustituye los verbos de un puesto
      description: |
        **`PUT` del conjunto**, sin `POST`/`DELETE` por verbo: es la plantilla de los tramos de sanción
        (D-50) y por el mismo motivo — son **configuración**, se editan en una pantalla y se guardan de una
        vez. `{"verbs": []}` deja el puesto sin permisos, que es un estado legítimo.

        Los verbos válidos son los de `GET /permissions/verbs`. Se validan **en el caso de uso**, no en la
        base de datos (D-61).

        **No se lee por aquí:** los verbos vigentes viajan dentro de `StaffPositionResponse`, así que no
        hace falta un `GET` propio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPositionPermissionsRequest'
      responses:
        '204':
          description: Verbos sustituidos.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            Algún verbo no existe en el catálogo del código. **422 y no 400**: la petición está bien
            formada —es una lista de cadenas— y lo que falla es el **valor** contra un catálogo externo al
            cuerpo (§5.4, D-61).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /permissions/verbs:
    get:
      tags: [Permissions]
      operationId: listVerbs
      summary: Catálogo de verbos autorizables
      description: |
        **El único endpoint de esta API que no lee de la base de datos.** Sirve el `enum Verb` del binario
        (D-61), así que la respuesta es **idéntica para todos los tenants** y solo cambia al desplegar.

        De ahí que sea cacheable a lo bestia: `ETag` con la versión del *build* y `Cache-Control` largo. El
        backoffice lo pide una vez por versión.

        **Por qué no hay tabla de verbos:** el catálogo cambia con cada endpoint nuevo, y un `CHECK` o una
        FK obligarían a migrar los *N* schemas de tenant cada vez. La integridad la pone el sistema de
        tipos, que garantiza algo más fuerte que una FK — que la cadena corresponde a **código que se
        ejecuta** (D-61).
      responses:
        '200':
          description: Verbos que esta versión de la API sabe autorizar.
          headers:
            ETag:
              description: Versión del *build*. Estable entre despliegues.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                examples: ['public, max-age=86400']
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VerbResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /staff-assignments:
    get:
      tags: [StaffAssignments]
      operationId: listStaffAssignments
      summary: Lista asignaciones
      description: |
        **`seasonId` es obligatorio.** Un cargo es de una temporada (D-62): sin ámbito temporal la respuesta
        mezcla años y no significa nada. Es el mismo criterio de ámbito obligatorio que en `Player` (D-37).

        `staffMemberId` y `teamId` **afinan** dentro de la temporada y se pueden combinar (D-47).
      parameters:
        - name: seasonId
          in: query
          required: true
          description: Temporada de las asignaciones. Identificador **interno** (UUID).
          schema:
            type: string
            format: uuid
        - name: staffMemberId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: teamId
          in: query
          required: false
          description: |
            Filtra las asignaciones cuyo ámbito **alcanza** a ese equipo — incluidas las de `club`,
            `modality`, `category` y `gender` que lo contienen, no solo las de ámbito `team`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Asignaciones de la temporada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAssignmentResponse'
        '400':
          description: Falta `seasonId`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [StaffAssignments]
      operationId: createStaffAssignment
      summary: Asigna un puesto a una persona
      description: |
        El `scope` debe corresponder al `scopeKind` del puesto: exactamente el campo que toca informado, y
        ninguno para `club`.

        **Es el único endpoint del contrato cuyo permiso depende de *qué* se está creando**, no solo de
        sobre qué: para nombrar a alguien en un puesto de nivel *N* sobre un ámbito *S* hace falta una
        asignación propia de nivel **estrictamente menor** y de ámbito que **contenga** a *S* (D-62).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffAssignmentRequest'
      responses:
        '201':
          description: Asignación creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAssignmentResponse'
        '400':
          description: |
            El `scope` no cuadra con el `scopeKind` del puesto — falta el campo que toca, o sobra otro.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            **El 403 de la regla del nivel** (D-62): el actor no tiene ninguna asignación de nivel menor
            cuyo ámbito contenga al de destino. El cuerpo dice cuál de las dos condiciones falló.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: La persona, el puesto, la temporada o el equipo del ámbito no existen en este club.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            Esa persona ya ocupa ese puesto sobre ese mismo ámbito en esa temporada (§3.5).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /staff-assignments/{staffAssignmentId}:
    parameters:
      - $ref: '#/components/parameters/StaffAssignmentId'

    delete:
      tags: [StaffAssignments]
      operationId: deleteStaffAssignment
      summary: Retira una asignación
      description: |
        Borrado lógico, para conservar el histórico de quién dirigió qué.
      responses:
        '204':
          description: Asignación retirada.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # Sin PATCH. Puesto, ámbito y temporada son **identidad**: cambiarlos es otra asignación, no una
  # edición — el mismo criterio que `Player` con `teamId`/`seasonId` (D-37, D-62).

  # ─────────────────────────── Ingestion (§5.6) ───────────────────────────
  /ingestion-runs:
    get:
      tags: [Ingestion]
      operationId: listIngestionRuns
      summary: Lista las pasadas de ingesta de una competición
      description: |
        **`competitionId` es obligatorio**, por el mismo motivo que en `/rounds`: una pasada fuera de su
        competición no significa nada, y exigirlo acota la colección a lo que cabe servir **sin
        paginación** (§5.3). Se devuelven de la **más reciente a la más antigua**, que es el orden en que
        se leen — la pregunta siempre es *«¿qué pasó la última vez?»*.

        **Solo lectura y sin `PATCH` ni `DELETE`**: una pasada ocurrió o no ocurrió, y no hay nada
        deducido que corregir (D-21 llevado a su forma más pura). Tampoco tiene `GET` por id: no se
        navega a una pasada, se mira la cola reciente de su competición.

        Los descartes (`skipped`) viajan **dentro** de cada fila y no como recurso aparte (D-85): se leen
        enteros junto a su pasada, y no se consultan por sus campos.
      parameters:
        - name: competitionId
          in: query
          required: true
          description: Competición cuyas pasadas se listan. Identificador **interno** (UUID).
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Cuántas devolver, de la más reciente hacia atrás.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Pasadas de la competición, de la más reciente a la más antigua.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngestionRunResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: La competición no existe en este club.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    post:
      tags: [Ingestion]
      operationId: triggerIngestion
      summary: Lanza una pasada de ingesta
      description: |
        El **disparador manual** de lo que normalmente hace el job (§2.3-b). Existe porque la cadencia
        vive fuera del proceso (D-87): sin esto, la única forma de forzar una sincronización sería entrar
        en la máquina.

        **No crea filas a mano.** Pide que la ingesta pase; las filas de `ingestion-runs` las escribe
        ella, con la misma política de §3.7 que el job — este endpoint no es una segunda puerta de
        escritura sobre los datos ingeridos.

        **Dos respuestas, y la diferencia es el coste** (§2.3-c):

        - **Exactamente una** en `competitionIds` → **200** con la pasada ya hecha. Es una petición a la
          federación y el calendario de un grupo: cabe dentro de una respuesta HTTP, y devolverla ya
          resuelta es lo que hace útil el botón de la ficha de una competición.
        - **Dos o más, una temporada, o nada** → **202**, con la lista de lo que se ha aceptado. Cada
          competición son ~240 partidos (D-67): meter varias en una petición síncrona es exactamente lo
          que aquella decisión existe para evitar. El resultado se consulta después con el `GET` de arriba.

        **El código lo decide la petición, no los datos.** Con `{}` sobre un club que solo tiene una
        competición la respuesta sigue siendo **202**: que un cliente reciba 200 o 202 según cuántos
        equipos tenga el club sería una forma de respuesta imposible de programar.

        **Ignora el antirrebote** del job (§5.6): quien pulsa el botón lo pulsa porque quiere ahora.

        Requiere **rol elevado** (§7.3): es una operación de integración, no dato del día a día.
      requestBody:
        # **`required: true` con todos sus campos opcionales**, y no es una
        # contradicción: para pedir la temporada vigente entera se manda `{}`.
        #
        # Se declaró `false` primero, describiendo que el cuerpo se podía omitir.
        # **Era falso**: el servidor generado intenta parsear el cuerpo igual y un
        # `POST` sin nada devuelve 400 (comprobado con un test, no deducido del
        # YAML). Se corrige el contrato en vez de la realidad, que es la regla de
        # D-65: el generador emite tipos, no comportamiento.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerIngestionRequest'
      responses:
        '200':
          description: La pasada, ya terminada. Solo cuando la petición nombra **exactamente una** competición.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionRunResponse'
        '202':
          description: Recorrido aceptado. El resultado se consulta con `GET /ingestion-runs`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: La temporada o la competición pedidas no existen en este club.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: |
            La federación de este club está en el catálogo pero **todavía no tiene adaptador de ingesta**
            (D-17). No se ha roto nada y no hay nada que reintentar.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: |
            La federación respondió algo que no es de esta competición (D-84) o no respondió. El fallo no
            es del cliente; queda registrado en `ingestion-runs`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Contexto del actor de la petición
      description: |
        Quién es el llamante en este club, qué asignaciones tiene vigentes y **qué verbos puede ejercer
        sobre qué ámbito**.

        Existe para que el backoffice decida qué botones pinta; sin él acabaría probando operaciones para
        descubrir por el 403 si podía hacerlas. **No es la autoridad**: la comprobación real ocurre siempre
        en el caso de uso (§7.4, D-63), y un cliente que ignore esta respuesta no gana ningún permiso.
      parameters:
        - name: seasonId
          in: query
          required: false
          description: |
            Temporada sobre la que resolver las asignaciones. Por defecto, la temporada actual
            (`isCurrent`, §3.2).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Contexto del actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            El usuario del token está autenticado pero **no tiene ficha de personal en este club**. Es el
            caso de una cuenta creada y todavía no vinculada (D-59).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT emitido por **Supabase Auth** (§7.1), validado contra JWKS. Transporta los
        *claims* de tenant `club_id` y `role`, inyectados por un Auth Hook (§7.2).

  parameters:
    SeasonId:
      name: seasonId
      in: path
      required: true
      description: Identificador **interno** (UUID) de la temporada. No es el `federationSeasonId`.
      schema:
        type: string
        format: uuid
    CompetitionId:
      name: competitionId
      in: path
      required: true
      description: |
        Identificador **interno** (UUID) de la competición. No es el `federationCompetitionId` ni el
        `federationGroupId`: esos son datos de integración, nunca claves de unión (§3.7).
      schema:
        type: string
        format: uuid
    OpponentClubId:
      name: opponentClubId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoundId:
      name: roundId
      in: path
      required: true
      description: Identificador **interno** (UUID) de la jornada. No es su `number` dentro de la competición.
      schema:
        type: string
        format: uuid
    MatchId:
      name: matchId
      in: path
      required: true
      description: |
        Identificador **interno** (UUID) del partido. No es el `federationMatchId` (`codacta`), que además
        puede no existir (D-31).
      schema:
        type: string
        format: uuid
    PlayerId:
      name: playerId
      in: path
      required: true
      description: |
        Identificador **interno** (UUID) del jugador. Identifica la fila *(jugador, equipo, temporada)*
        (D-05): el mismo chaval en la temporada siguiente tiene otro `playerId`.
      schema:
        type: string
        format: uuid
    AbsenceId:
      name: absenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppearanceId:
      name: appearanceId
      in: path
      required: true
      description: |
        Identificador **interno** (UUID) de la convocatoria. La fila también es direccionable por su par
        *(jugador, partido)*, que es único (§3.5), pero el contrato no ofrece esa ruta: se llega a ella por
        la lista de ámbito.
      schema:
        type: string
        format: uuid
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoalId:
      name: goalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Página solicitada, base 1 (§5.3).
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      required: false
      description: Elementos por página (§5.3).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    StaffMemberId:
      name: staffMemberId
      in: path
      required: true
      description: Identificador **interno** (UUID) de la persona. No es su `userId` de Supabase Auth (D-59).
      schema:
        type: string
        format: uuid
    StaffPositionId:
      name: staffPositionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffAssignmentId:
      name: staffAssignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Cuerpo mal formado o que incumple una restricción de formato.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Falta el token, es inválido o ha caducado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: El rol del token no autoriza esta operación (§7.3).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: El recurso no existe en este club.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    # ───────────────────────────── Errores (§5.4) ─────────────────────────────
    Problem:
      type: object
      description: RFC 7807 *Problem Details*. El Controller traduce los errores de dominio a HTTP.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica el tipo de problema.
          examples: ['https://api.example.com/problems/duplicate-season-label']
        title:
          type: string
          description: Resumen legible y estable del tipo de problema.
          examples: ['Ya existe una temporada con esa etiqueta']
        status:
          type: integer
          description: Código de estado HTTP, repetido aquí por conveniencia.
          examples: [409]
        detail:
          type: string
          description: Explicación concreta de **esta** ocurrencia.
        code:
          type: string
          description: Código de error interno, estable, para que el cliente ramifique.
          examples: ['SEASON_LABEL_TAKEN']

    # ────────────────────────────── Club (§5.2) ──────────────────────────────
    ClubSettings:
      type: object
      description: |
        Preferencias del club. **Contenido pendiente de definir** (§9): se irá poblando
        cuando aparezcan preferencias reales.

        Se persiste como `jsonb`, pero cruza el contrato como **estructura tipada** (campos
        declarados), no como JSON opaco — un `jsonb` libre en el contrato sería una puerta
        trasera para meter dominio sin modelarlo.
      additionalProperties: false
      properties: {}

    ClubResponse:
      type: object
      required:
        [id, name, shortName, slug, federation, federationProvidesRoundStandings,
         federationProvidesScorers, settings, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Nombre oficial, largo.
          examples: ['Club Deportivo Ejemplo']
        shortName:
          type: string
          description: Nombre corto, para cabeceras y espacios reducidos.
          examples: ['CD Ejemplo']
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          readOnly: true
          description: |
            Identificador **interno** para rutas y nombres de fichero. **Inmutable**: se fija al
            aprovisionar el club y no se edita por API. Cambiarlo huerfanaría los *assets* ya
            almacenados y rompería el enrutado por subdominio (§6.1) — es configuración de
            despliegue, no dato de negocio.
          examples: ['cd-ejemplo']
        crestUrl:
          type: [string, 'null']
          format: uri
          readOnly: true
          description: |
            URL pública del escudo, **compuesta en la respuesta** a partir de la clave del objeto en
            Storage (§3.7). En BD se guarda la clave, no la URL, para no atarse a un dominio/bucket.
        federation:
          allOf:
            - $ref: '#/components/schemas/FederationCode'
          readOnly: true
          description: |
            Federación del club. **Se fija al aprovisionar** y ninguna operación de esta API la cambia:
            determina a qué API se sincroniza todo el tenant.
        federationProvidesRoundStandings:
          type: boolean
          readOnly: true
          description: |
            **Derivado del catálogo de federaciones en código** (D-17), no almacenado: `true` si la
            federación permite pedir la clasificación **de una jornada pasada** (**RFFM sí**), `false` si
            solo publica la vigente (**FCF**) — D-55.

            **Las dos federaciones publican clasificación**; lo que las separa es poder recuperarla hacia
            atrás. Con `false`, la ingesta guarda cada semana la clasificación vigente como *snapshot* de
            su jornada, así que en régimen estacionario **también hay dato oficial**: lo que no se puede es
            rellenar las jornadas **anteriores al alta**, que se calculan desde `Match` (D-15).

            **No condiciona si hay clasificación**: la hay siempre. Es un dato de **procedencia** (§3.7)
            para que el backoffice pueda rotular "clasificación calculada". Las apps de consulta pueden
            ignorarlo.

            Vive aquí, y no en `Round` ni en `Competition`, porque la capacidad es **de la federación** y
            hay **una por tenant** (§3.6): dentro de un club el valor es constante (D-29).
        federationProvidesScorers:
          type: boolean
          readOnly: true
          description: |
            **Derivado del catálogo de federaciones en código** (D-17), como su hermano de arriba: `true`
            si la federación publica ranking de goleadores.

            **Pero, al contrario que aquél, este sí condiciona que haya dato** (D-48). La clasificación
            existe siempre —ingerida o calculada (D-15)—, así que `federationProvidesRoundStandings` solo
            habla de *procedencia*. Aquí no hay *fallback* posible: calcular el ranking exigiría la
            plantilla de los rivales, que no tenemos ni vamos a tener (D-09). Si esto es `false`,
            `GET /v1/league-scorers` devuelve **siempre** página vacía.

            **Por eso las apps no pueden ignorarlo**: es la diferencia entre ocultar la pantalla de
            goleadores y pintar un vacío que parece un fallo.
        settings:
          $ref: '#/components/schemas/ClubSettings'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    UpdateClubRequest:
      type: object
      description: |
        Actualización parcial. **Campo ausente = no se modifica.** En los campos anulables,
        enviar `null` explícito **borra** el valor.

        No existe `CreateClubRequest`: no hay `POST /club` (el alta es provisión, §6.3).

        **No admite `slug`** (inmutable, §3.2) **ni el escudo** (un binario no viaja en un PATCH JSON;
        endpoint de subida aparte, pendiente).
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        shortName:
          type: string
          minLength: 1
        settings:
          $ref: '#/components/schemas/ClubSettings'

    # ───────────────────────────── Season (§5.2) ─────────────────────────────
    SeasonLabel:
      type: string
      pattern: '^\d{4}/\d{2}$'
      description: |
        Etiqueta de la temporada. El `pattern` rechaza el cuerpo mal formado **en el borde**
        (400); el *Value Object* `SeasonLabel` del dominio (§4.1) garantiza la misma
        invariante en la ruta de **ingesta**, que no pasa por este contrato — validación en
        **dos capas**, deliberada.
      examples: ['2024/25']

    CreateSeasonRequest:
      type: object
      required: [label, federationSeasonId]
      additionalProperties: false
      properties:
        label:
          $ref: '#/components/schemas/SeasonLabel'
        federationSeasonId:
          type: string
          minLength: 1
          description: |
            Identificador de la temporada en la **API de la federación/liga** (§3.7).
            Distinto del `id` UUID interno y **obligatorio**: toda temporada tiene
            contrapartida federativa y este es el parámetro con el que se llama a esa API.

    UpdateSeasonRequest:
      type: object
      description: Actualización parcial. **Campo ausente = no se modifica.**
      additionalProperties: false
      minProperties: 1
      properties:
        label:
          $ref: '#/components/schemas/SeasonLabel'
        federationSeasonId:
          type: string
          minLength: 1

    SeasonResponse:
      type: object
      required: [id, label, federationSeasonId, startDate, endDate, isCurrent, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          $ref: '#/components/schemas/SeasonLabel'
        federationSeasonId:
          type: string
        startDate:
          type: string
          format: date
          readOnly: true
          description: Derivada de `label` (01/07/AAAA). Fija, no *overridable* (§3.2).
          examples: ['2024-07-01']
        endDate:
          type: string
          format: date
          readOnly: true
          description: Derivada de `label` (30/06/AABB). Fija, no *overridable* (§3.2).
          examples: ['2025-06-30']
        isCurrent:
          type: boolean
          readOnly: true
          description: |
            **Derivada en lectura, no almacenada** (§3.2): es la temporada con el `endDate`
            más próximo que aún es ≥ hoy. Como el tiempo no retrocede, hay exactamente una
            y no queda invariante que mantener. La resuelve `CurrentSeasonQuery` (§4.5).
        archivedAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: Instante de archivado, o `null` si la temporada está activa.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    PurgePreviewResponse:
      type: object
      description: Paso 1 del purge en dos pasos (§5.4).
      required: [seasonId, label, impact, confirmationToken, expiresAt]
      properties:
        seasonId:
          type: string
          format: uuid
        label:
          $ref: '#/components/schemas/SeasonLabel'
        impact:
          type: object
          description: Recuento de registros que se borrarían, por entidad dependiente.
          additionalProperties:
            type: integer
            minimum: 0
          examples:
            - competitions: 3
              matches: 84
              goals: 217
        confirmationToken:
          type: string
          description: |
            Token opaco, de **un solo uso** y **corta vida**. Se envía en `If-Match` al
            ejecutar la purga.
        expiresAt:
          type: string
          format: date-time
          description: Instante a partir del cual el token deja de ser válido (412).

    # ─────────────────────────── Paginación (§5.3) ───────────────────────────
    Page:
      type: object
      description: Sobre de paginación. Se combina con el `data` propio de cada colección.
      required: [page, perPage, total]
      properties:
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: Total de elementos que cumplen el filtro, no solo los de esta página.

    # ───────────────────────── Enumerados (§3.3) ─────────────────────────
    TeamCategory:
      type: string
      description: |
        Categoría del equipo. `senior` cubre tanto el "Primer Equipo" como los filiales; se distinguen
        por `letter` (§3.2).
      enum: [prebenjamin, benjamin, alevin, infantil, cadete, juvenil, senior]

    Gender:
      type: string
      description: |
        Género de la competición y, por herencia, del equipo (§3.3). **Compartido entre `Competition` y
        `Team`**, igual que `Modality`.

        Forma parte de la **clave única de `Team`** (§3.5): el "Infantil A" masculino y el femenino del
        mismo club son equipos **distintos**.

        **La federación no publica este dato como campo.** Lo embebe en el nombre de la competición
        (`"TERCERA FEDERACION DE FÚTBOL FEMENINO"`), así que el `preview` lo **infiere y lo propone**, el
        administrador lo **confirma** en el alta de la competición, y `Team` lo **hereda** de ahí (D-58).
        Por eso es `readOnly` en `Team` y escribible en `Competition`.

        **`mixto` no es expresable en la fuente**: solo lo puede poner un humano.
      enum: [masculino, femenino, mixto]

    Modality:
      type: string
      description: |
        Modalidad de juego. **Enumerado de dominio, no de integración**: significa lo mismo en cualquier
        federación, mientras que su código externo (el parámetro `tipojuego` de la RFFM) no. Ese código
        **no se almacena**; vive en el catálogo de federaciones, en código (§3.6).

        Forma parte de la **identidad** del equipo y de su clave única (§3.5): el "Infantil A masculino"
        de fútbol-11 y el de fútbol-sala son equipos **distintos**, con distinta competición y distinto
        `federationTeamId`. Sin este campo, un club con equipos en dos modalidades no se podía
        representar.
      enum: [futbol_11, futbol_7, futbol_5, futbol_sala, futbol_playa]

    MatchStatus:
      type: string
      description: |
        Estado del partido. **Lo escribe la ingesta**, por dos vías según de quién sea el partido (D-57):

        - **Partidos de un equipo propio** → del **acta** (Anexo de la Federación §F.10), que sí trae
          `suspendido`, `acta_cerrada` y `partido_en_juego`. Aquí los cuatro valores son alcanzables.
        - **Partidos ajenos** → **derivado del marcador**, porque el calendario no trae estado (§F.2):
          `finalizado` si hay goles, `programado` si no. Aquí **solo esos dos** son posibles.

        La asimetría es deliberada: el acta cuesta **una petición por partido**, así que se pide solo para
        lo que es del club (D-57). Ninguna pantalla necesita saber que el partido de otros dos equipos se
        aplazó, y la clasificación tampoco.
      enum: [programado, finalizado, aplazado, suspendido]

    MatchOutcome:
      type: string
      description: |
        Resultado de un partido **relativo a un equipo**. No confundir con `MatchStatus`, que es absoluto:
        un mismo partido es `finalizado` para los dos equipos, pero `victoria` para uno y `derrota` para el
        otro. Solo aparece dentro de la racha (`StandingResponse.form`, D-34).
      enum: [victoria, empate, derrota]

    PlayerPosition:
      type: string
      description: |
        Demarcación del jugador. **Cuatro valores gruesos, no un catálogo táctico**: la plantilla de fútbol
        base la teclea un entrenador, y distinguir lateral de central o interior de mediocentro añade
        decisiones donde solo hacía falta un rótulo. La pantalla de plantilla imprime exactamente esto
        (`PORTERO`, `DEFENSA`…).
      enum: [portero, defensa, centrocampista, delantero]

    AbsenceType:
      type: string
      description: |
        Causa de la ausencia. **`sancion` no la produce el sistema**: los tramos de amarillas (D-10) avisan
        de que llega, pero registrarla es un acto del administrador — derivarla de `Card` daría dos
        escritores a una tabla de dominio manual.

        **`otro` es el cajón declarado** (viaje de estudios, decisión técnica, motivos familiares). Si un
        caso de `otro` se repite lo bastante como para querer contarlo aparte, la salida es **un valor
        nuevo** en este enumerado, no un campo de texto libre que nadie podría agregar.
      enum: [lesion, enfermedad, sancion, otro]

    AppearanceStatus:
      type: string
      description: |
        Qué hizo el jugador en ese partido. Los cuatro valores son los cuatro recuentos de la pantalla de
        estadísticas (JUGADOS / BAJA MÉDICA / SANCIÓN / NO CONVOCADO), y esa es exactamente la razón de que
        sean cuatro: **el enumerado es la leyenda de la pantalla**, no una taxonomía de disponibilidad.

        **`no_convocado` es un hecho, no la ausencia de dato** (D-41): significa que estuvo disponible y el
        entrenador no lo llamó —decisión técnica—. Que **no haya fila** es cosa distinta: significa que
        nadie apuntó la convocatoria de ese partido.

        **Se solapa a propósito con `AbsenceType`** en dos valores (`baja_medica` ~ `lesion`/`enfermedad`,
        `sancionado` ~ `sancion`) y no se deriva de él. Una `Absence` es un **periodo** y este campo es un
        **hecho por partido**: el periodo dice por qué no estaba, la fila dice qué pasó ese domingo. Ni
        una alimenta a la otra — las dos las escribe el administrador (D-41).
      enum: [jugado, baja_medica, sancionado, no_convocado]

    CardType:
      type: string
      description: |
        **Dos valores, no tres**: la doble amarilla no es un tipo propio sino una `roja` con
        `isSecondYellow = true` (D-45). Así "¿expulsado?" es `type = 'roja'` y la cuenta de acumulación
        (D-10) es `type = 'amarilla'`, las dos sin excepciones que recordar.
      enum: [amarilla, roja]

    GoalZone:
      type: string
      description: |
        Zona desde la que se marca. **Partición exclusiva de tres valores** (D-11): cada gol tiene
        exactamente una zona, o ninguna si no se apuntó.

        Tres y no más porque las teclea un entrenador de fútbol base viendo el partido: distinguir más
        finamente añadiría decisiones donde solo hacía falta un rótulo, y el mockup imprime exactamente
        estos tres.
      enum: [area_chica, area_penalti, fuera_area]

    GoalSide:
      type: string
      description: Lado del campo desde el que llega el gol.
      enum: [derecha, izquierda, centro]

    GoalBodyPart:
      type: string
      description: |
        Parte del cuerpo con la que se marca. **`otro` es el cajón declarado** — mismo criterio que
        `AbsenceType.otro`: si un caso se repite lo bastante como para querer contarlo aparte, la salida es
        **un valor nuevo** en el enumerado, no un texto libre que nadie podría agregar.
      enum: [pie, cabeza, otro]

    GoalPlayType:
      type: string
      description: |
        Tipo de jugada. **`en_propia_puerta` es el valor que altera las invariantes del gol** (D-52): en él
        el `scorerPlayerId` pertenece al equipo que **encaja**, no al que marca, no se admite asistencia, y
        el gol **no suma** en el conteo del goleador aunque quede registrado a su nombre.

        Es también el motivo de que este campo no sea un simple rótulo estadístico como `zone` o `side`:
        cambiarlo cambia qué es válido en el resto de la fila.
      enum: [juego_abierto, penalti, falta, en_propia_puerta]

    FederationCode:
      type: string
      description: |
        Federación a la que pertenece el club. **Catálogo en código, no tabla** (§3.6): dar de alta una
        federación no la hace funcionar, porque soportar una nueva exige escribir un adaptador
        (ingeniería inversa de su API, §2.1). De ella salen la URL base, la numeración de temporada y el
        mapa de códigos de modalidad.

        Es propiedad **del tenant**, no de cada competición: un club de Madrid compite en la RFFM y uno
        catalán en la FCF, y no son el mismo tenant.
      enum: [rffm, fcf]

    # ─────────────────────── Competition (§5.2) ───────────────────────
    PreviewCompetitionRequest:
      type: object
      description: |
        Verificación de una coordenada. **Se pega la URL entera del calendario**, no cuatro campos:
        copiar una URL de la barra de direcciones es una operación sin error posible, teclear cuatro
        números opacos no — y un dígito mal **no da error**, devuelve el calendario de otro grupo (§3.7).
      required: [federationCalendarUrl]
      additionalProperties: false
      properties:
        federationCalendarUrl:
          type: string
          format: uri
          description: |
            URL del calendario del grupo, copiada de la web de la federación. El servidor extrae de ella
            los cuatro parámetros (`temporada`, `tipojuego`, `competicion`, `grupo`) y comprueba que el
            *host* corresponde a la federación del club.
          examples:
            - 'https://www.rffm.es/competicion/calendario?temporada=21&tipojuego=1&competicion=24037548&grupo=24037549'

    PreviewTeam:
      type: object
      description: Equipo tal y como lo publica la federación, **sin normalizar ni persistir**.
      required: [federationTeamId, rawName]
      properties:
        federationTeamId:
          type: string
          description: '`codigo_equipo` (§3.7). Es lo que se envía como `ownTeamFederationId` al enganchar (D-67).'
          examples: ['3349086']
        rawName:
          type: string
          description: |
            Nombre tal cual llega, **con la letra embebida** entre comillas simples. Se muestra sin tocar
            para que el administrador reconozca su club exactamente como lo ve en la web de la
            federación; la separación en club + letra la hace la ingesta después (§3.7).
          examples: ["CELTIC CASTILLA C.F. 'A'"]
        crestUrl:
          type: [string, 'null']
          format: uri
          description: |
            Escudo **en el origen** (aún no descargado a Storage). Solo para que la pantalla de
            confirmación sea reconocible de un vistazo.

    CompetitionPreviewResponse:
      type: object
      description: |
        Lo que hay en la coordenada. **Nada de esto se ha persistido**: es un dato de pantalla para que
        un humano confirme antes de guardar.
      required:
        [modality, gender, ageCategory, divisionLabel, groupLabel, federationCompetitionId,
         federationGroupId, roundCount, teams, alreadyRegistered]
      properties:
        modality:
          $ref: '#/components/schemas/Modality'
        gender:
          allOf:
            - $ref: '#/components/schemas/Gender'
          description: |
            **Propuesta, no hecho** (D-58). Sale de buscar el marcador `FEMENINO` en el nombre de la
            competición; sin marcador se propone `masculino`. El administrador puede cambiarlo antes de
            confirmar, y a veces **debe**: `mixto` no es expresable en la fuente y el rótulo puede llegar
            truncado.
        ageCategory:
          $ref: '#/components/schemas/TeamCategory'
        divisionLabel:
          type: string
          examples: ['Primera']
        groupLabel:
          type: string
          examples: ['Grupo 1']
        federationCompetitionId:
          type: string
          examples: ['24037548']
        federationGroupId:
          type: string
          examples: ['24037549']
        roundCount:
          type: integer
          minimum: 0
          description: Jornadas que trae el calendario.
        teams:
          type: array
          description: |
            **La razón de ser de este endpoint**: el administrador debe reconocer aquí su propio club
            antes de confirmar. Es de donde sale el `ownTeamFederationId` del enganche (D-67).
          items:
            $ref: '#/components/schemas/PreviewTeam'
        alreadyRegistered:
          type: boolean
          description: |
            `true` si ya existe una competición con ese grupo en esa temporada. Evita el error más
            probable —dar de alta dos veces el mismo grupo— antes de que llegue a ser un 409.

    CreateCompetitionRequest:
      description: |
        Alta de la competición: la **coordenada** de la federación más los **rótulos** que se mostrarán.

        La coordenada admite **dos formas y exige exactamente una**, por eso son dos esquemas
        autocontenidos y no campos opcionales de uno solo:

        - **Por URL** — la vía del humano, que es quien la tiene en el portapapeles tras el `preview`.
        - **Por campos** — la vía estable para semillas, *scripts* y tests, que no deberían depender del
          formato de URL de un tercero.

        Se almacenan siempre los campos; **la URL no se guarda**, se reconstruye al llamar (§3.7).
      oneOf:
        - $ref: '#/components/schemas/CreateCompetitionFromUrlRequest'
        - $ref: '#/components/schemas/CreateCompetitionFromIdsRequest'

    CreateCompetitionFromUrlRequest:
      type: object
      description: Forma A — se pega la URL del calendario y el servidor la descompone.
      required: [seasonId, federationCalendarUrl, gender, ageCategory, divisionLabel, groupLabel]
      additionalProperties: false
      properties:
        seasonId:
          type: string
          format: uuid
          description: UUID **interno** de la temporada, no el `federationSeasonId`.
        federationCalendarUrl:
          type: string
          format: uri
          description: La misma URL que se envió al `preview`.
          examples:
            - 'https://www.rffm.es/competicion/calendario?temporada=21&tipojuego=1&competicion=24037548&grupo=24037549'
        gender:
          allOf:
            - $ref: '#/components/schemas/Gender'
          description: |
            Confirmación del valor que propuso el `preview` (D-58). **Obligatorio y sin defecto**: es el
            campo que la ingesta copiará a cada `Team` que cree, donde entra en la clave única (§3.5),
            así que no se deja implícito.
        ageCategory:
          $ref: '#/components/schemas/TeamCategory'
        divisionLabel:
          type: string
          minLength: 1
          description: |
            Texto libre a propósito (§3.2): los nombres de división varían por federación y por categoría
            ("Primera", "Preferente", "Honor", "Autonómica"…) y no forman un enumerado cerrado.
          examples: ['Primera']
        groupLabel:
          type: string
          minLength: 1
          description: |
            Rótulo del grupo. **No es deducible de `federationGroupId`** — uno se muestra, el otro se
            llama (§3.7). Texto libre, porque hay grupos sin número ("Grupo Único").
          examples: ['Grupo 1']

    CreateCompetitionFromIdsRequest:
      type: object
      description: |
        Forma B — coordenada ya descompuesta. `modality` sustituye aquí al parámetro `tipojuego`, que no
        se almacena: se codifica al llamar con el mapa de la federación (§3.6).
      required:
        [seasonId, modality, gender, federationCompetitionId, federationGroupId,
         ageCategory, divisionLabel, groupLabel]
      additionalProperties: false
      properties:
        seasonId:
          type: string
          format: uuid
          description: UUID **interno** de la temporada, no el `federationSeasonId`.
        modality:
          $ref: '#/components/schemas/Modality'
        gender:
          $ref: '#/components/schemas/Gender'
        federationCompetitionId:
          type: string
          minLength: 1
          description: '`competicion=…`: designa **categoría de edad + división** (§3.7).'
          examples: ['24037548']
        federationGroupId:
          type: string
          minLength: 1
          description: '`grupo=…`: designa **solo el grupo** (§3.7).'
          examples: ['24037549']
        ageCategory:
          $ref: '#/components/schemas/TeamCategory'
        divisionLabel:
          type: string
          minLength: 1
        groupLabel:
          type: string
          minLength: 1

    UpdateCompetitionRequest:
      type: object
      description: |
        Actualización parcial. **Campo ausente = no se modifica.**

        Los **rótulos** son siempre editables; las **coordenadas externas**, solo mientras
        `lastSyncedAt` sea `null` — después, cambiarlas es repuntar a otro calendario y devuelve **409**
        (§3.7).

        **`gender` sigue la regla de las coordenadas, no la de los rótulos** (D-58), y es el único campo
        no-coordenada que lo hace: los rótulos solo se muestran, pero el género **ya se propagó** a cada
        `Team` que creó la ingesta, donde forma parte de la clave única (§3.5). Cambiarlo después de
        sincronizar dejaría la competición diciendo una cosa y sus equipos otra → **409**.

        No admite `seasonId` (una competición no se muda de temporada) ni `modality` (con los datos ya
        ingeridos, cambiarla invalidaría la identidad de los equipos, §3.5).
      additionalProperties: false
      minProperties: 1
      properties:
        gender:
          allOf:
            - $ref: '#/components/schemas/Gender'
          description: |
            Editable **solo mientras `lastSyncedAt` sea `null`**; después, **409** (D-58).
        ageCategory:
          $ref: '#/components/schemas/TeamCategory'
        divisionLabel:
          type: string
          minLength: 1
        groupLabel:
          type: string
          minLength: 1
        federationCompetitionId:
          type: string
          minLength: 1
        federationGroupId:
          type: string
          minLength: 1

    CompetitionResponse:
      type: object
      required:
        [id, seasonId, modality, gender, ageCategory, divisionLabel, groupLabel,
         federationCompetitionId, federationGroupId, displayName, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        seasonId:
          type: string
          format: uuid
          readOnly: true
        modality:
          $ref: '#/components/schemas/Modality'
        gender:
          $ref: '#/components/schemas/Gender'
        ageCategory:
          $ref: '#/components/schemas/TeamCategory'
        divisionLabel:
          type: string
          examples: ['Primera']
        groupLabel:
          type: string
          examples: ['Grupo 1']
        federationCompetitionId:
          type: string
          description: |
            `competicion=…` de la URL del calendario: **categoría de edad + división** (§3.7). Junto con
            `federationGroupId`, `modality` y el `federationSeasonId` de la temporada, es la coordenada
            con la que se llama a la federación. **No es clave de unión**: nunca PK, nunca FK.
          examples: ['24037548']
        federationGroupId:
          type: string
          description: '`grupo=…` de la URL: **solo** el grupo (§3.7).'
          examples: ['24037549']
        displayName:
          type: string
          readOnly: true
          description: '**Derivado en lectura**: `ageCategory` · `divisionLabel` · `groupLabel`.'
          examples: ['Infantil · Primera · Grupo 1']
        lastSyncedAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: |
            Última sincronización **con éxito**. **`null` ⇒ nunca sincronizada**, que es exactamente la
            condición bajo la cual las coordenadas externas siguen siendo editables por `PATCH` (§3.7).

            **No sirve para saber si algo va mal** (D-89): una pasada que falla hace `rollback` y **no
            toca este campo** (D-83), así que una competición sincronizada ayer y rota hoy tiene el mismo
            valor que una que está perfecta. Para eso está `ingestionHealth`.
        lastIngestionAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: |
            Cuándo terminó la **última pasada**, con éxito **o sin él** (D-89). Con `lastSyncedAt` forman
            el par que la pantalla necesita: *"lo último que tenemos"* y *"la última vez que se intentó"*.
            Iguales ⇒ la última pasada fue bien.
        ingestionHealth:
          $ref: '#/components/schemas/IngestionHealth'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # ─────────────────────── OpponentClub (§5.2) ───────────────────────
    OpponentClubResponse:
      type: object
      required: [id, name, shortName, slug, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: |
            Nombre del club rival. Lo crea la ingesta a partir del **texto libre** de la API de la
            federación (§3.7) y puede requerir corrección manual.
          examples: ['CELTIC CASTILLA C.F.']
        shortName:
          type: string
          description: Nombre corto para mostrar. Si no se aporta al crear, se inicializa desde `name`.
          examples: ['Celtic Castilla']
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          readOnly: true
          description: |
            Identificador interno para rutas y nombres de fichero. Lo **genera el servidor a partir del
            nombre al crear la fila** y es **inmutable** después.

            Deliberadamente **no se deriva del `federationClubId`**: eso ataría un identificador interno y
            permanente al valor de un sistema de terceros que puede no estar disponible ni ser estable
            (§3.7). Y como nunca se recalcula, una corrección posterior del nombre **no deja *assets*
            huérfanos**: el fichero conserva su nombre original, algo desfasado pero estable. Un slug
            interno no se muestra, así que que envejezca no molesta.

            **La derivación es mecánica** (`D-82`): plegar acentos, minúsculas, y cada corrida de lo que
            no sea letra o dígito se convierte en **un** guion. No se limpia la forma jurídica —"C.F.",
            "C.D.", "S.A.D."…—: eso exigiría una lista que nadie mantiene y se queda corta con la primera
            federación nueva, y no compra nada porque este identificador no se muestra. Si dos clubes
            distintos derivan el mismo slug, el segundo lleva sufijo (`-2`).
          examples: ['celtic-castilla-c-f']
        federationClubId:
          type: [string, 'null']
          readOnly: true
          description: |
            Clave del club en la API de la federación. **No es un campo propio de esa API**: se obtiene
            del segmento numérico de la ruta del escudo (`/pnfg/pimg/Clubes/00100_`**`0010940034`**`_….png`),
            que se ha observado **constante para el mismo club en distintas categorías** (§3.7). Al ser
            una inferencia sobre un nombre de fichero y no un contrato publicado, la ingesta tolera que
            el patrón no case y degrada a emparejamiento por nombre normalizado + categoría, y de ahí a
            revisión manual (§3.7). Nulo si el club se creó a mano o si no pudo extraerse.

            **No es una clave de unión**: nunca PK, nunca FK, nunca un `JOIN` interno — dentro del
            *schema* se une siempre por el `id` UUID. Es solo un dato de integración para que la ingesta
            reconozca a qué fila corresponde lo que llega de fuera.
          examples: ['0010940034']
        crestUrl:
          type: [string, 'null']
          format: uri
          readOnly: true
          description: |
            URL pública compuesta en la respuesta desde la clave del objeto en Storage. El escudo se
            **descarga** de la federación y se guarda; no se enlaza al origen (§3.7).
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # No existe CreateOpponentClubRequest (§5.1). Que el esquema *no exista* hace la frontera de D-21
    # comprobable por el generador, no solo por prosa (D-25).

    UpdateOpponentClubRequest:
      type: object
      description: |
        Actualización parcial. **Campo ausente = no se modifica.**

        No permite tocar `slug` ni `federationClubId`: son la identidad estable con la que la ingesta
        vuelve a encontrar este club en cada sincronización. Corregir el **nombre** es justamente lo que
        se espera aquí, y por eso no puede arrastrar al slug.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        shortName:
          type: string
          minLength: 1

    # ───────────────────────────── Team (§5.2) ─────────────────────────────
    TeamResponse:
      type: object
      description: |
        Incluye varios campos **derivados** (`isOwn`, `clubName`, `displayName`, `crestUrl`): ninguno se
        almacena ni se acepta en escritura, todos se componen en el servidor. El criterio es que la app
        móvil pueda **pintar una fila de equipo con una sola llamada**, sin resolver el club por su cuenta.
      required: [id, category, gender, modality, isOwn, clubName, displayName, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          $ref: '#/components/schemas/TeamCategory'
        letter:
          type: [string, 'null']
          description: Letra que distingue equipos de la misma categoría ("A", "B"…).
          examples: ['A']
        gender:
          allOf:
            - $ref: '#/components/schemas/Gender'
          readOnly: true
          description: |
            **Identidad, fijada al crear el equipo y congelada después** (D-66): va en `CreateTeamRequest`
            y **nunca** en `UpdateTeamRequest` (D-58). Para los equipos que crea la ingesta lo hereda de
            la competición —la federación no publica género por equipo, lo embebe en el nombre de la
            competición—, así que ahí el valor bueno es el que un humano confirmó al dar de alta el grupo.
        modality:
          allOf:
            - $ref: '#/components/schemas/Modality'
          readOnly: true
          description: |
            **Identidad, no atributo**: entra en la clave única de §3.5. La fija el club al crear el
            equipo (D-66) o la ingesta desde la competición, y en ambos casos queda **congelada**: va en
            `CreateTeamRequest` y nunca en `UpdateTeamRequest`.
        opponentClubId:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: |
            **Nulo ⇒ equipo propio** (del club del tenant); no nulo ⇒ equipo rival. Solo se cambia por
            `PUT`/`DELETE /teams/{teamId}/ownership`, nunca por `PATCH`.
        federationTeamId:
          type: [string, 'null']
          readOnly: true
          description: |
            `codigo_equipo` de la API de la federación (§3.7). Identifica al **equipo**, no al club: el
            mismo club tiene un código distinto en cada categoría (`821` y `3349086` para Celtic Castilla
            en dos categorías, con idéntico nombre y escudo). Es la clave de emparejamiento de la ingesta
            — casar por nombre sería **incorrecto**, porque el nombre no incluye la categoría y colapsaría
            dos equipos distintos en uno. **Estable entre temporadas** (verificado: el mismo `3349086` en
            las temporadas 25/26 y 26/27), por eso vive en `Team`, que es independiente de la temporada.

            **No es una clave de unión**: nunca PK, nunca FK, nunca un `JOIN` interno.

            **Nulo = equipo sin emparejar**, y eso decide qué puede hacer esta API con la fila (D-66):
            sin emparejar admite `DELETE`; emparejado, no. Es nulo desde que el club crea el equipo hasta
            que lo engancha (D-67), y también si la ingesta no pudo extraerlo y degradó a emparejamiento
            por nombre + categoría (§3.7).
          examples: ['3349086']
        isOwn:
          type: boolean
          readOnly: true
          description: |
            **Derivado**, no almacenado (§3.6): equivale a `opponentClubId == null`. Antes era una columna
            `is_own`; al derivarlo, la bandera ya no puede contradecir a los datos.
        clubName:
          type: string
          readOnly: true
          description: Nombre del club al que pertenece el equipo — el propio o el rival.
          examples: ['CD Ejemplo']
        displayName:
          type: string
          readOnly: true
          description: |
            **Derivado en lectura**, no almacenado: `clubName` + `category` + `letter`. Mismo patrón que
            `isCurrent` en `Season`.
          examples: ['CD Ejemplo Infantil A']
        crestUrl:
          type: [string, 'null']
          format: uri
          readOnly: true
          description: '**Derivado**: escudo del club propio o del rival, según corresponda.'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    RegisterTeamRequest:
      type: object
      description: |
        En qué competiciones de esa temporada juega el equipo (D-68, enmienda). **Conjunto completo**: lo que
        no venga en la lista se retira, que es el patrón de D-50.

        **Omitirlo, o `{}`, deja al equipo inscrito sin competición conocida** — el estado de junio, cuando
        el club ya formó el equipo y la federación aún no ha publicado calendario. Lo normal es no llamar
        aquí: la cascada de `/federation-link` (D-67) escribe la competición al enganchar.
      properties:
        competitionIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Competiciones de **esa** temporada. Varias son legítimas: un equipo juega liga y copa (D-12), y
            cada una es una `Competition` distinta. Una competición de otra temporada da **409**.

    CreateTeamRequest:
      type: object
      description: |
        Alta de un equipo **del club** (D-66). No lleva **ningún** dato de federación: el equipo nace sin
        emparejar y se engancha después con `POST /teams/{teamId}/federation-link` (D-67).

        `category`, `letter`, `gender` y `modality` son **identidad**: forman la clave única del equipo
        dentro del club (§3.5) y quedan **congelados** tras el alta — `UpdateTeamRequest` solo admite
        `category` y `letter`, y ni `gender` ni `modality` vuelven a ser escribibles nunca (D-58, patrón de
        identidad inmutable de D-37). Crear no es corregir.

        **`seasonId` no es identidad**, y por eso no entra en la clave única: es la temporada en la que el
        equipo queda **inscrito al nacer** (D-68), y se cambia después con `/registrations`. Es obligatorio
        porque sin él existiría el estado "equipo creado, inscrito en ninguna parte", **invisible en todas
        las pantallas** que filtran por temporada.
      required: [category, gender, modality, seasonId]
      additionalProperties: false
      properties:
        category:
          $ref: '#/components/schemas/TeamCategory'
        letter:
          type: [string, 'null']
          minLength: 1
          description: |
            Letra que distingue equipos de la misma categoría ("A", "B"…). Opcional: un club con un solo
            equipo por categoría no la necesita.
          examples: ['A']
        gender:
          $ref: '#/components/schemas/Gender'
        modality:
          $ref: '#/components/schemas/Modality'
        seasonId:
          type: string
          format: uuid
          description: |
            Temporada en la que el equipo nace **inscrito** (D-68). UUID **interno**, no el
            `federationSeasonId`. **404** si no existe.

    FederationLinkPreviewRequest:
      type: object
      description: |
        La URL del calendario del grupo, copiada de la web de la federación. El servidor extrae de ella
        los cuatro parámetros (`temporada`, `tipojuego`, `competicion`, `grupo`) y comprueba que el *host*
        corresponde a la federación del club.
      required: [federationCalendarUrl]
      additionalProperties: false
      properties:
        federationCalendarUrl:
          type: string
          format: uri
          examples:
            - 'https://www.rffm.es/competicion/calendario?temporada=21&tipojuego=1&competicion=24037548&grupo=24037549'

    FederationLinkPreviewResponse:
      type: object
      description: |
        Lo que hay en la coordenada, **sin persistir nada**. Es un dato de pantalla para que un humano
        reconozca su club en `competition.teams[]` antes de confirmar.
      required: [season, competition, identityMatches]
      properties:
        season:
          $ref: '#/components/schemas/PreviewSeason'
        competition:
          $ref: '#/components/schemas/CompetitionPreviewResponse'
        identityMatches:
          type: boolean
          description: |
            `true` si el `gender` y la `modality` que propone la competición coinciden con los que el
            equipo tiene congelados desde su alta (D-66). En `false`, confirmar devolverá **409**: se
            muestra antes para que el administrador enganche otro equipo en vez de chocar.

    PreviewSeason:
      type: object
      description: |
        Temporada leída de `seasons[]`, que va **incrustado en la propia página del calendario** — la RFFM
        no tiene endpoint de temporadas (§F.7 del anexo RFFM). Sin esto, la etiqueta no sería deducible
        del código.
      required: [federationSeasonId, label, exists]
      properties:
        federationSeasonId:
          type: string
          description: 'El `temporada=…` de la URL.'
          examples: ['21']
        label:
          type: string
          description: Etiqueta legible, leída de la página. **No** es deducible del código.
          examples: ['2024/25']
        exists:
          type: boolean
          description: |
            `false` ⇒ al confirmar se **creará** la temporada en cascada. El administrador la ve antes,
            que es lo que hace aceptable que una URL pegada dé de alta una `Season`.

    FederationLinkRequest:
      type: object
      description: |
        Confirmación del enganche. La URL vuelve a enviarse —el `preview` no persistió nada— junto con el
        equipo del grupo que el administrador ha reconocido como suyo.
      required: [federationCalendarUrl, ownTeamFederationId, gender]
      additionalProperties: false
      properties:
        federationCalendarUrl:
          type: string
          format: uri
        ownTeamFederationId:
          type: string
          minLength: 1
          description: |
            `federationTeamId` del equipo propio dentro de este grupo, tomado de
            `competition.teams[]` del `preview`. **Obligatorio** (D-67): en D-22 era opcional porque
            omitirlo tenía camino de vuelta —todo nacía rival y se reclamaba con `/ownership`—, pero con
            D-66 ese camino ya no repara sino que **fusiona** (§9.5, sin diseñar). Exigirlo aquí hace que
            el caso no llegue a existir.
          examples: ['3349086']
        gender:
          allOf:
            - $ref: '#/components/schemas/Gender'
          description: |
            Confirmación del género **propuesto** por el `preview` (D-58): sale de buscar `FEMENINO` en el
            nombre de la competición, así que el administrador puede —y a veces debe— cambiarlo. Se
            almacena en la `Competition`; el equipo ya lo tiene congelado desde su alta y **no** se pisa.
        seasonLabel:
          type: string
          description: |
            Etiqueta de la temporada, solo si el `preview` devolvió `season.exists = false` y hay que
            crearla. Se envía la que propuso el `preview` salvo corrección.
          examples: ['2024/25']

    IngestJobResponse:
      type: object
      description: Trabajo de primera ingesta encolado (D-67). El enganche ya está escrito.
      required: [jobId, status, teamId, competitionId, seasonId]
      properties:
        jobId:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          enum: [encolado, en_curso, completado, fallido]
          readOnly: true
        teamId:
          type: string
          format: uuid
          readOnly: true
        competitionId:
          type: string
          format: uuid
          readOnly: true
          description: Competición creada o **reutilizada** si ya existía (`alreadyRegistered`).
        seasonId:
          type: string
          format: uuid
          readOnly: true
          description: Temporada existente o creada en cascada.


    UpdateTeamRequest:
      type: object
      description: |
        Actualización parcial. **No incluye `opponentClubId`**: un equipo no cambia de club, y uno propio
        no se convierte en rival ni al revés — para eso está `/ownership`.

        **Tampoco incluye `modality` ni `gender`**: son identidad del equipo, parte de su clave única
        (§3.5), y se fijan **una sola vez** — al crearlo el club (`CreateTeamRequest`, D-66) o al crearlo
        la ingesta desde la competición (D-07, D-58). Crear no es corregir: el patrón es el de D-37. Un
        equipo de fútbol-sala no *pasa a ser* uno de fútbol-11, es otro equipo.
      additionalProperties: false
      minProperties: 1
      properties:
        category:
          $ref: '#/components/schemas/TeamCategory'
        letter:
          type: [string, 'null']
          minLength: 1

    # ─────────────────────────── Round (§5.2) ───────────────────────────
    RoundResponse:
      type: object
      description: |
        Jornada de una competición. **Solo lectura**: no hay `CreateRoundRequest` ni `UpdateRoundRequest`
        porque `Round` es salida de la ingesta y no tiene campos corregibles a mano (§5.1, D-21).
      required: [id, competitionId, number, startDate, endDate, isCurrent, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        competitionId:
          type: string
          format: uuid
          readOnly: true
          description: |
            Competición a la que pertenece. **La temporada se alcanza por aquí**, no por un `seasonId`
            propio: `Round` no lo lleva (D-28).
        number:
          type: integer
          minimum: 1
          readOnly: true
          description: |
            Número de jornada dentro de la competición, tal y como lo publica la federación. Único por
            competición (§3.5). **No es el identificador**: para eso está `id`.
          examples: [5]
        startDate:
          type: string
          format: date
          readOnly: true
          examples: ['2024-10-05']
        endDate:
          type: string
          format: date
          readOnly: true
          description: |
            Una jornada abarca **varios días** (los partidos de una misma jornada se reparten entre sábado
            y domingo, y a veces se aplazan), de ahí el rango en vez de una fecha única.
          examples: ['2024-10-06']
        isCurrent:
          type: boolean
          readOnly: true
          description: |
            **Derivado en lectura, no almacenado**: es la jornada de **esta competición** con el `endDate`
            más próximo que aún es ≥ hoy. Mismo criterio que `Season.isCurrent` (§3.2), aplicado dentro de
            la competición → **como mucho una** por competición.

            **Puede no haber ninguna**: si la competición ya terminó, todas las jornadas quedan con
            `false`. El cliente debe contemplar ese caso y caer en la última jornada.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # ──────────────────── Proyección de equipo (§5.2, D-32) ────────────────────
    TeamRef:
      type: object
      description: |
        Equipo **recortado a lo que cabe en una fila** — de resultado o de clasificación. **No es un
        recurso: es una proyección de lectura compartida** (D-32). No tiene endpoint ni escritura; `teamId`
        es la puerta al recurso completo (`TeamResponse`) si el cliente necesita el resto.

        **Deliberadamente no lleva `category`, `gender` ni `modality`**: dentro de una competición son
        constantes (§3.2), así que repetirlas en cada fila no distingue una de otra.

        Se extrajo al aparecer el **segundo** consumidor (`StandingResponse`), no por anticipado.
      required: [teamId, displayName, shortDisplayName, isOwn]
      properties:
        teamId:
          type: string
          format: uuid
          readOnly: true
        displayName:
          type: string
          readOnly: true
          description: |
            **Derivado**, igual que en `TeamResponse`: nombre del club + `category` + `letter`. Es el
            rótulo que distingue cuando el listado **mezcla competiciones** — el calendario de un equipo
            puede abarcar liga y copa (D-12).
          examples: ['CD Ejemplo Juvenil A']
        shortDisplayName:
          type: string
          readOnly: true
          description: |
            **Derivado**: nombre **corto** del club + `letter`, **sin categoría**. Es el que pinta la fila
            de una jornada o de una clasificación, donde todos los equipos son de la misma categoría y
            rotularla sería ruido.
          examples: ['CD Ejemplo A']
        crestUrl:
          type: [string, 'null']
          format: uri
          readOnly: true
          description: '**Derivado**: escudo del club propio o del rival, según corresponda.'
        isOwn:
          type: boolean
          readOnly: true
          description: |
            **Derivado** (`opponentClubId == null`), como en `TeamResponse` (§3.6). Es lo que permite a la
            app resaltar la fila del equipo propio dentro de una clasificación o de una jornada.

    # ─────────────────────────── Match (§5.2) ───────────────────────────
    MatchTeam:
      type: object
      description: |
        Uno de los dos lados de un partido: `TeamRef` **más el marcador de ese lado**.
      allOf:
        - $ref: '#/components/schemas/TeamRef'
        - type: object
          properties:
            score:
              type: [integer, 'null']
              minimum: 0
              readOnly: true
              description: |
                Goles de **este** lado. **Nulo hasta que el partido se juega** — en la fuente llega como
                cadena vacía, no como nulo (Anexo de la Federación §F.5).

                Vive aquí, y no como `homeScore`/`awayScore` paralelos, para atar cada número a su equipo
                en la propia estructura: el cliente pinta `score` junto a `crestUrl` sin poder cruzar de
                lado (D-32).

    MatchResponse:
      type: object
      description: |
        Partido de una competición. **Solo lectura**: no hay DTO de escritura ninguno (§5.1). El detalle que
        aporta el club son los **hijos** del partido —`Goal`, `Card`, `Appearance`—, no sus campos.
      required:
        [id, competitionId, roundId, roundNumber, matchDate, isKickoffConfirmed, status, home, away,
         createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        competitionId:
          type: string
          format: uuid
          readOnly: true
          description: 'La temporada se alcanza por aquí, no por un `seasonId` propio (D-28).'
        roundId:
          type: string
          format: uuid
          readOnly: true
        roundNumber:
          type: integer
          minimum: 1
          readOnly: true
          description: |
            Número de jornada, **repetido aquí** para que el calendario de un equipo —que atraviesa muchas
            jornadas— se pinte sin resolver cada `roundId` por separado. Mismo criterio pro-lectura que
            `MatchTeam` (D-32).
          examples: [22]
        matchDate:
          type: string
          format: date
          readOnly: true
          description: |
            Fecha del partido. **Siempre presente, pero provisional hasta la semana anterior** (D-30): al
            publicarse el calendario, la federación reparte los partidos con una fecha por defecto —el
            **sábado**— y solo el domingo previo fija la definitiva, que puede pasar a domingo.
          examples: ['2025-05-18']
        kickoffTime:
          type: [string, 'null']
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          readOnly: true
          description: |
            Hora de comienzo, **nula mientras la federación no la haya fijado** (D-30). Se separa de
            `matchDate` justamente porque llega después: un `date-time` único obligaría a inventar un
            `00:00` indistinguible de la medianoche real.
          examples: ['12:00']
        isKickoffConfirmed:
          type: boolean
          readOnly: true
          description: |
            **Derivado en lectura, no almacenado**: equivale a `kickoffTime != null` (D-30). Permite pintar
            `18 MAY · VS` para un partido lejano y `18 MAY · 12:00` para el de esta semana.

            **Confirmado no es inmutable.** Significa "la federación ya publicó franja", no "esto no se
            mueve": una suspensión por causa mayor lo desplaza o lo devuelve a provisional. Fecha y hora son
            campos **volátiles** (§3.7) y la sincronización los pisa siempre — el cliente no debe cachearlos
            como definitivos. Por eso el campo se llama `Confirmed` y no `Final`.
        status:
          allOf:
            - $ref: '#/components/schemas/MatchStatus'
          readOnly: true
        venue:
          type: [string, 'null']
          readOnly: true
          description: |
            Campo donde se juega, **texto libre**. La fuente trae también un `codigo_campo` (Anexo de la
            Federación §F.5); si el campo llegara a merecer entidad propia, ahí está la clave. Fuera de
            alcance hoy.
          examples: ['CANAL ISABEL II']
        federationMatchId:
          type: [string, 'null']
          readOnly: true
          description: |
            Identificador del **acta** en la API de la federación (`codacta` en la RFFM, §3.7). Clave de
            emparejamiento de la ingesta, **no de unión**: nunca PK, nunca FK, nunca un `JOIN` interno.

            **Anulable y no exigible** (D-31): es un campo de la RFFM, no del contrato genérico de
            federación. Cuando falta, la ingesta empareja por (jornada, local, visitante), que es índice
            único (§3.5). Nunca por la fecha, que se mueve cada semana.
          examples: ['5348330']
        home:
          allOf:
            - $ref: '#/components/schemas/MatchTeam'
          readOnly: true
        away:
          allOf:
            - $ref: '#/components/schemas/MatchTeam'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # Sin DTOs de escritura (D-21). Plantilla de recurso ingerido de `Round` + colección grande:
    # ámbito obligatorio, paginación y proyecciones embebidas.

    # ────────────────────────── StandingRow (§5.2) ──────────────────────────
    FormEntry:
      type: object
      description: |
        Un resultado dentro de la racha, **visto desde el equipo de la fila**. Lleva el número de jornada
        para que la app pueda rotular cada distintivo, que es lo que hace el mockup.
      required: [roundNumber, outcome]
      properties:
        roundNumber:
          type: integer
          minimum: 1
          readOnly: true
          examples: [22]
        outcome:
          allOf:
            - $ref: '#/components/schemas/MatchOutcome'
          readOnly: true

    StandingResponse:
      type: object
      description: |
        Una fila de la clasificación de una jornada. **Solo lectura** y sin acceso por identificador
        (D-34): `StandingRow` no es un agregado sino un **modelo de lectura**, y su unidad de consumo es la
        tabla entera de la jornada.

        **Agnóstica a la fuente** (D-15): la misma fila vale ingerida de la federación o calculada desde
        `Match`, y **no lleva marca de procedencia** — esa es capacidad de la federación y se expone una
        sola vez por tenant, en `ClubResponse.federationProvidesRoundStandings` (D-29, D-55).
      required:
        [id, competitionId, roundId, team, position, played, won, drawn, lost, goalsFor, goalsAgainst,
         points, form, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: |
            Identificador de la fila. **No tiene URL propia** (D-34): existe porque toda tabla tiene PK
            (§3.5), no porque haya un endpoint que la sirva. Útil como clave de lista en el cliente.
        competitionId:
          type: string
          format: uuid
          readOnly: true
        roundId:
          type: string
          format: uuid
          readOnly: true
          description: |
            Jornada de la que esto es *snapshot*. La temporada se alcanza por aquí vía `Competition`, no
            por un `seasonId` propio (D-28).
        team:
          allOf:
            - $ref: '#/components/schemas/TeamRef'
          readOnly: true
          description: |
            Proyección del equipo, la misma que usa `MatchResponse` (D-32). Evita las ~20 llamadas que
            costaría resolver la tabla equipo a equipo, y su `isOwn` es lo que permite resaltar la fila
            propia.
        position:
          type: integer
          minimum: 1
          readOnly: true
          description: Posición en esta jornada. Es el orden fijo en el que se devuelve la lista.
          examples: [2]
        previousPosition:
          type: [integer, 'null']
          minimum: 1
          readOnly: true
          description: |
            Posición en la jornada anterior — la columna PREV del mockup. **Se almacena, no se deriva**
            (D-33): la fila entera ya es un *snapshot* derivado, y derivar esta columna fallaría justo en
            el caso real de un club que da de alta la competición **a mitad de temporada**, donde no existe
            la jornada anterior de la que leerla.

            **Nula** en la primera jornada de la competición y en la primera jornada ingerida de un alta
            tardía. El cliente pinta "–"; no es un error.
          examples: [1]
        played:
          type: integer
          minimum: 0
          readOnly: true
          description: Partidos jugados (J).
        won:
          type: integer
          minimum: 0
          readOnly: true
          description: Ganados (G).
        drawn:
          type: integer
          minimum: 0
          readOnly: true
          description: Empatados (E).
        lost:
          type: integer
          minimum: 0
          readOnly: true
          description: Perdidos (P).
        goalsFor:
          type: integer
          minimum: 0
          readOnly: true
          description: Goles a favor (GF).
        goalsAgainst:
          type: integer
          minimum: 0
          readOnly: true
          description: Goles en contra (GC).
        points:
          type: integer
          minimum: 0
          readOnly: true
          description: |
            Puntos (PTS). **No se recalcula en el BFF a partir de G/E/P**: si la federación publica la
            clasificación, el dato bueno es el suyo — los sistemas de puntuación y las sanciones con
            descuento de puntos no siempre se deducen de la tabla.
        form:
          type: array
          readOnly: true
          maxItems: 5
          description: |
            **Racha**: los últimos **5** resultados del equipo hasta esta jornada, el más reciente primero.
            La columna RACHA del mockup.

            **Derivada desde `Match`**, no de diferenciar *snapshots* consecutivos (D-34): esa segunda vía
            dependería de que la cadena de clasificaciones esté completa, y no lo está en un alta a mitad
            de temporada (D-33). Se resuelve en el mismo puerto de lectura que la tabla (§4.5).

            **Menos de 5 elementos** al principio de la competición o si el equipo ha jugado menos. El
            cliente que pinte tres distintivos recorta la lista: no hay parámetro para elegir N.
          items:
            $ref: '#/components/schemas/FormEntry'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # Sin DTOs de escritura (D-21). El fallback es CÁLCULO desde `Match`, no un formulario: así la tabla
    # conserva un único escritor (D-15).

    # ─────────────────────────── Player (§5.2) ───────────────────────────
    CreatePlayerRequest:
      type: object
      description: |
        Alta de un jugador en la plantilla de un equipo **propio** para una temporada. Es el primer DTO de
        alta de **dominio manual** del contrato: los tres anteriores (`Season`, `Competition`) existían por
        ser *entrada* de la ingesta (D-22); este existe porque aquí no hay ingesta.

        **`teamId` y `seasonId` van en el alta y solo en el alta** (D-37): identifican la fila y no
        reaparecen en `UpdatePlayerRequest`.
      additionalProperties: false
      required: [teamId, seasonId, fullName, shirtNumber, position]
      properties:
        teamId:
          type: string
          format: uuid
          description: |
            Equipo **propio** (`isOwn == true`). Un equipo rival no tiene plantilla: no hay de dónde
            sacarla, y el modelo solo cubre el detalle manual del club (§3.7) → **422** si no lo es.
        seasonId:
          type: string
          format: uuid
          description: |
            Temporada del registro. **No se hereda del equipo**: `Team` no tiene temporada (§3.2), es la
            misma entidad año tras año, así que la plantilla necesita decir de qué año habla (D-05).
        fullName:
          type: string
          minLength: 1
          maxLength: 120
          examples: ['Marcos Díaz']
        shirtNumber:
          type: integer
          minimum: 1
          maximum: 99
          description: |
            Dorsal. **Único dentro del mismo equipo y temporada** (§3.5) → **409** si está ocupado. Es
            invariante de dominio además de restricción de tabla: el VO `ShirtNumber` (§4.1) la garantiza
            también fuera de este contrato.
          examples: [1]
        position:
          $ref: '#/components/schemas/PlayerPosition'

    UpdatePlayerRequest:
      type: object
      description: |
        Actualización parcial. **No incluye `teamId` ni `seasonId`** —son identidad, no atributos
        (D-37)— **ni la foto**, que se deriva de la clave de Storage y no se teclea (D-35).

        Lo que queda es exactamente lo corregible de una plantilla tecleada a mano: una errata en el
        nombre, un cambio de dorsal a mitad de temporada, una demarcación mal elegida.
      additionalProperties: false
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        shirtNumber:
          type: integer
          minimum: 1
          maximum: 99
        position:
          $ref: '#/components/schemas/PlayerPosition'

    PlayerResponse:
      type: object
      description: |
        Un jugador **en un equipo y una temporada** (D-05). Es la ficha de la plantilla, no un dosier
        estadístico: goles, tarjetas, convocatorias y disponibilidad **no viajan aquí**. Salen de `Goal`,
        `Card`, `Appearance` y `Absence`, que son agregaciones sobre entidades que este contrato todavía
        no cubre, y llegarán como **modelo de lectura** propio —igual que `StandingResponse` no es un campo
        gordo de `TeamResponse` (D-34)—, no engordando este esquema.

        **Deliberadamente no embebe el equipo** (`TeamRef`, D-32): dentro de una plantilla el equipo es
        **constante** —lo acaba de pedir el cliente como ámbito—, así que repetirlo veinticinco veces no
        distingue una fila de otra. Es el mismo criterio por el que `TeamRef` no lleva `category`.
      required: [id, teamId, seasonId, fullName, shirtNumber, position, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        teamId:
          type: string
          format: uuid
          readOnly: true
          description: |
            **Inmutable** tras el alta (D-37). Siempre un equipo propio: la plantilla solo existe para
            ellos (§3.7).
        seasonId:
          type: string
          format: uuid
          readOnly: true
          description: |
            **Inmutable** tras el alta (D-37). Es el **único** sitio del subárbol, junto a `Competition`,
            donde la temporada es columna propia y no se alcanza por FK: aquí es **identidad** (D-28).
        fullName:
          type: string
          examples: ['Marcos Díaz']
        shirtNumber:
          type: integer
          minimum: 1
          maximum: 99
          examples: [1]
        position:
          $ref: '#/components/schemas/PlayerPosition'
        photoUrl:
          type: [string, 'null']
          format: uri
          readOnly: true
          description: |
            **Derivado, no almacenado** (D-35): en BD vive `photo_key`, la clave del objeto en Storage —
            mismo criterio que el escudo del club (D-19), y aquí además obligado, porque la foto de un menor
            no puede quedar colgada de una URL pública ajena. El servidor devuelve una **URL firmada y de
            vida corta**; el cliente la usa, no la guarda.

            **Nulo** mientras no haya foto: se sube aparte, con `PUT /players/{playerId}/photo`, y nunca en
            el alta ni en el `PATCH`. La ficha sin foto es un estado normal —el mockup pinta las
            iniciales—, no un alta a medias.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # Sin `deletedAt` en PlayerResponse: el borrado lógico (D-36) es asunto de auditoría, no del cliente.

    # ─────────────────────────── Absence (§5.2) ───────────────────────────
    CreateAbsenceRequest:
      type: object
      description: |
        Alta de un periodo de indisponibilidad. **Solo `startDate` es obligatoria** de las tres fechas: una
        lesión se apunta el día que ocurre, cuando todavía no se sabe cuándo vuelve.

        **Admite crear la ausencia ya cerrada** (`actualReturnDate` en el alta), que es como se registra
        una baja pasada.
      additionalProperties: false
      required: [playerId, type, startDate]
      properties:
        playerId:
          type: string
          format: uuid
          description: |
            Jugador que causa baja. **No reaparece en el `PATCH`**: una ausencia registrada en el jugador
            equivocado se borra y se vuelve a crear, no se traslada (D-40).
        type:
          $ref: '#/components/schemas/AbsenceType'
        startDate:
          type: string
          format: date
          description: Primer día de indisponibilidad — el `INIC` del mockup.
          examples: ['2024-12-05']
        expectedReturnDate:
          type: [string, 'null']
          format: date
          description: |
            Alta **estimada** (`ALTA EST.` en el mockup). **Nula** mientras no haya pronóstico, que es el
            estado normal los primeros días de una lesión. Es una previsión, no un compromiso: se corrige
            por `PATCH` tantas veces como haga falta.
          examples: ['2025-01-06']
        actualReturnDate:
          type: [string, 'null']
          format: date
          description: |
            Alta **real**. Ponerla es lo que da la ausencia por terminada (D-38): no hay campo `active` ni
            sub-recurso de cierre.

    UpdateAbsenceRequest:
      type: object
      description: |
        Actualización parcial, y **también el modo de dar de alta al jugador**: basta con `actualReturnDate`
        (D-40).

        **`actualReturnDate: null` explícito reabre** la ausencia, según la convención de `PATCH` del
        contrato (§5.2) — el caso de haber cerrado una baja por error.

        **No incluye `playerId`**: la ausencia es de quien es.
      additionalProperties: false
      minProperties: 1
      properties:
        type:
          $ref: '#/components/schemas/AbsenceType'
        startDate:
          type: string
          format: date
        expectedReturnDate:
          type: [string, 'null']
          format: date
        actualReturnDate:
          type: [string, 'null']
          format: date

    AbsenceResponse:
      type: object
      description: |
        Un periodo de indisponibilidad de un jugador. Es lo que pinta el distintivo DISPONIBLE /
        NO DISPONIBLE de la ficha de plantilla, con sus dos fechas.

        **No embebe el jugador**: dentro de un historial de bajas es constante, y dentro de una plantilla el
        cliente ya tiene la lista de jugadores — `playerId` basta para cruzarlas. Mismo criterio por el que
        `PlayerResponse` no embebe el equipo (D-32).
      required: [id, playerId, type, startDate, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        playerId:
          type: string
          format: uuid
          readOnly: true
          description: |
            **La temporada y el equipo se alcanzan por aquí**, no por columnas propias: `Absence` no las
            lleva, y es deliberado (D-28). El jugador ya es identidad de equipo y temporada (D-05), así que
            copiarlas sería exactamente la denormalización que esa regla prohíbe.
        type:
          $ref: '#/components/schemas/AbsenceType'
        startDate:
          type: string
          format: date
          examples: ['2024-12-05']
        expectedReturnDate:
          type: [string, 'null']
          format: date
          examples: ['2025-01-06']
        actualReturnDate:
          type: [string, 'null']
          format: date
          description: 'Nula mientras la ausencia siga en curso.'
        isActive:
          type: boolean
          readOnly: true
          description: |
            **Derivado en lectura, no almacenado** (D-38): la ausencia está en curso si **no tiene alta
            real** y **su fecha de inicio ya llegó**. El borrador del modelo llevaba una columna `active`;
            al derivarla, la bandera ya no puede contradecir a las fechas — mismo patrón que `isOwn`
            (D-03), `isCurrent` y `isKickoffConfirmed` (D-30).

            Depende del **día en que se pregunta**, como `Season.isCurrent`: una baja apuntada por
            adelantado responde `false` hoy y `true` cuando llegue su `startDate`, sin que nadie la toque.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # `Player.isAvailable` no existe: sería el mismo dato derivado dos veces y con dos consultas. La
    # plantilla pide `GET /absences?teamId=&seasonId=&active=true` y cruza por `playerId` (D-38).

    # ───────────────────────── Appearance (§5.2) ─────────────────────────
    CreateAppearanceRequest:
      type: object
      description: |
        Alta de **una** convocatoria: un jugador, un partido, un estado. La lista entera se registra
        repitiendo la llamada (D-44).

        `playerId` y `matchId` son la **identidad** de la fila y no reaparecen en el `PATCH` (D-37).
      additionalProperties: false
      required: [playerId, matchId, status]
      properties:
        playerId:
          type: string
          format: uuid
          description: |
            Jugador convocado. **Su equipo tiene que disputar el partido** —como local o como visitante— o
            la operación devuelve 422. Es la única validación cruzada del alta, y hace falta: sin ella se
            podría apuntar a un juvenil en el partido del cadete y la estadística de los dos equipos
            quedaría contaminada.
        matchId:
          type: string
          format: uuid
          description: |
            Partido. **La temporada y la competición se alcanzan por aquí**, no por columnas propias
            (D-28), igual que el equipo se alcanza por `playerId` (D-05).
        status:
          $ref: '#/components/schemas/AppearanceStatus'
        minutes:
          type: [integer, 'null']
          minimum: 0
          maximum: 120
          description: |
            Minutos jugados. **Opcional siempre y solo válido con `status = jugado`** (D-14, D-42): un club
            pequeño no sostiene la disciplina de cronometrar cada cambio, así que exigirlo dejaría el campo
            vacío o inventado. `null` con `jugado` significa "jugó, no sé cuánto" — que es distinto de cero.

            El tope de 120 cubre la prórroga; no se acota por modalidad porque la duración del partido
            depende de la categoría (§3.6) y meter esa tabla aquí sería validar reglamento en el borde.
          examples: [67]

    UpdateAppearanceRequest:
      type: object
      description: |
        Corrección parcial. **No incluye `playerId` ni `matchId`**: son identidad (§3.5), y cambiarlos
        chocaría además con la unicidad *(jugador, partido)*.

        **Bajar de `jugado` a otro estado exige mandar `minutes: null` en la misma llamada** (D-42), o la
        operación devuelve 422. El `null` explícito borra el valor, según la convención de `PATCH` (§5.2).
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          $ref: '#/components/schemas/AppearanceStatus'
        minutes:
          type: [integer, 'null']
          minimum: 0
          maximum: 120

    AppearanceResponse:
      type: object
      description: |
        Qué hizo un jugador en un partido. Es la unidad de la que salen los cuatro recuentos de la pantalla
        de estadísticas y el promedio de minutos.

        **No embebe ni el jugador ni el partido**: dentro de una convocatoria el partido es constante y
        dentro de un historial lo es el jugador — en los dos casos el cliente ya tiene la otra mitad y
        cruza por id. Es el criterio de D-32 (*embeber lo que varía dentro de la página*) aplicado a una
        entidad que se lee por sus dos lados, así que embeber cualquiera de los dos sobraría en la mitad de
        las pantallas.
      required: [id, playerId, matchId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        playerId:
          type: string
          format: uuid
          readOnly: true
          description: 'Equipo y temporada se alcanzan por aquí (D-05, D-28).'
        matchId:
          type: string
          format: uuid
          readOnly: true
          description: 'Jornada y competición se alcanzan por aquí (D-28).'
        status:
          $ref: '#/components/schemas/AppearanceStatus'
        minutes:
          type: [integer, 'null']
          description: |
            **Nulo también cuando el jugador sí jugó**: significa "no se apuntó", no "cero minutos"
            (D-14). El cliente que calcule el promedio debe descartar los nulos, no tratarlos como ceros.
          examples: [67]
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # Sin `isAvailable` ni nada derivado de `Absence`: son registros independientes (D-41). Los recuentos
    # por jugador son agregación y van a modelo de lectura (§3.4, §4.5).

    # ─────────────────────────────── Card (§5.2) ───────────────────────────────
    CreateCardRequest:
      type: object
      description: |
        Alta de **una sanción**. La expulsión por doble amarilla es **esta misma llamada** con
        `type = roja` e `isSecondYellow = true` (D-45), no dos amarillas y una roja.

        `playerId` y `matchId` son la **identidad** de la fila y no reaparecen en el `PATCH` (D-37).
      additionalProperties: false
      required: [playerId, matchId, type]
      properties:
        playerId:
          type: string
          format: uuid
          description: |
            Jugador sancionado. **Su equipo tiene que disputar el partido** o 422. **No se comprueba que
            tenga convocatoria** (D-46).
        matchId:
          type: string
          format: uuid
          description: 'Partido. La competición —y sus tramos de sanción— se alcanzan por aquí (D-10, D-28).'
        type:
          $ref: '#/components/schemas/CardType'
        isSecondYellow:
          type: boolean
          default: false
          description: |
            Expulsión **por doble amarilla**. **Exige `type = roja`** → 422 (D-45). Distingue las dos
            expulsiones posibles, que no cuestan lo mismo.

            Las dos amarillas que la causaron **no se registran aparte y no acumulan** (D-10); si ya había
            una amarilla suelta en ese partido, hay que borrarla primero → 422.
        minute:
          type: [integer, 'null']
          minimum: 0
          maximum: 120
          description: 'Opcional (D-14). Nulo es "no se apuntó"; la tarjeta cuenta igual.'
          examples: [67]

    UpdateCardRequest:
      type: object
      description: |
        Corrección parcial. **Sin `playerId` ni `matchId`**: son identidad (D-37).

        **`type` e `isSecondYellow` se mandan juntos cuando cambian**, o 422 (D-45).
      additionalProperties: false
      minProperties: 1
      properties:
        type:
          $ref: '#/components/schemas/CardType'
        isSecondYellow:
          type: boolean
        minute:
          type: [integer, 'null']
          minimum: 0
          maximum: 120

    CardResponse:
      type: object
      description: |
        Una tarjeta = una sanción (D-45). **No embebe jugador ni partido** (D-32).

        No lleva las amarillas pendientes ni el ciclo de acumulación: son agregación (§3.4, D-10).
      required: [id, playerId, matchId, type, isSecondYellow, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        playerId:
          type: string
          format: uuid
          readOnly: true
          description: 'Equipo y temporada se alcanzan por aquí (D-05, D-28).'
        matchId:
          type: string
          format: uuid
          readOnly: true
          description: 'Jornada, competición y tramos de sanción se alcanzan por aquí (D-28).'
        type:
          $ref: '#/components/schemas/CardType'
        isSecondYellow:
          type: boolean
          description: |
            Solo `true` con `type = roja` (D-45). Con `amarilla` es siempre `false`, y ese `false` no
            significa "primera amarilla": significa que el campo no aplica.
        minute:
          type: [integer, 'null']
          description: 'Nulo es "no se apuntó", no "minuto cero" (D-14).'
          examples: [67]
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # ────────────────────────── LeagueScorer (§5.2) ──────────────────────────
    LeagueScorerResponse:
      type: object
      description: |
        Una fila del ranking de goleadores de la competición. **Solo lectura** y **sin acceso por
        identificador** (D-34), como `StandingResponse`: es un modelo de lectura y su unidad de consumo es
        la tabla.

        **No está ligada a `Player`** (D-09): el ranking incluye jugadores rivales, de los que no hay
        plantilla. `fullName` y `teamLabel` son **texto del proveedor**, no claves — no se pueden cruzar
        con `Player` ni con `Team`, y no se intenta.

        **Es el único DTO del contrato con un solo DTO y sin ningún hermano de escritura**, ni siquiera de
        corrección: `Round` llegó a tener uno solo teniendo `PATCH` descartado por no haber nada que
        corregir; aquí, además, el dato ni siquiera es del club.
      required: [id, competitionId, fullName, teamLabel, goals, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: |
            Identificador de la fila. **No tiene URL propia** (D-34): existe porque toda tabla tiene PK
            (§3.5). Útil como clave de lista en el cliente — y aquí más que en ningún sitio, porque
            `fullName` no es identificador: dos jugadores pueden llamarse igual.
        competitionId:
          type: string
          format: uuid
          readOnly: true
          description: |
            Competición del ranking. La temporada se alcanza por aquí, no por un `seasonId` propio (D-28).
        fullName:
          type: string
          readOnly: true
          description: |
            Nombre del goleador **tal y como lo publica el proveedor**. Texto libre, sin normalizar y sin
            garantía de unicidad ni de estabilidad entre sincronizaciones.
          examples: ['Juan Pérez García']
        teamLabel:
          type: string
          readOnly: true
          description: |
            Equipo del goleador, **como etiqueta de texto del proveedor**, no como `TeamRef` (D-32). Es la
            diferencia visible con `StandingResponse`, que sí embebe el equipo: allí las filas son equipos
            **nuestros y rivales ya ingeridos**, con `id` y escudo; aquí puede aparecer un equipo de otra
            categoría o con el nombre escrito de otra forma, y forzar el emparejamiento produciría filas
            mal atribuidas. Sin escudo, por tanto.
          examples: ['CD Ejemplo B']
        goals:
          type: integer
          minimum: 0
          readOnly: true
          description: Goles acumulados en la competición, según el proveedor.
          examples: [14]
        rank:
          type: [integer, 'null']
          minimum: 1
          readOnly: true
          description: |
            Posición en el ranking **según el proveedor**, y **anulable** — que no era una precaución
            teórica: **la RFFM no la publica** (Anexo de la Federación §F.13). Devuelve la lista ya ordenada
            por goles descendente y sin numerar, así que aquí llega **siempre nula** y el orden de la
            respuesta es la única señal.

            Se respeta el valor del proveedor cuando lo hay, en vez de recalcularlo, porque los **criterios
            de desempate** son suyos y no los conocemos. Cuando no lo hay, los empates —dos goleadores con
            45 goles en la muestra— quedan sin desempate declarado.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # ─────────────────────────────── Goal (§5.2) ───────────────────────────────
    CreateGoalRequest:
      type: object
      description: |
        Alta de un gol. **Solo tres campos obligatorios** —partido, equipo que marca y si hubo asistencia—
        y todo el desglose opcional (D-04): un gol apuntado en caliente, sin detalle, es una fila válida.

        **`concedingTeamId` no está aquí** (D-54): lo deriva el servidor del `Match`. Es la mitad de la
        denormalización de D-04 que el cliente no puede escribir y, por tanto, no puede contradecir.

        `matchId` y `scoringTeamId` son la **identidad** del gol y no reaparecen en el `PATCH` (D-37).
      additionalProperties: false
      required: [matchId, scoringTeamId]
      properties:
        matchId:
          type: string
          format: uuid
          description: |
            Partido. **Al menos uno de sus dos equipos tiene que ser propio** o la operación devuelve 422:
            el detalle manual no existe para partidos entre rivales (§3.7). La temporada y la competición
            se alcanzan por aquí (D-28).
        scoringTeamId:
          type: string
          format: uuid
          description: |
            Equipo que **marca**, y tiene que ser uno de los dos del partido → 422 si no. En un gol en
            propia puerta es el equipo **beneficiado**, no el del autor (D-52).
        scorerPlayerId:
          type: [string, 'null']
          format: uuid
          description: |
            Jugador que marca. **Anulable, y lo será siempre en los goles del rival**: no hay plantilla de
            rivales y no la va a haber (D-09).

            **A qué equipo debe pertenecer depende de `playType`** (D-52): al que marca en un gol normal,
            al que **encaja** en un `en_propia_puerta`. Es la única invariante del contrato en la que un
            enumerado decide contra qué se valida una FK.
        assistPlayerId:
          type: [string, 'null']
          format: uuid
          description: |
            Jugador que asiste. Debe pertenecer al **equipo que marca** y no puede coincidir con el
            goleador. **Exige `assisted = true`** (tercera invariante entre campos del contrato, hermana de
            D-42 y D-45) y **no se admite en un gol en propia puerta** (D-52).
        assisted:
          type: boolean
          default: false
          description: |
            Si el gol vino de una asistencia. **No es redundante con `assistPlayerId`**, y esa es la parte
            que no se ve a primera vista: en un gol **encajado** sabemos que hubo asistencia pero no de
            quién, porque el asistente es un jugador rival (D-09). `assisted = true` con
            `assistPlayerId = null` es esa fila, y es la que alimenta el CON ASISTENCIA del bloque de goles
            recibidos del mockup.

            Por eso es un campo declarado y no un derivado de `assistPlayerId != null`.
        minute:
          type: [integer, 'null']
          minimum: 0
          maximum: 120
          description: |
            Minuto del gol. **Opcional**, como el de la tarjeta y por el mismo motivo (D-14). El tope de
            120 cubre la prórroga.
          examples: [67]
        zone:
          $ref: '#/components/schemas/GoalZone'
        side:
          $ref: '#/components/schemas/GoalSide'
        bodyPart:
          $ref: '#/components/schemas/GoalBodyPart'
        playType:
          $ref: '#/components/schemas/GoalPlayType'

    UpdateGoalRequest:
      type: object
      description: |
        Corrección parcial, y **el caso de uso normal de este recurso**: se apunta el gol en caliente con
        lo mínimo y se completa el desglose después.

        **No incluye `matchId` ni `scoringTeamId`** —identidad (D-37)— ni `concedingTeamId`, que además es
        derivado (D-54).

        **`playType` y `scorerPlayerId` viajan juntos cuando el cambio cruza `en_propia_puerta`** (D-52):
        el enumerado decide a qué equipo debe pertenecer el goleador, así que cambiarlo solo dejaría la
        fila inválida → 422.
      additionalProperties: false
      minProperties: 1
      properties:
        scorerPlayerId:
          type: [string, 'null']
          format: uuid
        assistPlayerId:
          type: [string, 'null']
          format: uuid
        assisted:
          type: boolean
        minute:
          type: [integer, 'null']
          minimum: 0
          maximum: 120
        zone:
          $ref: '#/components/schemas/GoalZone'
        side:
          $ref: '#/components/schemas/GoalSide'
        bodyPart:
          $ref: '#/components/schemas/GoalBodyPart'
        playType:
          $ref: '#/components/schemas/GoalPlayType'

    GoalResponse:
      type: object
      description: |
        Un gol con su desglose. **Lleva las dos FKs de equipo** (D-04) aunque solo una se escriba (D-54):
        el cliente que pinta "goles en contra" filtra por `concedingTeamId` sin resolver el partido.

        **No embebe ni el partido ni los jugadores**, por lo mismo que `AppearanceResponse` y
        `CardResponse` (D-32): se lee por varios lados y en cada uno alguno de los padres es constante.

        **La suma de goles de un partido no tiene por qué ser su marcador** (D-53). El resultado es de la
        federación; esto es el detalle manual y parcial de cómo se llegó a él.
      required: [id, matchId, scoringTeamId, concedingTeamId, assisted, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        matchId:
          type: string
          format: uuid
          readOnly: true
          description: 'Jornada, competición y temporada se alcanzan por aquí (D-28).'
        scoringTeamId:
          type: string
          format: uuid
          readOnly: true
          description: 'Equipo que marca → goles **a favor** (D-04).'
        concedingTeamId:
          type: string
          format: uuid
          readOnly: true
          description: |
            Equipo que encaja → goles **en contra** (D-04). **Derivado del partido en la escritura**
            (D-54), pero almacenado y devuelto: es una copia deliberada, no un cálculo en lectura, y existe
            para que el filtro sea directo e indexado.
        scorerPlayerId:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: |
            **Nulo en los goles del rival** (D-09). En un `playType = en_propia_puerta` apunta al autor,
            que es del equipo que **encaja** — y ese gol **no le suma** en el conteo de goleador (D-52).
        assistPlayerId:
          type: [string, 'null']
          format: uuid
          readOnly: true
        assisted:
          type: boolean
          description: |
            `true` con `assistPlayerId` nulo significa **"hubo asistencia, de alguien que no está en
            nuestras plantillas"** — el caso de los goles encajados. No es una incoherencia (D-09).
        minute:
          type: [integer, 'null']
          readOnly: true
          description: 'Nulo significa "no se apuntó", no "minuto cero" (D-14).'
          examples: [67]
        zone:
          $ref: '#/components/schemas/GoalZone'
        side:
          $ref: '#/components/schemas/GoalSide'
        bodyPart:
          $ref: '#/components/schemas/GoalBodyPart'
        playType:
          $ref: '#/components/schemas/GoalPlayType'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # Sin desgloses agregados: son agregación y van a modelo de lectura (§3.4, `GoalBreakdown`). Y sin
    # marca de "cuenta como gol": el conteo excluye `en_propia_puerta` en la consulta (D-52), no con una
    # bandera que pudiera contradecir a `playType`.

    # ─────────────────────── SanctionBracket (§5.2) ───────────────────────
    ReplaceSanctionBracketsRequest:
      type: object
      description: |
        Sustitución del **conjunto entero** de tramos (D-50). No hay DTO de alta ni de actualización por
        fila: la unidad de consistencia es la lista.

        **El cuerpo son los umbrales, no los tramos** (D-51). `[5, 10, 13, 16]` produce
        `0-5, 6-10, 11-13, 14-16`: el servidor deriva `seq` (el orden del array) y `yellowFrom` (el
        `yellowTo` anterior más uno, o 0 en el primero). Un conjunto con huecos, solapes o `seq`
        desordenado **no se puede expresar**, así que tampoco hace falta rechazarlo.
      additionalProperties: false
      required: [thresholds]
      properties:
        thresholds:
          type: array
          description: |
            Umbrales de amarillas, **estrictamente ascendentes**. Cada valor es el número de amarillas al
            que llega una sanción — el `yellowTo` del tramo correspondiente.

            **Lista vacía = sin sanción por acumulación** en esta competición, que es un estado legítimo
            (D-10) y la vía para borrar los tramos.
          items:
            type: integer
            minimum: 1
          examples:
            - [5, 10, 13, 16]

    SanctionBracketResponse:
      type: object
      description: |
        Un tramo de sanción, **ya derivado**. La respuesta devuelve los tramos completos aunque la
        escritura solo reciba umbrales (D-51): así el cliente pinta `0-5, 6-10` sin rehacer la derivación,
        y la asimetría es deliberada — **se escribe lo mínimo que determina el conjunto, se lee lo que la
        pantalla necesita**.

        **No embebe la competición** ni tiene ruta propia por `{id}`: la unidad de consumo es la lista
        entera, igual que en `StandingRow` (D-34).
      required: [id, competitionId, seq, yellowFrom, yellowTo]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: |
            Identificador de la fila. **No direcciona nada** (D-50): existe porque toda tabla tiene PK
            (§3.5) y sirve de clave de lista en el cliente. **No es estable entre escrituras**: un `PUT`
            sustituye el conjunto, así que los tramos resultantes pueden tener ids nuevos aunque los
            umbrales no hayan cambiado.
        competitionId:
          type: string
          format: uuid
          readOnly: true
        seq:
          type: integer
          minimum: 1
          readOnly: true
          description: |
            Orden del tramo dentro de la competición, **derivado de la posición en `thresholds`** (D-51).
            Es el orden fijo en el que se devuelve la lista.
        yellowFrom:
          type: integer
          minimum: 0
          readOnly: true
          description: |
            Primera amarilla del tramo, **derivada**: `0` en el primero, `yellowTo` del anterior más uno en
            el resto. Nunca llega en la escritura, precisamente para que no pueda contradecir al anterior.
          examples: [6]
        yellowTo:
          type: integer
          minimum: 1
          readOnly: true
          description: |
            Amarilla que **dispara la sanción**. Es el umbral que llegó en `thresholds`, y el número contra
            el que se calculan las pendientes: `yellowTo − acumuladas` (§3.4, D-10).
          examples: [10]

    # `SanctionBracketResponse` no lleva `createdAt`/`updatedAt`, y es el único DTO del contrato del que se
    # puede decir. No es olvido: la fila no se actualiza nunca —el `PUT` sustituye el conjunto (D-50)—, así
    # que un `updatedAt` sería siempre igual al `createdAt` y ninguno de los dos respondería la pregunta
    # que se querría hacer, que es cuándo se cambió la *configuración*. Esa vive en `Competition`.

    # `LeagueScorerResponse` no lleva `syncedAt` pese a que la columna existe en §3.2. Sería la **columna
    # constante** que D-28 y D-29 ya rechazaron —el mismo instante repetido en doscientas filas—, y la
    # pregunta que respondería ya la responde `CompetitionResponse.lastSyncedAt`, que es la granularidad
    # correcta. En BD sí se conserva: es la marca con la que el *upsert* detecta y retira las filas que el
    # proveedor dejó de publicar (§3.7).

    # ─────────────────────── Control de acceso (§7, D-59…D-64) ───────────────────────

    ScopeKind:
      type: string
      description: |
        **Sobre qué eje de la identidad de `Team`** alcanza un puesto (D-60). No es un enumerado de
        negocio sino un **discriminante estructural**: sus valores son nombres de columnas de `Team` más
        `club` (todos), no una lista de cargos.

        Es lo que permite que "Coordinador Cadete", "Coordinador Juvenil" y los demás sean **un** puesto
        con distinto ámbito, en vez de siete puestos que hay que mantener a mano cada vez que la
        federación toca las categorías.
      enum: [club, modality, category, gender, team]

    Scope:
      type: object
      description: |
        Ámbito concreto de una asignación. **Exactamente el campo que corresponde al `kind` va informado**,
        y ninguno cuando el `kind` es `club`. En base de datos son cuatro columnas anulables y excluyentes
        con un `CHECK` (§3.5).
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/ScopeKind'
        teamId:
          type: [string, 'null']
          format: uuid
          description: Informado solo si `kind` es `team`.
        modality:
          oneOf:
            - $ref: '#/components/schemas/Modality'
            - type: 'null'
          description: Informado solo si `kind` es `modality`.
        category:
          oneOf:
            - $ref: '#/components/schemas/TeamCategory'
            - type: 'null'
          description: Informado solo si `kind` es `category`.
        gender:
          oneOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
          description: Informado solo si `kind` es `gender`.
        label:
          type: string
          readOnly: true
          description: |
            Rótulo legible del ámbito, **derivado en lectura** y no almacenado — mismo criterio que
            `isOwn` (D-03) o `isCurrent` (§3.2). Es lo que, junto al nombre del puesto, compone
            "Coordinador Cadete".
          examples: ['Cadete']

    StaffMemberResponse:
      type: object
      required: [id, fullName, email, hasAccount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        hasAccount:
          type: boolean
          readOnly: true
          description: |
            **Derivado en lectura**: cierto cuando la persona ya tiene cuenta vinculada. El `userId` de
            Supabase Auth **no se expone** — es un identificador externo (D-06, D-59) que el cliente no
            necesita y que no conviene publicar. Lo que la UI usa es este booleano, para saber si tiene
            sentido ofrecer "invitar".
        deletedAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateStaffMemberRequest:
      type: object
      required: [fullName, email]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          description: Único dentro del club. Es la dirección a la que se enviará la invitación.

    UpdateStaffMemberRequest:
      type: object
      description: Corrección parcial. Al menos una propiedad.
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email

    StaffPositionResponse:
      type: object
      required: [id, name, level, scopeKind, grantsAllVerbs, isTechnical, verbs, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Único dentro del club.
          examples: ['Coordinador']
        level:
          type: integer
          minimum: 0
          description: |
            Nivel en la pirámide, 0 arriba. **No autoriza escrituras** —eso lo hace el ámbito— sino que
            gobierna **quién puede nombrar a quién**: para asignar un puesto de nivel *N* hace falta una
            asignación propia de nivel estrictamente menor cuyo ámbito contenga al de destino (D-62).
        scopeKind:
          $ref: '#/components/schemas/ScopeKind'
        grantsAllVerbs:
          type: boolean
          readOnly: true
          description: |
            Comodín del puesto de administración (D-61). No es campo de entrada: solo lo lleva el puesto
            que nace en la precarga. Existe para que un endpoint nuevo **no nazca inaccesible** para todos
            hasta que alguien vaya a marcarlo, que sería un estropicio en cada *release*.
        isTechnical:
          type: boolean
          description: Cosmético — distingue personal técnico de administrativo para filtrar listas en la UI.
        verbs:
          type: array
          readOnly: true
          description: |
            Verbos vigentes del puesto. Se leen aquí y se escriben con
            `PUT /staff-positions/{id}/permissions`. **Vacío cuando `grantsAllVerbs` es cierto**: ese
            puesto no enumera, los tiene todos.
          items:
            type: string
          examples: [['player.create', 'player.update', 'goal.create']]
        deletedAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateStaffPositionRequest:
      type: object
      required: [name, level, scopeKind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        level:
          type: integer
          minimum: 1
          description: |
            Mínimo **1**: el nivel 0 está reservado al puesto de administración de la precarga, y no se
            puede crear otro por API — sería crearse un igual.
        scopeKind:
          $ref: '#/components/schemas/ScopeKind'
        isTechnical:
          type: boolean
          default: true

    UpdateStaffPositionRequest:
      type: object
      description: |
        Corrección parcial. **`scopeKind` no está**, y es estructural: la asignación lo duplica con FK
        compuesta para hacer imposible la deriva (D-62), así que cambiarlo dejaría huérfanas las
        asignaciones vigentes. Para cambiar de eje: puesto nuevo y reasignar.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        level:
          type: integer
          minimum: 1
        isTechnical:
          type: boolean

    SetPositionPermissionsRequest:
      type: object
      description: |
        **Sustituye el conjunto entero** (D-50, D-61). Lista vacía = puesto sin permisos, que es un estado
        legítimo. Idempotente y atómico: no hay estados intermedios en los que el puesto quede a medias.
      required: [verbs]
      properties:
        verbs:
          type: array
          items:
            type: string
          description: Identificadores del catálogo de `GET /permissions/verbs`.
          examples: [['player.create', 'player.update', 'player.delete']]

    VerbResponse:
      type: object
      description: |
        Un verbo autorizable = **un caso de uso** (D-61). No es un método HTTP: §5.1 usa sub-recursos de
        estado, el mismo método significa cosas distintas sobre el mismo recurso, y un caso de uso puede
        invocarse sin HTTP de por medio.
      required: [id, resource, label]
      properties:
        id:
          type: string
          description: Identificador estable, el que se guarda en el puesto.
          examples: ['player.delete']
        resource:
          type: string
          description: Recurso al que pertenece, para agrupar la pantalla de administración.
          examples: ['Player']
        label:
          type: string
          description: Rótulo legible.
          examples: ['Borrar un jugador']

    StaffMemberRef:
      type: object
      description: Proyección mínima de una persona embebida en otra respuesta (D-32).
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string

    StaffPositionRef:
      type: object
      description: Proyección mínima de un puesto embebido en otra respuesta (D-32).
      required: [id, name, level, scopeKind]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        level:
          type: integer
        scopeKind:
          $ref: '#/components/schemas/ScopeKind'

    StaffAssignmentResponse:
      type: object
      description: |
        Quién ocupa qué puesto, sobre qué ámbito y en qué temporada. **Embebe** persona y puesto como
        proyección, no como referencia (D-32): la pantalla que las lista necesita el nombre de las dos y
        no debe encadenar peticiones.
      required: [id, staffMember, position, seasonId, scope, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        staffMember:
          $ref: '#/components/schemas/StaffMemberRef'
        position:
          $ref: '#/components/schemas/StaffPositionRef'
        seasonId:
          type: string
          format: uuid
          description: |
            **Identidad, no atributo** (D-05, D-62): un cargo es de una temporada. Cambiarlo es otra
            asignación, y por eso este recurso no tiene `PATCH`.
        scope:
          $ref: '#/components/schemas/Scope'
        displayName:
          type: string
          readOnly: true
          description: |
            Rótulo compuesto **derivado**: nombre del puesto + rótulo del ámbito. Es lo que hace que
            "Coordinador Cadete" no tenga que existir como puesto (D-60).
          examples: ['Coordinador Cadete']
        deletedAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateStaffAssignmentRequest:
      type: object
      required: [staffMemberId, staffPositionId, seasonId, scope]
      properties:
        staffMemberId:
          type: string
          format: uuid
        staffPositionId:
          type: string
          format: uuid
        seasonId:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/Scope'

    EffectivePermission:
      type: object
      description: Qué puede hacer el actor sobre un ámbito concreto.
      required: [scope, verbs]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        verbs:
          type: array
          items:
            type: string

    MeResponse:
      type: object
      description: |
        Contexto del actor. **Conveniencia de UI, no autoridad** (D-63): un cliente que ignore esta
        respuesta no gana ningún permiso, porque la comprobación real ocurre en el caso de uso.

        `effectivePermissions` llega **desglosado por ámbito y no aplanado a una lista de verbos**, y es
        deliberado: aplanarlo perdería justo lo que hace correcto al modelo. Quien es Ayudante en un equipo
        y Entrenador en otro tiene verbos distintos según el objetivo, y una lista única daría los del
        segundo sobre el primero (D-62).
      required: [staffMember, seasonId, assignments, effectivePermissions]
      properties:
        staffMember:
          $ref: '#/components/schemas/StaffMemberResponse'
        seasonId:
          type: string
          format: uuid
          description: Temporada sobre la que se resolvieron las asignaciones.
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/StaffAssignmentResponse'
        effectivePermissions:
          type: array
          items:
            $ref: '#/components/schemas/EffectivePermission'

    # ─────────────────────────── Ingestión (§5.6, D-85) ───────────────────────
    IngestionRunResponse:
      type: object
      description: |
        Una pasada de ingesta: qué se sincronizó, cuándo, cómo acabó y qué se quedó fuera.

        **La única entidad del contrato que no describe al club sino a su sincronización** (D-85). No
        tiene `updatedAt` ni clave natural, y las dos ausencias son deliberadas: una pasada no se
        modifica, y dos pasadas de la misma competición en el mismo minuto son un reintento, no un
        duplicado.
      required: [id, competitionId, startedAt, finishedAt, outcome, counters, skipped]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        competitionId:
          type: string
          format: uuid
          readOnly: true
        startedAt:
          type: string
          format: date-time
          readOnly: true
        finishedAt:
          type: string
          format: date-time
          readOnly: true
        outcome:
          $ref: '#/components/schemas/IngestionOutcome'
        error:
          type: [string, 'null']
          readOnly: true
          description: |
            Motivo del fallo, si lo hubo. **Texto y no un código**: los fallos que llegan aquí son de la
            fuente, del esquema o de una invariante, y enumerarlos sería inventar una taxonomía antes de
            haber visto los casos (D-85).
          examples: ['FederationError: la coordenada devolvió otra competición']
        counters:
          $ref: '#/components/schemas/IngestionCounters'
        skipped:
          type: array
          readOnly: true
          description: |
            Lo que la pasada **no** escribió, y por qué. Vacío es el caso normal. **No hace parcial a la
            pasada**: un partido sin fecha es un dato que la fuente no ha publicado todavía, no un fallo
            (D-83).
          items:
            $ref: '#/components/schemas/IngestionSkip'

    IngestionHealth:
      type: string
      description: |
        Cómo está la sincronización de esta competición (D-89). **Derivado en lectura**, como `isCurrent`
        o `displayName` — no hay columna detrás.

        **Lo deriva el servidor y no el cliente**, y ésa es la decisión: `stale` depende del **tope semanal
        de §5.6** (irrecuperable por D-55), que es una regla de negocio. Calculada en el cliente, la
        reimplementarían por separado la web, iOS y Android, y se desincronizarían el día que el tope
        cambie.

        **Los casos se evalúan en este orden**, porque se solapan:

        | Valor | Cuándo |
        |---|---|
        | `failing` | la **última pasada falló** — hay algo que mirar, y su motivo está en `/ingestion-runs` |
        | `never` | nunca hubo una pasada con éxito (recién enganchada, o la primera aún encolada) |
        | `stale` | el último éxito es de hace **más de una semana**: §5.6 dice que eso no debe pasar |
        | `ok` | el resto |
      enum: [ok, failing, stale, never]

    IngestionOutcome:
      type: string
      description: |
        Cómo acabó la pasada. **Dos valores y no tres**: no hay *parcial* porque la pasada es atómica
        (D-83) — o se escribió entera o no se escribió nada.
      enum: [succeeded, failed]

    IngestionCounters:
      type: object
      description: Cuántas filas creó y actualizó la pasada, por entidad.
      required:
        [opponentClubsCreated, opponentClubsUpdated, teamsCreated, teamsUpdated,
         roundsCreated, roundsUpdated, matchesCreated, matchesUpdated]
      properties:
        opponentClubsCreated: { type: integer, minimum: 0, readOnly: true }
        opponentClubsUpdated: { type: integer, minimum: 0, readOnly: true }
        teamsCreated: { type: integer, minimum: 0, readOnly: true }
        teamsUpdated: { type: integer, minimum: 0, readOnly: true }
        roundsCreated: { type: integer, minimum: 0, readOnly: true }
        roundsUpdated: { type: integer, minimum: 0, readOnly: true }
        matchesCreated: { type: integer, minimum: 0, readOnly: true }
        matchesUpdated: { type: integer, minimum: 0, readOnly: true }

    IngestionSkip:
      type: object
      description: |
        Una fila que la pasada dejó fuera, con su motivo. **No contradice D-79**: la *marca para revisión*
        sigue sin ser columna de la fila emparejada — esto describe la **pasada**. Resolver un descarte no
        consiste en tocar una bandera: se vuelve a pasar, y la siguiente ya no lo reporta.
      required: [reason, detail]
      properties:
        reason:
          $ref: '#/components/schemas/IngestionSkipReason'
        detail:
          type: string
          description: |
            Con qué encontrar la fila en la fuente: el nombre del equipo, el `codacta`, lo que haya.
            **Texto**, porque va a un informe que lee una persona.
          examples: ['C.D. Galapagar "B"']

    IngestionSkipReason:
      type: string
      description: |
        Por qué se quedó fuera. Los tres `ambiguous_*` son el desenlace de D-79 —*no se elige ni se crea:
        se reporta*—; `unresolved_team` es su arrastre al partido; `missing_match_date` es D-75 negándose
        a inventar una fecha `NOT NULL`; y `duplicate_club_name` es la guarda del `UNIQUE(name)` de §3.5,
        sin la cual una coincidencia de nombre reventaría la transacción de toda la pasada.
      enum:
        - ambiguous_opponent_club
        - ambiguous_team
        - ambiguous_match
        - unresolved_team
        - missing_match_date
        - unsluggable_club_name
        - duplicate_club_name

    TriggerIngestionRequest:
      type: object
      description: |
        Qué parte del club sincronizar. **Los dos campos son las dos filas de la coordenada de la
        federación** (§3.7): `temporada` es `Season`, y `competicion` + `grupo` juntos son **una**
        `Competition` (§3.5). Por eso no hay campo de grupo — ya está dentro de la competición.

        **`{}` ⇒ la temporada vigente entera** (§3.2). El cuerpo es obligatorio aunque todos sus campos
        sean opcionales: omitirlo del todo devuelve 400, porque el servidor generado lo parsea igual.
      properties:
        seasonId:
          type: string
          format: uuid
          description: |
            Solo las competiciones de esta temporada. Sin esto, la vigente. **Una temporada que no exista
            no cae a la vigente**: da 404 (D-84).
        competitionIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: |
            Solo éstas. Gana sobre `seasonId` por ser más específica, y **no pasa por el filtro de
            temporada vigente**: quien las pide por su id ya sabe cuáles quiere.

            **Es una lista y no un id suelto** porque la pantalla que la usa es una lista de equipos con
            una casilla al lado: resincronizar tres es *una* acción del usuario, y partirla en tres
            peticiones le traslada al navegador el manejo de tres respuestas, tres errores parciales y tres
            estados de carga.

            **Con exactamente un elemento la respuesta es 200**; con dos o más, 202. Una lista **vacía**
            es 400: no significa "todas", significa que el cliente no ha decidido.

    IngestionAcceptedResponse:
      type: object
      description: Qué se ha aceptado recorrer. El resultado se consulta con `GET /ingestion-runs`.
      required: [competitionIds]
      properties:
        competitionIds:
          type: array
          description: |
            Las competiciones que entran en el recorrido, en el orden en que se van a sincronizar. **Vacío
            es una respuesta legítima**: significa que el club no tiene competiciones dadas de alta en esa
            temporada, no que haya fallado nada.
          items:
            type: string
            format: uuid
