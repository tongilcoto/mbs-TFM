# Configuración del plugin de generación (D-65, §5.5).
#
# El spec vivía en `backend/openapi/openapi.yaml`; se movió aquí porque es donde
# el plugin de swift-openapi-generator lo espera —junto a este fichero, dentro
# del target que lo consume—. Cierra §9.1 del LLD.

generate:
  - types       # DTOs de `components/schemas`
  - server      # `APIProtocol`: un método por operationId, que el servidor conforma

accessModifier: public

# ─────────────────────────────────────────────────────────────────────────────
# EL FILTRO ES EL TRINQUETE DEL ALCANCE.
#
# `APIProtocol` declara un método por operación generada, y conformarlo obliga a
# implementarlas TODAS. Con las 85 operaciones del spec completo, la fase F0
# tendría que escribir 83 stubs que lanzan "no implementado" — ruido que además
# apaga la garantía de D-65, porque un stub compila igual de bien que un handler.
#
# En su lugar se genera **solo lo implementado**. Cada fase del plan de
# desarrollo añade aquí sus operaciones, y el compilador vuelve a exigir que
# estén todas. La lista de abajo es, literalmente, el alcance entregado.
#
# El spec NO se toca: sigue completo y sigue siendo la fuente de verdad. Esto
# solo elige qué parte de él se traduce a Swift hoy.
# ─────────────────────────────────────────────────────────────────────────────
filter:
  operations:
    - getClub             # F0 — el esqueleto que camina
    - updateClub          # F0 — el camino de escritura, para tener con qué practicar
    - listIngestionRuns   # F6 — el registro de las pasadas (D-85), para el backoffice
    - triggerIngestion    # F6 — el disparador manual del job (D-87)
    - previewFederationLink   # F10 — paso 1 del enganche (D-67): lee la coordenada, no persiste
    - linkTeamToFederation    # F10 — paso 2 (D-67): escribe el enganche en cascada y encola la ingesta
    - listSeasons             # R1 — las temporadas, para el selector de la portada del backoffice
    - listCompetitions        # R1 — las competiciones, con sus filtros, para la portada del backoffice
    - listSeasonRegistrations # R1 — los equipos de una temporada, con sus competiciones (D-102)
    - createSeason            # R2 — la temporada nace en la web, sin código de la federación (D-106)
    - createTeam              # R2 — el alta de equipo; si ya existe, lo inscribe en la temporada (D-107)
    - getTeam                 # R3 — un equipo, propio o rival, para la pantalla del enganche
    - getTeamRegistration     # R4 — el equipo en una temporada, para la ficha del equipo

  # D-109: las listas cerradas que llevan nombres en el catálogo (`x-enum-names`), se usen ya o no. El generador
  # solo fabrica los tipos de las operaciones de arriba, y `EnumNamesTool` escribe el nombre de cada valor como
  # extensión de su tipo: sin el tipo, no compila. Si falta una, la compilación para y dice cuál.
  schemas:
    - TeamCategory
    - Gender
    - Modality
    - MatchStatus
    - MatchOutcome
    - PlayerPosition
    - AbsenceType
    - AppearanceStatus
    - CardType
    - GoalZone
    - GoalSide
    - GoalBodyPart
    - GoalPlayType
    - FederationCode
    - ScopeKind
    - IngestionKind
    - IngestionHealth
    - IngestionOutcome
    - IngestionSkipReason
