# Configuración del plugin de generación (D-65, §5.5).
#
# El spec vivía en `backend/openapi/openapi.yaml`; se movió aquí porque es donde
# el plugin de swift-openapi-generator lo espera —junto a este fichero, dentro
# del target que lo consume—. Cierra §9.1 del LLD.

generate:
  - types       # DTOs de `components/schemas`
  - server      # `APIProtocol`: un método por operationId, que el servidor conforma

accessModifier: public

# ─────────────────────────────────────────────────────────────────────────────
# EL FILTRO ES EL TRINQUETE DEL ALCANCE.
#
# `APIProtocol` declara un método por operación generada, y conformarlo obliga a
# implementarlas TODAS. Con las 85 operaciones del spec completo, la fase F0
# tendría que escribir 83 stubs que lanzan "no implementado" — ruido que además
# apaga la garantía de D-65, porque un stub compila igual de bien que un handler.
#
# En su lugar se genera **solo lo implementado**. Cada fase del plan de
# desarrollo añade aquí sus operaciones, y el compilador vuelve a exigir que
# estén todas. La lista de abajo es, literalmente, el alcance entregado.
#
# El spec NO se toca: sigue completo y sigue siendo la fuente de verdad. Esto
# solo elige qué parte de él se traduce a Swift hoy.
# ─────────────────────────────────────────────────────────────────────────────
filter:
  operations:
    - getClub             # F0 — el esqueleto que camina
    - updateClub          # F0 — el camino de escritura, para tener con qué practicar
    - listIngestionRuns   # F6 — el registro de las pasadas (D-85), para el backoffice
    - triggerIngestion    # F6 — el disparador manual del job (D-87)
    - previewFederationLink   # F10 — paso 1 del enganche (D-67): lee la coordenada, no persiste
    - linkTeamToFederation    # F10 — paso 2 (D-67): escribe el enganche en cascada y encola la ingesta
    - listSeasons             # R1 — las temporadas, para el selector de la portada del backoffice
    - listCompetitions        # R1 — las competiciones, con sus filtros, para la portada del backoffice
    - listSeasonRegistrations # R1 — los equipos de una temporada, con sus competiciones (D-102)
    - createSeason            # R2 — la temporada nace en la web, sin código de la federación (D-106)
    - createTeam              # R2 — el alta de equipo; si ya existe, lo inscribe en la temporada (D-107)
    - getTeam                 # R3 — un equipo, propio o rival, para la pantalla del enganche
    - getTeamRegistration     # R4 — el equipo en una temporada, para la ficha del equipo
    - listRounds              # R4 — las jornadas de una competición, con la que está en curso
    - getRound                # R4 — una jornada, para la pantalla de jornada y clasificación
    - getStanding             # R4 — la clasificación de una jornada, con la racha calculada
    - listMatches             # R4 — los partidos de una jornada, una competición o un equipo, con su fila de clasificación (D-112)
    - listPlayers             # R6.6 — la plantilla de un equipo en una temporada (D-118: por dorsal, luego por nombre)
    - getPlayer               # R6.6 — un jugador en una temporada, con el nombre y el año de su perfil (D-119)
    - createPlayer            # R6.6 — el alta, con perfil o jugador nuevo (D-120); copia lo suyo al perfil (D-122)
    - updatePlayer            # R6.6 — corregir con la ficha entera (PUT); nombre y año al perfil, el resto a la fila
    - deletePlayer            # R6.6 — la baja, borrado lógico (D-36)
    - searchPlayerProfiles    # R6.7 — el buscador del alta: sin tildes, palabra a palabra, sin los de esa plantilla (D-120)
    - uploadPlayerPhoto       # R6.9 — subir o cambiar la foto: saneada (D-116), clave nueva, también al perfil (D-122)
    - deletePlayerPhoto       # R6.9 — quitar la foto de la fila y del perfil; el fichero, si ya no lo usa nadie
    - getPlayerPhotoFile      # R6.9 — el fichero, si el enlace firmado vale (D-117); solo con la carpeta del disco
    - syncTeamRoster          # R6.14 — sincronizar la plantilla con la federación: solo añade, solo en la en curso (D-120)
    - getMatch                # R7.6 — la cabecera del acta: el partido, la fecha de la carga y los que el club ha quitado (D-134)
    - listAppearances         # R7.6 — la convocatoria de un partido o el historial de un jugador; sin fila, «no convocado» (D-134)
    - getAppearance           # R7.6 — una convocatoria, con si ha cambiado respecto al acta
    - createAppearance        # R7.6 — apuntar a un jugador, con el equipo con el que juega (D-128) y su estado según la hora (D-133)
    - updateAppearance        # R7.6 — corregir el estado, el dorsal o los minutos; dejar «Jugado» borra los minutos
    - deleteAppearance        # R7.6 — anular: «no convocado» (D-134), borrado lógico
    - listGoals               # R7.7 — los goles de un partido, un equipo o un jugador, paginados (D-47, D-49)
    - getGoal                 # R7.7 — un gol, con su desglose
    - createGoal              # R7.7 — apuntar un gol: desde la hora y sin el acta cargada (D-133, D-137); el que encaja lo pone el servidor (D-54)
    - updateGoal              # R7.7 — completar o corregir; en uno del acta, lo de la federación queda fijo (D-135)
    - deleteGoal              # R7.7 — borrar un gol del club; uno del acta no se borra (D-137)
    - listCards               # R7.8 — las tarjetas de un partido, de un jugador o de los dos (D-47)
    - getCard                 # R7.8 — una tarjeta
    - createCard              # R7.8 — apuntar una tarjeta con el equipo del partido (D-128); la segunda amarilla, una roja (D-45)
    - updateCard              # R7.8 — corregir; en una del acta, solo el comentario (D-136)
    - deleteCard              # R7.8 — borrar una tarjeta del club; una del acta no se borra (D-137)
    - listTeamReinforcements  # R7.9 — los refuerzos de la plantilla, ya contados: la operación 89 (D-128)

  # D-109: las listas cerradas que llevan nombres en el catálogo (`x-enum-names`), se usen ya o no. El generador
  # solo fabrica los tipos de las operaciones de arriba, y `EnumNamesTool` escribe el nombre de cada valor como
  # extensión de su tipo: sin el tipo, no compila. Si falta una, la compilación para y dice cuál.
  schemas:
    - TeamCategory
    - Gender
    - Modality
    - MatchStatus
    - MatchOutcome
    - PlayerPosition
    - AbsenceType
    - AppearanceStatus
    - CardType
    - GoalZone
    - GoalSide
    - GoalBodyPart
    - GoalPlayType
    - FederationCode
    - ScopeKind
    - IngestionKind
    - IngestionHealth
    - IngestionOutcome
    - IngestionSkipReason
    - NamesDictionarySkipReason
