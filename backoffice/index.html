<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backoffice</title>
    <script>
      // Modo claro u oscuro, ANTES de pintar nada, para que no haya destello blanco (LLD-B §9.3).
      // Manda la elección guardada (`tema`, la única excepción del LLD-B §2.3); si no hay, el sistema.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('tema')
        } catch (e) {}
        var dark = saved ? saved === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('app-dark')
      })()
    </script>
    <style>
      /* El fondo y el texto de la página siguen al modo desde el primer pintado: los del navegador (Canvas)
         hasta que PrimeVue carga, y después los de la paleta (src/theme/palette.ts). */
      html { color-scheme: light; }
      html.app-dark { color-scheme: dark; }
      body {
        margin: 0;
        background: var(--p-fondo, Canvas);
        color: var(--p-text-color, CanvasText);
        font-family: system-ui, sans-serif;
      }
      /* Los enlaces, del color principal del tema, no del azul del navegador, que en modo oscuro no se lee. */
      a { color: var(--p-primary-color, LinkText); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
