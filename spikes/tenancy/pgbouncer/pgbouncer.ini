;; PgBouncer del spike, en MODO TRANSACCIÓN — que es como Supabase (Supavisor) sirve
;; las conexiones de aplicación, y la única razón de que este servicio exista.
;;
;; Todo aquí está elegido para que la prueba diga algo, no para parecerse a producción.
[databases]
tfm_spike = host=db port=5432 dbname=tfm_spike

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; EL parámetro bajo prueba. En `transaction`, la conexión de servidor se devuelve al
;; pool al cerrar cada transacción, y la siguiente transacción del mismo cliente puede
;; caer en otra. Es lo que rompe todo estado de sesión.
pool_mode = transaction

auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

;; default_pool_size = 1 fuerza a que TODOS los clientes compartan UNA conexión de
;; servidor. Sin esto la fuga entre tenants sería probabilística y el test, inservible.
default_pool_size = 1
max_client_conn = 200
min_pool_size = 0
reserve_pool_size = 0

;; Se dejan en su VALOR POR DEFECTO a propósito, y conviene saber cuáles son:
;;   server_reset_query = DISCARD ALL
;;   server_reset_query_always = 0   ← ¡solo se aplica en pool_mode = session!
;; Es decir: en modo transacción PgBouncer NO limpia la conexión entre clientes.
;; Ese default es justo lo que convierte un `SET search_path` de sesión en una fuga.

;; No hace falta `ignore_startup_parameters`: comprobado que postgres-nio no manda en el
;; startup ninguno de los parámetros que PgBouncer rechaza por defecto. Se anota porque es
;; el primer sitio donde mirar si un día la conexión empieza a fallar con
;; "unsupported startup parameter".

admin_users = tfm
log_connections = 0
log_disconnections = 0

